<style>

body {

/* 工具栏 */

}

.run-status.running { background: var(--accent-green); animation: pulse-run 1.5s infinite; }

.deps-progress-bar {

.terminal-body {

.terminal-body::-webkit-scrollbar { width: 8px; }

.terminal-output { white-space: pre-wrap; word-break: break-all; }
.terminal-output .stdout { color: var(--term-stdout); }

/* 欢迎/起始画面 */

<script>
const $ = id => document.getElementById(id);
let monacoEditor = null;
let isRunning = false;
let runAbortController = null;
let currentRunId = null;

// ==================== 主题切换 ====================
(function(){
  const root = document.documentElement;
  const stored = localStorage.getItem('theme');
  if (stored) root.setAttribute('data-theme', stored);
  else if (window.matchMedia('(prefers-color-scheme: light)').matches) root.setAttribute('data-theme', 'light');

  $('themeToggle').addEventListener('click', () => {
    const current = root.getAttribute('data-theme');
    const next = current === 'light' ? '' : 'light';
    if (next) { root.setAttribute('data-theme', next); localStorage.setItem('theme', next); }
    else { root.removeAttribute('data-theme'); localStorage.removeItem('theme'); }
    if (monacoEditor) {
      monacoEditor.updateOptions({ theme: next ? 'vs' : 'vs-dark' });
    }
  });
})();

// ==================== 示例代码 ====================
const DEFAULT_CODE = `# =============================================
# Python 在线编程 - 示例代码
# 点击「运行」或按 Ctrl+Enter 执行
# =============================================

def fibonacci(n):
    """计算斐波那契数列前 n 项"""
    seq = []
    a, b = 0, 1
    for _ in range(n):
        seq.append(a)
        a, b = b, a + b
    return seq

def main():
    print("Hello, Python World! 🐍")
    print()
    print("=== 斐波那契数列前 10 项 ===")
    result = fibonacci(10)
    for i, num in enumerate(result, 1):
        print(f"第 {i:2d} 项: {num}")
    print()
    print("=== 数据类型演示 ===")
    name = "CodingZhou"
    version = 3.12
    is_awesome = True
    skills = ["Python", "Web", "AI"]
    print(f"项目: {name}  版本: {version}  是否有趣: {is_awesome}")
    print(f"技能列表: {', '.join(skills)}")

if __name__ == "__main__":
    main()
`;

// ==================== 编辑器初始化 ====================
function loadExample() {
  $('welcomeBox').style.display = 'none';
  $('editorHost').style.display = 'block';
  initEditor();
}

function initEditor() {
  if (monacoEditor) return;
  const root = document.documentElement;
  const isLight = root.getAttribute('data-theme') === 'light';
  require(['vs/editor/editor.main'], function () {
    monacoEditor = monaco.editor.create($('editorHost'), {
      value: DEFAULT_CODE,
      language: 'python',
      theme: isLight ? 'vs' : 'vs-dark',
      fontSize: 14,
      fontFamily: "'JetBrains Mono','Cascadia Code','Fira Code','Consolas',monospace",
      lineHeight: 22,
      minimap: { enabled: false },
      scrollBeyondLastLine: false,
      automaticLayout: true,
      tabSize: 4,
      insertSpaces: true,
      wordWrap: 'on',
      padding: { top: 10 },
      renderWhitespace: 'none',
      smoothScrolling: true,
    });
    monacoEditor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.Enter, runPythonCode);
    $('btnRunLabel').textContent = '运行';
  });
}

// ==================== 终端操作 ====================
function showTerminal() { $('terminalPanel').style.display = 'flex'; }
function hideTerminal() { $('terminalPanel').style.display = 'none'; }
function appendToTerminal(text, className = 'stdout') {
  const output = $('terminalOutput');
  const div = document.createElement('div');
  div.className = className;
  div.textContent = text;
  output.appendChild(div);
  output.scrollTop = output.scrollHeight;
}

function setRunStatus(status, text) {
  const el = $('runStatus');
  const btnRun = $('btnRun');
  const btnStop = $('btnStop');
  if (!status) {
    el.style.display = 'none';
    btnRun.style.display = '';
    btnStop.style.display = 'none';
    $('btnRunLabel').textContent = '运行';
    return;
  }
  el.style.display = '';
  el.className = 'run-status ' + status;
  el.textContent = text;
  if (status === 'running' || status === 'preparing' || status === 'installing' || status === 'copying' || status === 'venv' || status === 'analyzing') {
    $('btnRunLabel').textContent = '运行中...';
    btnStop.style.display = '';
  } else {
    $('btnRunLabel').textContent = '运行';
    btnStop.style.display = 'none';
  }
}

function showDepsProgress(text, progress) {
  $('depsProgress').style.display = 'flex';
  $('depsProgressText').textContent = text;
  if (typeof progress === 'number' && progress >= 0) {
    $('depsProgressBar').style.width = Math.min(100, Math.max(0, progress)) + '%';
  }
}
function hideDepsProgress() {
  $('depsProgress').style.display = 'none';
  $('depsProgressBar').style.width = '0%';
}

// ==================== 运行代码 (SSE) ====================
async function runPythonCode() {
  if (isRunning) return;
  if (!monacoEditor) return;

  showTerminal();
  const output = $('terminalOutput');
  output.innerHTML = '';
  hideDepsProgress();

  const code = monacoEditor.getValue();
  const body = { mode: 'single', timeout: 120, code: code, fileName: 'script.py' };
  appendToTerminal('========== 单文件运行 ==========', 'info');

  setRunStatus('preparing', '准备中...');
  isRunning = true;
  runAbortController = new AbortController();
  currentRunId = null;

  try {
    const res = await fetch('/api/run/start', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
      signal: runAbortController.signal,
    });
    if (!res.ok) {
      let errMsg = 'HTTP ' + res.status;
      try { errMsg = (await res.json()).error || errMsg; } catch (e) {}
      throw new Error(errMsg);
    }
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let sseBuffer = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      sseBuffer += decoder.decode(value, { stream: true });
      const parts = sseBuffer.split('\n\n');
      sseBuffer = parts.pop() || '';
      for (const part of parts) {
        const lines = part.split('\n');
        let eventType = 'message';
        let dataStr = '';
        for (const line of lines) {
          if (line.startsWith('event: ')) eventType = line.substring(7).trim();
          else if (line.startsWith('data: ')) dataStr += line.substring(6);
        }
        if (!dataStr) continue;
        try {
          const data = JSON.parse(dataStr);
          switch (eventType) {
            case 'status':
              if (data.runId) currentRunId = data.runId;
              setRunStatus(data.phase, data.message);
              appendToTerminal('[系统] ' + data.message, 'info');
              break;
            case 'deps':
              setRunStatus('installing', '安装依赖...');
              if (data.phase === 'installing' || data.phase === 'requirements_found') {
                showDepsProgress(data.message || '安装依赖中...', 5);
                appendToTerminal('[依赖] ' + data.message, 'info');
              } else if (data.phase === 'installing_package') {
                const idx = data.index || 0;
                const total = data.total || 1;
                const pct = 10 + Math.round((idx / total) * 80);
                showDepsProgress(data.message || '安装中...', pct);
                appendToTerminal('[依赖] ' + data.message, 'info');
              } else if (data.phase === 'package_installed') {
                // 已安装，不重复打印
              } else if (data.phase === 'installed') {
                showDepsProgress(data.message || '依赖安装完成', 100);
                appendToTerminal('[依赖] ' + data.message, 'info');
                setTimeout(() => hideDepsProgress(), 1500);
              } else if (data.phase === 'pip_output') {
                if (data.line) appendToTerminal('  ' + data.line, 'stdout');
              } else {
                showDepsProgress(data.message || '安装依赖中...');
                appendToTerminal('[依赖] ' + data.message, 'info');
              }
              if (data.error) appendToTerminal('[依赖警告] ' + data.error, 'stderr');
              break;
            case 'stdout':
              appendToTerminal(data.text, 'stdout');
              break;
            case 'stderr':
              appendToTerminal(data.text, 'stderr');
              break;
            case 'exit':
              hideDepsProgress();
              appendToTerminal('', 'stdout');
              if (data.code === 0) {
                appendToTerminal('========== ' + data.message + ' ==========', 'success');
                setRunStatus(null);
              } else if (data.timedOut) {
                appendToTerminal('========== ' + data.message + ' ==========', 'error');
                setRunStatus('error', '超时');
              } else {
                appendToTerminal('========== ' + data.message + ' ==========', 'error');
                setRunStatus('error', '出错');
              }
              isRunning = false;
              break;
            case 'error':
              hideDepsProgress();
              appendToTerminal('[错误] ' + data.message, 'error');
              setRunStatus('error', '失败');
              isRunning = false;
              break;
          }
        } catch (parseErr) {
          console.error('SSE parse error:', parseErr, dataStr);
        }
      }
    }
  } catch (e) {
    hideDepsProgress();
    if (e.name === 'AbortError') {
      appendToTerminal('[已被用户停止]', 'info');
      setRunStatus(null);
    } else {
      appendToTerminal('错误: ' + (e.message || e), 'error');
      setRunStatus('error', '失败');
    }
    isRunning = false;
  }
}

async function stopPythonCode() {
  if (!isRunning) return;
  if (runAbortController) runAbortController.abort();
  if (currentRunId) {
    try {
      await fetch('/api/run/stop', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ runId: currentRunId }),
      });
    } catch (e) {}
  }
  setRunStatus(null);
  isRunning = false;
  hideDepsProgress();
}

async function copyCode() {
  if (!monacoEditor) return;
  try {
    await navigator.clipboard.writeText(monacoEditor.getValue());
    const btn = $('btnCopy');
    btn.textContent = '已复制 ✓';
    setTimeout(() => {
      btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg> 复制';
    }, 1500);
  } catch (e) {
    appendToTerminal('复制失败: ' + e.message, 'error');
  }
}

// ==================== 事件绑定 ====================
$('btnRun').addEventListener('click', runPythonCode);
$('btnStop').addEventListener('click', stopPythonCode);
$('btnCopy').addEventListener('click', copyCode);
$('btnLoadExample').addEventListener('click', loadExample);
$('btnTerminalClose').addEventListener('click', hideTerminal);

document.addEventListener('keydown', function(e) {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    e.preventDefault();
    runPythonCode();
  }
});
</script>

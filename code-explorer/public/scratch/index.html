<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scratch 编辑器 - Code Explorer</title>
<style>
  :root {
    --bg-primary: #0a0e1a;
    --bg-secondary: rgba(22, 27, 34, 0.85);
    --bg-tertiary: rgba(33, 38, 45, 0.9);
    --border-color: rgba(88, 166, 255, 0.2);
    --text-primary: #e6edf3;
    --text-secondary: #8b949e;
    --text-tertiary: #6e7681;
    --accent-blue: #58a6ff;
    --accent-green: #3fb950;
    --accent-red: #f85149;
    --accent-purple: #a371f7;
    --accent-yellow: #d29922;
    --radius-sm: 6px;
    --radius-md: 8px;
    --radius-lg: 12px;
    --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    --font-mono: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    background: var(--bg-primary);
    font-family: var(--font-sans);
    color: var(--text-primary);
    overflow: hidden;
  }

  /* ===== 加载遮罩 ===== */
  #loadingOverlay {
    position: fixed;
    inset: 0;
    background: var(--bg-primary);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    transition: opacity 0.4s ease;
  }
  #loadingOverlay.fade-out {
    opacity: 0;
    pointer-events: none;
  }
  .loader {
    width: 56px;
    height: 56px;
    border: 4px solid var(--border-color);
    border-top-color: var(--accent-blue);
    border-right-color: var(--accent-purple);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 20px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loadingText {
    color: var(--text-secondary);
    font-size: 14px;
    letter-spacing: 1px;
  }

  /* ===== 认证页 ===== */
  #authScreen {
    display: none;
    position: fixed;
    inset: 0;
    background: var(--bg-primary);
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    gap: 24px;
  }
  #authScreen.active { display: flex; }
  .auth-card {
    background: var(--bg-secondary);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    padding: 40px 48px;
    text-align: center;
    width: 380px;
    backdrop-filter: blur(12px);
  }
  .auth-card h2 {
    font-size: 22px;
    color: var(--text-primary);
    margin-bottom: 8px;
    font-weight: 700;
  }
  .auth-card p {
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 24px;
  }
  .auth-input {
    width: 100%;
    padding: 12px 16px;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);
    background: var(--bg-tertiary);
    color: var(--text-primary);
    font-size: 14px;
    font-family: var(--font-mono);
    margin-bottom: 16px;
    outline: none;
    transition: border-color 0.2s;
  }
  .auth-input:focus { border-color: var(--accent-blue); }
  .auth-input::placeholder { color: var(--text-tertiary); }
  .auth-btn {
    width: 100%;
    padding: 12px;
    background: linear-gradient(135deg, var(--accent-blue), #4a90e2);
    border: none;
    border-radius: var(--radius-sm);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .auth-btn:hover { opacity: 0.9; }
  .auth-error {
    font-size: 12px;
    color: var(--accent-red);
    margin-top: 8px;
    display: none;
  }
  .auth-error.show { display: block; }
  .auth-hint {
    font-size: 12px;
    color: var(--text-tertiary);
    margin-top: 16px;
  }

  /* ===== 编辑器容器 ===== */
  #editorContainer {
    display: none;
    width: 100%;
    height: 100%;
    flex-direction: column;
  }
  #editorContainer.active { display: flex; }

  /* ===== 顶部工具栏 ===== */
  #toolbar {
    height: 44px;
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    padding: 0 12px;
    gap: 8px;
    flex-shrink: 0;
    z-index: 100;
    backdrop-filter: blur(8px);
  }
  .tb-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    background: transparent;
    border: 1px solid transparent;
    border-radius: var(--radius-sm);
    color: var(--text-primary);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
    font-family: var(--font-sans);
    white-space: nowrap;
  }
  .tb-btn:hover {
    background: var(--bg-tertiary);
    border-color: var(--border-color);
  }
  .tb-btn svg { width: 16px; height: 16px; flex-shrink: 0; }
  .tb-btn-icon { padding: 7px; }
  .tb-btn-danger { color: var(--accent-red); }
  .tb-btn-danger:hover { background: rgba(248,81,73,0.1); border-color: rgba(248,81,73,0.3); }
  .tb-sep {
    width: 1px;
    height: 24px;
    background: var(--border-color);
    margin: 0 4px;
  }
  .tb-spacer { flex: 1; }
  .tb-status {
    font-size: 12px;
    color: var(--text-secondary);
    font-family: var(--font-mono);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .tb-status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent-green);
    box-shadow: 0 0 8px rgba(63,185,80,0.5);
  }

  /* ===== 编辑器主体 ===== */
  #editorBody {
    flex: 1;
    position: relative;
    overflow: hidden;
    background: #0d1117;
  }
  #scratchFrame {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }

  /* ===== 文件选择（隐藏） ===== */
  #fileInput { display: none; }

  /* ===== Toast 通知 ===== */
  #toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--bg-tertiary);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);
    padding: 10px 20px;
    font-size: 13px;
    color: var(--text-primary);
    opacity: 0;
    transition: all 0.3s ease;
    z-index: 9999;
    pointer-events: none;
    backdrop-filter: blur(12px);
    font-family: var(--font-mono);
  }
  #toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ===== 项目文件选择区 ===== */
  #projectDrop {
    position: fixed;
    inset: 44px 0 0 0;
    background: rgba(88,166,255,0.15);
    border: 3px dashed var(--accent-blue);
    border-radius: var(--radius-md);
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    color: var(--accent-blue);
    font-weight: 600;
    z-index: 200;
    backdrop-filter: blur(4px);
  }
  #projectDrop.active { display: flex; }
</style>
</head>
<body>

<!-- 加载遮罩 -->
<div id="loadingOverlay">
  <div class="loader"></div>
  <div id="loadingText">验证登录状态中...</div>
</div>

<!-- 认证页 -->
<div id="authScreen">
  <div class="auth-card">
    <h2>🔐 登录以使用 Scratch</h2>
    <p>请先输入访问密码</p>
    <input type="password" class="auth-input" id="authPassword" placeholder="输入密码" autocomplete="off">
    <button class="auth-btn" id="authSubmit">登 录</button>
    <div class="auth-error" id="authError"></div>
    <div class="auth-hint">前往 <a href="/web-games/" style="color:var(--accent-blue);text-decoration:none">网页游戏中心</a> 登录</div>
  </div>
</div>

<!-- 编辑器容器 -->
<div id="editorContainer">
  <!-- 顶部工具栏 -->
  <div id="toolbar">
    <button class="tb-btn" id="tbBack" title="返回主页">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      返回
    </button>
    <div class="tb-sep"></div>

    <button class="tb-btn" id="tbNew" title="新建项目">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      新建
    </button>
    <button class="tb-btn" id="tbLoad" title="加载 .sb3 文件">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
      加载
    </button>
    <button class="tb-btn" id="tbSave" title="保存项目">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2zM17 21v-8H7v8M7 3v5h8"/></svg>
      保存
    </button>
    <button class="tb-btn" id="tbFull" title="全屏模式">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 00-2 2v3M21 8V5a2 2 0 00-2-2h-3M3 16v3a2 2 0 002 2h3M16 21h3a2 2 0 002-2v-3"/></svg>
      全屏
    </button>

    <div class="tb-spacer"></div>

    <span class="tb-status">
      <span class="tb-status-dot"></span>
      <span id="statusText">编辑器就绪</span>
    </span>
    <div class="tb-sep"></div>
    <button class="tb-btn tb-btn-danger" id="tbLogout" title="退出登录">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
      退出
    </button>
  </div>

  <!-- 编辑器主体 -->
  <div id="editorBody">
    <iframe id="scratchFrame" title="Scratch Editor"></iframe>
  </div>

  <!-- 文件输入 -->
  <input type="file" id="fileInput" accept=".sb3">

  <!-- 拖拽提示 -->
  <div id="projectDrop">📦 松开加载 Scratch 项目文件 (.sb3)</div>
</div>

<!-- Toast -->
<div id="toast"></div>

<script>
(function() {
  'use strict';

  // ===== 常量 =====
  const AUTH_CHECK_URL = '/api/auth-check';
  const LOGIN_URL = '/api/login';
  const LOGOUT_URL = '/api/logout';
  const COOKIE_NAME = 'wg_token';
  const SCRATCH_CDN = 'https://unpkg.com/scratch-gui@5.3.0/dist/build/index.html';
  const FALLBACK_CDN = 'https://cdn.jsdelivr.net/gh/LLK/scratch-gui@develop/dist/build/index.html';

  // ===== DOM =====
  const loadingOverlay = document.getElementById('loadingOverlay');
  const loadingText = document.getElementById('loadingText');
  const authScreen = document.getElementById('authScreen');
  const editorContainer = document.getElementById('editorContainer');
  const scratchFrame = document.getElementById('scratchFrame');
  const fileInput = document.getElementById('fileInput');
  const projectDrop = document.getElementById('projectDrop');
  const toastEl = document.getElementById('toast');
  const statusText = document.getElementById('statusText');

  const authPassword = document.getElementById('authPassword');
  const authSubmit = document.getElementById('authSubmit');
  const authError = document.getElementById('authError');

  // ===== Cookie 工具 =====
  function setCookie(name, value, days) {
    const d = new Date();
    d.setTime(d.getTime() + days * 864e5);
    document.cookie = name + '=' + value + ';expires=' + d.toUTCString() + ';path=/;SameSite=Lax';
  }
  function getCookie(name) {
    const m = document.cookie.match(new RegExp('(^|;\\s*)' + name + '=([^;]*)'));
    return m ? m[2] : null;
  }
  function delCookie(name) {
    document.cookie = name + '=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/;SameSite=Lax';
  }

  // ===== Toast =====
  function showToast(msg, duration) {
    duration = duration || 2500;
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastEl._timer);
    toastEl._timer = setTimeout(function() {
      toastEl.classList.remove('show');
    }, duration);
  }

  // ===== 登录检查 =====
  function checkAuth() {
    loadingText.textContent = '验证登录状态中...';
    return fetch(AUTH_CHECK_URL, { credentials: 'include' })
      .then(function(r) { return r.json(); })
      .then(function(data) { return data.authenticated === true; })
      .catch(function() { return false; });
  }

  // ===== 登录 =====
  function doLogin() {
    var pw = authPassword.value.trim();
    if (!pw) {
      authError.textContent = '请输入密码';
      authError.classList.add('show');
      return;
    }
    authSubmit.disabled = true;
    authSubmit.textContent = '登录中...';
    authError.classList.remove('show');
    fetch(LOGIN_URL, {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw })
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.token) {
        setCookie(COOKIE_NAME, data.token, 7);
        authSubmit.disabled = false;
        authSubmit.textContent = '登 录';
        initEditor();
      } else {
        authError.textContent = '密码错误';
        authError.classList.add('show');
        authSubmit.disabled = false;
        authSubmit.textContent = '登 录';
      }
    })
    .catch(function() {
      authError.textContent = '登录失败，请重试';
      authError.classList.add('show');
      authSubmit.disabled = false;
      authSubmit.textContent = '登 录';
    });
  }

  authSubmit.addEventListener('click', doLogin);
  authPassword.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') doLogin();
  });

  // ===== 加载 Scratch 编辑器 =====
  var scratchLoaded = false;
  var currentCdn = SCRATCH_CDN;

  function loadScratchEditor(cdnUrl, isFallback) {
    if (scratchLoaded) return;
    loadingText.textContent = isFallback ? '正在加载编辑器（备用地址）...' : '正在加载 Scratch 编辑器...';
    scratchFrame.src = cdnUrl;
    scratchFrame.onload = function() {
      if (scratchLoaded) return;
      scratchLoaded = true;
      currentCdn = cdnUrl;
      hideLoading();
      statusText.textContent = '编辑器就绪';
      showToast('Scratch 编辑器加载完成');
    };
    scratchFrame.onerror = function() {
      if (scratchLoaded) return;
      if (!isFallback && SCRATCH_CDN !== FALLBACK_CDN) {
        loadScratchEditor(FALLBACK_CDN, true);
      } else {
        statusText.textContent = '加载失败';
        loadingText.textContent = '编辑器加载失败，请检查网络或稍后重试';
      }
    };
  }

  // ===== 隐藏加载遮罩 =====
  function hideLoading() {
    loadingOverlay.classList.add('fade-out');
    setTimeout(function() {
      loadingOverlay.style.display = 'none';
    }, 400);
  }

  // ===== 初始化编辑器 =====
  function initEditor() {
    authScreen.classList.remove('active');
    editorContainer.classList.add('active');
    if (!scratchLoaded) {
      loadScratchEditor(SCRATCH_CDN, false);
    } else {
      hideLoading();
    }
  }

  // ===== 主流程 =====
  checkAuth().then(function(authed) {
    if (authed) {
      initEditor();
    } else {
      loadingOverlay.style.display = 'none';
      authScreen.classList.add('active');
      authPassword.focus();
    }
  });

  // ===== 工具栏操作 =====
  // 返回主页
  document.getElementById('tbBack').addEventListener('click', function() {
    window.location.href = '/';
  });

  // 新建项目
  document.getElementById('tbNew').addEventListener('click', function() {
    try {
      var editor = scratchFrame.contentWindow;
      // 通过 scratch-gui 的 postMessage 发送命令
      editor.postMessage({ command: 'SCRATCH_GUI_NEW' }, '*');
      statusText.textContent = '已创建新项目';
      showToast('已创建新空白项目');
    } catch(e) {
      showToast('编辑器尚未完全加载，请稍后再试');
    }
  });

  // 加载 .sb3
  document.getElementById('tbLoad').addEventListener('click', function() {
    fileInput.click();
  });

  fileInput.addEventListener('change', function(e) {
    var file = e.target.files[0];
    if (!file) return;
    var url = URL.createObjectURL(file);
    try {
      var editor = scratchFrame.contentWindow;
      editor.postMessage({
        command: 'SCRATCH_GUI_LOAD',
        projectUrl: url
      }, '*');
      statusText.textContent = '已加载: ' + file.name;
      showToast('已加载: ' + file.name);
      URL.revokeObjectURL(url);
    } catch(err) {
      showToast('编辑器尚未完全加载，请稍后再试');
    }
    fileInput.value = '';
  });

  // 保存项目
  document.getElementById('tbSave').addEventListener('click', function() {
    try {
      var editor = scratchFrame.contentWindow;
      editor.postMessage({ command: 'SCRATCH_GUI_SAVE' }, '*');
      statusText.textContent = '保存中...';
      showToast('正在保存项目...');
    } catch(e) {
      showToast('编辑器尚未完全加载，请稍后再试');
    }
  });

  // 全屏
  document.getElementById('tbFull').addEventListener('click', function() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(function() {});
      statusText.textContent = '全屏模式';
    } else {
      document.exitFullscreen().catch(function() {});
      statusText.textContent = '编辑器就绪';
    }
  });

  // 退出登录
  document.getElementById('tbLogout').addEventListener('click', function() {
    delCookie(COOKIE_NAME);
    fetch(LOGOUT_URL, { method: 'POST', credentials: 'include' }).catch(function() {});
    showToast('已退出登录');
    window.location.href = '/web-games/';
  });

  // ===== 拖拽加载 .sb3 =====
  var dragCounter = 0;
  document.addEventListener('dragenter', function(e) {
    e.preventDefault();
    dragCounter++;
    projectDrop.classList.add('active');
  });
  document.addEventListener('dragleave', function(e) {
    e.preventDefault();
    dragCounter--;
    if (dragCounter <= 0) {
      dragCounter = 0;
      projectDrop.classList.remove('active');
    }
  });
  document.addEventListener('dragover', function(e) {
    e.preventDefault();
  });
  document.addEventListener('drop', function(e) {
    e.preventDefault();
    dragCounter = 0;
    projectDrop.classList.remove('active');
    var file = e.dataTransfer.files[0];
    if (!file || !file.name.toLowerCase().endsWith('.sb3')) {
      showToast('请拖入 .sb3 文件');
      return;
    }
    var url = URL.createObjectURL(file);
    try {
      var editor = scratchFrame.contentWindow;
      editor.postMessage({
        command: 'SCRATCH_GUI_LOAD',
        projectUrl: url
      }, '*');
      statusText.textContent = '已加载: ' + file.name;
      showToast('已加载: ' + file.name);
      URL.revokeObjectURL(url);
    } catch(err) {
      showToast('编辑器尚未完全加载，请稍后再试');
    }
  });

  // ===== 键盘快捷键 =====
  document.addEventListener('keydown', function(e) {
    if (!editorContainer.classList.contains('active')) return;
    // Ctrl+S / Cmd+S 保存
    if ((e.ctrlKey || e.metaKey) && e.key === 's') {
      e.preventDefault();
      document.getElementById('tbSave').click();
    }
    // F11 全屏
    if (e.key === 'F11') {
      e.preventDefault();
      document.getElementById('tbFull').click();
    }
  });

})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scratch 编辑器 - Code Explorer</title>
<style>
  :root {
    --bg-primary: #0a0e1a;
    --bg-secondary: rgba(22, 27, 34, 0.85);
    --bg-tertiary: rgba(33, 38, 45, 0.9);
    --border-color: rgba(88, 166, 255, 0.2);
    --text-primary: #e6edf3;
    --text-secondary: #8b949e;
    --text-tertiary: #6e7681;
    --accent-blue: #58a6ff;
    --accent-green: #3fb950;
    --accent-red: #f85149;
    --accent-purple: #a371f7;
    --accent-yellow: #d29922;
    --radius-sm: 6px;
    --radius-md: 8px;
    --radius-lg: 12px;
    --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    --font-mono: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    background: var(--bg-primary);
    font-family: var(--font-sans);
    color: var(--text-primary);
    overflow: hidden;
  }

  /* ===== 加载遮罩 ===== */
  #loadingOverlay {
    position: fixed;
    inset: 0;
    background: var(--bg-primary);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    transition: opacity 0.4s ease;
  }
  #loadingOverlay.fade-out {
    opacity: 0;
    pointer-events: none;
  }
  .loader {
    width: 56px;
    height: 56px;
    border: 4px solid var(--border-color);
    border-top-color: var(--accent-blue);
    border-right-color: var(--accent-purple);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 20px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loadingText {
    color: var(--text-secondary);
    font-size: 14px;
    letter-spacing: 1px;
  }

  /* ===== 认证页 ===== */
  #authScreen {
    display: none;
    position: fixed;
    inset: 0;
    background: var(--bg-primary);
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    gap: 24px;
  }
  #authScreen.active { display: flex; }
  .auth-card {
    background: var(--bg-secondary);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    padding: 40px 48px;
    text-align: center;
    width: 380px;
    backdrop-filter: blur(12px);
  }
  .auth-card h2 {
    font-size: 22px;
    color: var(--text-primary);
    margin-bottom: 8px;
    font-weight: 700;
  }
  .auth-card p {
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 24px;
  }
  .auth-input {
    width: 100%;
    padding: 12px 16px;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);
    background: var(--bg-tertiary);
    color: var(--text-primary);
    font-size: 14px;
    font-family: var(--font-mono);
    margin-bottom: 16px;
    outline: none;
    transition: border-color 0.2s;
  }
  .auth-input:focus { border-color: var(--accent-blue); }
  .auth-input::placeholder { color: var(--text-tertiary); }
  .auth-btn {
    width: 100%;
    padding: 12px;
    background: linear-gradient(135deg, var(--accent-blue), #4a90e2);
    border: none;
    border-radius: var(--radius-sm);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .auth-btn:hover { opacity: 0.9; }
  .auth-error {
    font-size: 12px;
    color: var(--accent-red);
    margin-top: 8px;
    display: none;
  }
  .auth-error.show { display: block; }
  .auth-hint {
    font-size: 12px;
    color: var(--text-tertiary);
    margin-top: 16px;
  }

  /* ===== 编辑器容器 ===== */
  #editorContainer {
    display: none;
    width: 100%;
    height: 100%;
    flex-direction: column;
  }
  #editorContainer.active { display: flex; }

  /* ===== 顶部工具栏 ===== */
  #toolbar {
    height: 44px;
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    padding: 0 12px;
    gap: 8px;
    flex-shrink: 0;
    z-index: 100;
    backdrop-filter: blur(8px);
  }
  .tb-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    background: transparent;
    border: 1px solid transparent;
    border-radius: var(--radius-sm);
    color: var(--text-primary);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
    font-family: var(--font-sans);
    white-space: nowrap;
  }
  .tb-btn:hover {
    background: var(--bg-tertiary);
    border-color: var(--border-color);
  }
  .tb-btn svg { width: 16px; height: 16px; flex-shrink: 0; }
  .tb-btn-icon { padding: 7px; }
  .tb-btn-danger { color: var(--accent-red); }
  .tb-btn-danger:hover { background: rgba(248,81,73,0.1); border-color: rgba(248,81,73,0.3); }
  .tb-sep {
    width: 1px;
    height: 24px;
    background: var(--border-color);
    margin: 0 4px;
  }
  .tb-spacer { flex: 1; }
  .tb-status {
    font-size: 12px;
    color: var(--text-secondary);
    font-family: var(--font-mono);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .tb-status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent-green);
    box-shadow: 0 0 8px rgba(63,185,80,0.5);
  }

  /* ===== 启动页 ===== */
  #launcher {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0d1117;
    overflow: auto;
    padding: 24px;
  }
  .launcher-card {
    background: var(--bg-secondary);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    padding: 48px 56px;
    text-align: center;
    max-width: 460px;
    width: 100%;
    backdrop-filter: blur(12px);
  }
  .launcher-icon {
    font-size: 48px;
    margin-bottom: 16px;
  }
  .launcher-card h2 {
    font-size: 20px;
    color: var(--text-primary);
    margin-bottom: 12px;
    font-weight: 700;
  }
  .launcher-card p {
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 28px;
    line-height: 1.7;
  }
  .launcher-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 13px 32px;
    background: linear-gradient(135deg, var(--accent-blue), #4a90e2);
    border-radius: var(--radius-sm);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    transition: all 0.2s;
  }
  .launcher-btn:hover { opacity: 0.9; }
  .launcher-btn svg { width: 18px; height: 18px; }
  .launcher-hint {
    font-size: 12px;
    color: var(--text-tertiary);
    margin-top: 20px;
    line-height: 1.6;
  }

  /* ===== Toast 通知 ===== */
  #toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--bg-tertiary);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);
    padding: 10px 20px;
    font-size: 13px;
    color: var(--text-primary);
    opacity: 0;
    transition: all 0.3s ease;
    z-index: 9999;
    pointer-events: none;
    backdrop-filter: blur(12px);
    font-family: var(--font-mono);
  }
  #toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ===== 键盘快捷键说明（无） ===== */
</style>
<link rel="stylesheet" href="/components/nav.css">
</head>
<body>

      <a class="ce-top-nav-link" href="/resources/" data-nav="/resources">资源下载</a>

        <svg class="ce-moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>

</div>

<!-- 加载遮罩 -->
<div id="loadingOverlay">
  <div class="loader"></div>
  <div id="loadingText">验证登录状态中...</div>
</div>

<!-- 认证页 -->
<div id="authScreen">
  <div class="auth-card">
    <h2>🔐 登录以使用 Scratch</h2>
    <p>请输入用户名和密码</p>
    <input type="text" class="auth-input" id="authUsername" placeholder="用户名" autocomplete="username">
    <input type="password" class="auth-input" id="authPassword" placeholder="密码" autocomplete="current-password">
    <button class="auth-btn" id="authSubmit">登 录</button>
    <div class="auth-error" id="authError"></div>
    <div class="auth-hint">前往 <a href="/" style="color:var(--accent-blue);text-decoration:none">主页</a> 注册或登录</div>
  </div>
</div>

<!-- 编辑器容器 -->
<div id="editorContainer">
  <!-- 顶部工具栏 -->
  <div id="toolbar">
    <button class="tb-btn" id="tbBack" title="返回主页">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      返回
    </button>

    <div class="tb-spacer"></div>

    <span class="tb-status">
      <span class="tb-status-dot"></span>
      <span id="statusText">已登录</span>
    </span>
    <div class="tb-sep"></div>
    <button class="tb-btn tb-btn-danger" id="tbLogout" title="退出登录">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
      退出
    </button>
  </div>

  <!-- 启动页 -->
  <div id="launcher">
    <div class="launcher-card">
      <div class="launcher-icon">🐱</div>
      <h2>TurboWarp 完整编辑器</h2>
      <p>点击下方按钮，在新标签页打开 TurboWarp 编辑器，可新建、加载、保存 .sb3 项目</p>
      <a class="launcher-btn" id="openEditorBtn" href="https://turbowarp.org/editor" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6M15 3h6v6M10 14L21 3"/></svg>
        打开完整编辑器
      </a>
      <div class="launcher-hint">提示：编辑器将在新标签页中打开，不会离开本站。</div>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<script>
(function() {
  'use strict';

  // ===== 常量 =====
  const AUTH_CHECK_URL = '/api/auth-check';
  const LOGIN_URL = '/api/login';
  const LOGOUT_URL = '/api/logout';
  const COOKIE_NAME = 'wg_token';

  // ===== DOM =====
  const loadingOverlay = document.getElementById('loadingOverlay');
  const loadingText = document.getElementById('loadingText');
  const authScreen = document.getElementById('authScreen');
  const editorContainer = document.getElementById('editorContainer');
  const toastEl = document.getElementById('toast');
  const statusText = document.getElementById('statusText');
  const openEditorBtn = document.getElementById('openEditorBtn');

  const authUsername = document.getElementById('authUsername');
  const authPassword = document.getElementById('authPassword');
  const authSubmit = document.getElementById('authSubmit');
  const authError = document.getElementById('authError');

  // ===== Cookie 工具 =====
  function setCookie(name, value, days) {
    const d = new Date();
    d.setTime(d.getTime() + days * 864e5);
    document.cookie = name + '=' + value + ';expires=' + d.toUTCString() + ';path=/;SameSite=Lax';
  }
  function getCookie(name) {
    const m = document.cookie.match(new RegExp('(^|;\\s*)' + name + '=([^;]*)'));
    return m ? m[2] : null;
  }
  function delCookie(name) {
    document.cookie = name + '=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/;SameSite=Lax';
  }

  // ===== Toast =====
  function showToast(msg, duration) {
    duration = duration || 2500;
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastEl._timer);
    toastEl._timer = setTimeout(function() {
      toastEl.classList.remove('show');
    }, duration);
  }

  // ===== 登录检查 =====
  function checkAuth() {
    loadingText.textContent = '验证登录状态中...';
    return fetch(AUTH_CHECK_URL, { credentials: 'include' })
      .then(function(r) { return r.json(); })
      .then(function(data) { return data.authenticated === true; })
      .catch(function() { return false; });
  }

  // ===== 登录 =====
  function doLogin() {
    var username = authUsername.value.trim();
    var pw = authPassword.value.trim();
    if (!username || !pw) {
      authError.textContent = '请输入用户名和密码';
      authError.classList.add('show');
      return;
    }
    authSubmit.disabled = true;
    authSubmit.textContent = '登录中...';
    authError.classList.remove('show');
    fetch(LOGIN_URL, {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: username, password: pw })
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.token) {
        setCookie(COOKIE_NAME, data.token, 7);
        authSubmit.disabled = false;
        authSubmit.textContent = '登 录';
        initEditor();
      } else {
        authError.textContent = data.error || '用户名或密码错误';
        authError.classList.add('show');
        authSubmit.disabled = false;
        authSubmit.textContent = '登 录';
      }
    })
    .catch(function() {
      authError.textContent = '登录失败，请重试';
      authError.classList.add('show');
      authSubmit.disabled = false;
      authSubmit.textContent = '登 录';
    });
  }

  authSubmit.addEventListener('click', doLogin);
  authUsername.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') { authPassword.focus(); }
  });
  authPassword.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') doLogin();
  });

  // ===== 打开编辑器 =====
  openEditorBtn.addEventListener('click', function() {
    showToast('正在新标签页打开 TurboWarp 编辑器...');
  });

  // ===== 隐藏加载遮罩 =====
  function hideLoading() {
    loadingOverlay.classList.add('fade-out');
    setTimeout(function() {
      loadingOverlay.style.display = 'none';
    }, 400);
  }

  // ===== 初始化页面 =====
  function initEditor() {
    authScreen.classList.remove('active');
    editorContainer.classList.add('active');
    hideLoading();
    statusText.textContent = '已登录';
  }

  // ===== 主流程 =====
  checkAuth().then(function(authed) {
    if (authed) {
      initEditor();
    } else {
      loadingOverlay.style.display = 'none';
      authScreen.classList.add('active');
      authUsername.focus();
    }
  });

  // ===== 工具栏操作 =====
  // 返回主页
  document.getElementById('tbBack').addEventListener('click', function() {
    window.location.href = '/';
  });

  // 退出登录
  document.getElementById('tbLogout').addEventListener('click', function() {
    delCookie(COOKIE_NAME);
    fetch(LOGOUT_URL, { method: 'POST', credentials: 'include' }).catch(function() {});
    showToast('已退出登录');
    window.location.href = '/web-games/';
  });

})();
</script>
<script src="/components/nav.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scratch 编辑器 - Code Explorer</title>
<style>
  :root {
    --bg-primary: #0a0e1a;
    --bg-secondary: rgba(22, 27, 34, 0.85);
    --bg-tertiary: rgba(33, 38, 45, 0.9);
    --border-color: rgba(88, 166, 255, 0.2);
    --text-primary: #e6edf3;
    --text-secondary: #8b949e;
    --text-tertiary: #6e7681;
    --accent-blue: #58a6ff;
    --accent-green: #3fb950;
    --accent-red: #f85149;
    --accent-purple: #a371f7;
    --accent-yellow: #d29922;
    --radius-sm: 6px;
    --radius-md: 8px;
    --radius-lg: 12px;
    --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    --font-mono: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    background: var(--bg-primary);
    font-family: var(--font-sans);
    color: var(--text-primary);
    overflow: hidden;
  }

  /* ===== 加载遮罩 ===== */
  #loadingOverlay {
    position: fixed;
    inset: 0;
    background: var(--bg-primary);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    transition: opacity 0.4s ease;
  }
  #loadingOverlay.fade-out {
    opacity: 0;
    pointer-events: none;
  }
  .loader {
    width: 56px;
    height: 56px;
    border: 4px solid var(--border-color);
    border-top-color: var(--accent-blue);
    border-right-color: var(--accent-purple);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 20px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loadingText {
    color: var(--text-secondary);
    font-size: 14px;
    letter-spacing: 1px;
  }

  /* ===== 认证页 ===== */
  #authScreen {
    display: none;
    position: fixed;
    inset: 0;
    background: var(--bg-primary);
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    gap: 24px;
  }
  #authScreen.active { display: flex; }
  .auth-card {
    background: var(--bg-secondary);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    padding: 40px 48px;
    text-align: center;
    width: 380px;
    backdrop-filter: blur(12px);
  }
  .auth-card h2 {
    font-size: 22px;
    color: var(--text-primary);
    margin-bottom: 8px;
    font-weight: 700;
  }
  .auth-card p {
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 24px;
  }
  .auth-input {
    width: 100%;
    padding: 12px 16px;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);
    background: var(--bg-tertiary);
    color: var(--text-primary);
    font-size: 14px;
    font-family: var(--font-mono);
    margin-bottom: 16px;
    outline: none;
    transition: border-color 0.2s;
  }
  .auth-input:focus { border-color: var(--accent-blue); }
  .auth-input::placeholder { color: var(--text-tertiary); }
  .auth-btn {
    width: 100%;
    padding: 12px;
    background: linear-gradient(135deg, var(--accent-blue), #4a90e2);
    border: none;
    border-radius: var(--radius-sm);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .auth-btn:hover { opacity: 0.9; }
  .auth-error {
    font-size: 12px;
    color: var(--accent-red);
    margin-top: 8px;
    display: none;
  }
  .auth-error.show { display: block; }
  .auth-hint {
    font-size: 12px;
    color: var(--text-tertiary);
    margin-top: 16px;
  }

  /* ===== 编辑器容器 ===== */
  #editorContainer {
    display: none;
    width: 100%;
    height: 100%;
    flex-direction: column;
  }
  #editorContainer.active { display: flex; }

  /* ===== 顶部工具栏 ===== */
  #toolbar {
    height: 44px;
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    padding: 0 12px;
    gap: 8px;
    flex-shrink: 0;
    z-index: 100;
    backdrop-filter: blur(8px);
  }
  .tb-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    background: transparent;
    border: 1px solid transparent;
    border-radius: var(--radius-sm);
    color: var(--text-primary);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
    font-family: var(--font-sans);
    white-space: nowrap;
  }
  .tb-btn:hover {
    background: var(--bg-tertiary);
    border-color: var(--border-color);
  }
  .tb-btn svg { width: 16px; height: 16px; flex-shrink: 0; }
  .tb-btn-icon { padding: 7px; }
  .tb-btn-danger { color: var(--accent-red); }
  .tb-btn-danger:hover { background: rgba(248,81,73,0.1); border-color: rgba(248,81,73,0.3); }
  .tb-sep {
    width: 1px;
    height: 24px;
    background: var(--border-color);
    margin: 0 4px;
  }
  .tb-spacer { flex: 1; }
  .tb-status {
    font-size: 12px;
    color: var(--text-secondary);
    font-family: var(--font-mono);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .tb-status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent-green);
    box-shadow: 0 0 8px rgba(63,185,80,0.5);
  }

  /* ===== 项目卡片 ===== */
  #projectArea {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: #0d1117;
    overflow: hidden;
  }
  #projectActions {
    display: flex;
    gap: 10px;
    padding: 16px 24px;
    border-bottom: 1px solid var(--border-color);
    flex-shrink: 0;
    align-items: center;
  }
  #projectActions .action-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 9px 18px;
    background: var(--bg-secondary);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);
    color: var(--text-primary);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
    font-family: var(--font-sans);
  }
  #projectActions .action-btn:hover {
    background: var(--bg-tertiary);
    border-color: var(--accent-blue);
  }
  #projectActions .action-btn svg { width: 16px; height: 16px; }
  #projectActions .action-btn-primary {
    background: linear-gradient(135deg, var(--accent-blue), #4a90e2);
    border-color: transparent;
    color: #fff;
  }
  #projectActions .action-btn-primary:hover {
    opacity: 0.9;
    border-color: transparent;
  }
  #projectActions .action-spacer { flex: 1; }
  #projectActions .action-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-primary);
  }
  #projectGrid {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
    align-content: start;
  }
  #projectGrid:empty::after {
    content: '暂无项目，点击「上传项目」开始';
    grid-column: 1 / -1;
    text-align: center;
    color: var(--text-tertiary);
    font-size: 14px;
    padding: 60px 20px;
  }
  .project-card {
    background: var(--bg-secondary);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    padding: 20px;
    display: flex;
    flex-direction: column;
    transition: border-color 0.2s;
  }
  .project-card:hover {
    border-color: var(--accent-blue);
  }
  .project-card-icon {
    font-size: 32px;
    margin-bottom: 12px;
  }
  .project-card-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 8px;
    word-break: break-all;
  }
  .project-card-meta {
    font-size: 11px;
    color: var(--text-tertiary);
    margin-bottom: 14px;
    line-height: 1.6;
  }
  .project-card-actions {
    display: flex;
    gap: 8px;
    margin-top: auto;
  }
  .project-card-actions .card-btn {
    flex: 1;
    padding: 7px 0;
    font-size: 12px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-color);
    background: transparent;
    color: var(--text-primary);
    cursor: pointer;
    text-align: center;
    text-decoration: none;
    transition: all 0.15s;
    font-family: var(--font-sans);
  }
  .project-card-actions .card-btn:hover {
    background: var(--bg-tertiary);
    border-color: var(--accent-blue);
  }
  .project-card-actions .card-btn-danger {
    color: var(--accent-red);
  }
  .project-card-actions .card-btn-danger:hover {
    background: rgba(248,81,73,0.1);
    border-color: rgba(248,81,73,0.3);
  }

  /* ===== 上传弹窗 ===== */
  #uploadModal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    align-items: center;
    justify-content: center;
    z-index: 2000;
  }
  #uploadModal.active { display: flex; }
  .modal-card {
    background: var(--bg-secondary);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    padding: 32px 40px;
    width: 400px;
    text-align: center;
  }
  .modal-card h3 {
    font-size: 18px;
    color: var(--text-primary);
    margin-bottom: 20px;
    font-weight: 700;
  }
  #fileInput { display: none; }
  .file-select-btn {
    display: inline-block;
    padding: 10px 24px;
    background: var(--bg-tertiary);
    border: 1px dashed var(--border-color);
    border-radius: var(--radius-sm);
    color: var(--text-secondary);
    font-size: 13px;
    cursor: pointer;
    margin-bottom: 16px;
    transition: border-color 0.2s;
    width: 100%;
  }
  .file-select-btn:hover { border-color: var(--accent-blue); }
  #uploadFileName {
    font-size: 12px;
    color: var(--text-tertiary);
    margin-bottom: 16px;
    word-break: break-all;
  }
  #uploadNameInput {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);
    background: var(--bg-tertiary);
    color: var(--text-primary);
    font-size: 13px;
    margin-bottom: 16px;
    outline: none;
    font-family: var(--font-sans);
  }
  #uploadNameInput:focus { border-color: var(--accent-blue); }
  .modal-actions {
    display: flex;
    gap: 10px;
  }
  .modal-actions .modal-btn {
    flex: 1;
    padding: 10px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid var(--border-color);
    background: transparent;
    color: var(--text-primary);
    transition: all 0.15s;
    font-family: var(--font-sans);
  }
  .modal-actions .modal-btn-primary {
    background: linear-gradient(135deg, var(--accent-blue), #4a90e2);
    border-color: transparent;
    color: #fff;
  }
  .modal-actions .modal-btn-primary:hover { opacity: 0.9; }
  .modal-actions .modal-btn:hover { background: var(--bg-tertiary); }
  .modal-actions .modal-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ===== Toast 通知 ===== */
  #toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--bg-tertiary);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);
    padding: 10px 20px;
    font-size: 13px;
    color: var(--text-primary);
    opacity: 0;
    transition: all 0.3s ease;
    z-index: 9999;
    pointer-events: none;
    backdrop-filter: blur(12px);
    font-family: var(--font-mono);
  }
  #toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ===== 键盘快捷键说明（无） ===== */
</style>

<script>
(function() {
  'use strict';

  // ===== 常量 =====
  const AUTH_CHECK_URL = '/api/auth-check';
  const LOGIN_URL = '/api/login';
  const LOGOUT_URL = '/api/logout';
  const COOKIE_NAME = 'wg_token';
  const SCRATCH_API = '/api/scratch';

  // ===== DOM =====
  const loadingOverlay = document.getElementById('loadingOverlay');
  const loadingText = document.getElementById('loadingText');
  const authScreen = document.getElementById('authScreen');
  const editorContainer = document.getElementById('editorContainer');
  const projectArea = document.getElementById('projectArea');
  const projectGrid = document.getElementById('projectGrid');
  const toastEl = document.getElementById('toast');
  const statusText = document.getElementById('statusText');

  const authUsername = document.getElementById('authUsername');
  const authPassword = document.getElementById('authPassword');
  const authSubmit = document.getElementById('authSubmit');
  const authError = document.getElementById('authError');

  const uploadBtn = document.getElementById('uploadBtn');
  const uploadModal = document.getElementById('uploadModal');
  const fileInput = document.getElementById('fileInput');
  const fileSelectBtn = document.getElementById('fileSelectBtn');
  const uploadFileName = document.getElementById('uploadFileName');
  const uploadNameInput = document.getElementById('uploadNameInput');
  const uploadConfirmBtn = document.getElementById('uploadConfirmBtn');
  const uploadCancelBtn = document.getElementById('uploadCancelBtn');
  const uploadError = document.getElementById('uploadError');

  // ===== Cookie 工具 =====
  function setCookie(name, value, days) {
    var d = new Date();
    d.setTime(d.getTime() + days * 864e5);
    document.cookie = name + '=' + value + ';expires=' + d.toUTCString() + ';path=/;SameSite=Lax';
  }
  function delCookie(name) {
    document.cookie = name + '=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/;SameSite=Lax';
  }

  // ===== Toast =====
  function showToast(msg, duration) {
    duration = duration || 2500;
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastEl._timer);
    toastEl._timer = setTimeout(function() {
      toastEl.classList.remove('show');
    }, duration);
  }

  // ===== 工具函数 =====
  function formatFileSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / 1048576).toFixed(1) + ' MB';
  }
  function formatDate(ts) {
    var d = new Date(ts * 1000);
    return d.getFullYear() + '-' + (d.getMonth()+1).toString().padStart(2,'0') + '-' + d.getDate().toString().padStart(2,'0') + ' ' + d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
  }

  // ===== 登录检查 =====
  function checkAuth() {
    loadingText.textContent = '验证登录状态中...';
    return fetch(AUTH_CHECK_URL, { credentials: 'include' })
      .then(function(r) { return r.json(); })
      .then(function(data) { return data.authenticated === true; })
      .catch(function() { return false; });
  }

  // ===== 登录 =====
  function doLogin() {
    var username = authUsername.value.trim();
    var pw = authPassword.value.trim();
    if (!username || !pw) {
      authError.textContent = '请输入用户名和密码';
      authError.classList.add('show');
      return;
    }
    authSubmit.disabled = true;
    authSubmit.textContent = '登录中...';
    authError.classList.remove('show');
    fetch(LOGIN_URL, {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: username, password: pw })
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.token) {
        setCookie(COOKIE_NAME, data.token, 7);
        authSubmit.disabled = false;
        authSubmit.textContent = '登 录';
        initEditor();
      } else {
        authError.textContent = data.error || '用户名或密码错误';
        authError.classList.add('show');
        authSubmit.disabled = false;
        authSubmit.textContent = '登 录';
      }
    })
    .catch(function() {
      authError.textContent = '登录失败，请重试';
      authError.classList.add('show');
      authSubmit.disabled = false;
      authSubmit.textContent = '登 录';
    });
  }

  authSubmit.addEventListener('click', doLogin);
  authUsername.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') { authPassword.focus(); }
  });
  authPassword.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') doLogin();
  });

  // ===== 加载项目列表 =====
  function fetchProjects() {
    statusText.textContent = '加载中...';
    return fetch(SCRATCH_API + '/projects', { credentials: 'include' })
      .then(function(r) { return r.json(); })
      .then(function(projects) {
        renderProjects(projects);
        statusText.textContent = projects.length + ' 个项目';
        return projects;
      })
      .catch(function() {
        statusText.textContent = '加载失败';
        showToast('加载项目列表失败');
      });
  }

  // ===== 渲染项目卡片 =====
  function renderProjects(projects) {
    projectGrid.innerHTML = '';
    projects.forEach(function(p) {
      var card = document.createElement('div');
      card.className = 'project-card';
      card.innerHTML =
        '<div class="project-card-icon">🐱</div>' +
        '<div class="project-card-name">' + escapeHtml(p.name) + '</div>' +
        '<div class="project-card-meta">' + formatFileSize(p.file_size) + ' · ' + formatDate(p.updated_at) + '</div>' +
        '<div class="project-card-actions">' +
          '<a class="card-btn" href="' + SCRATCH_API + '/projects/' + p.id + '/download" target="_blank">下载</a>' +
          '<button class="card-btn card-btn-danger" data-id="' + p.id + '" data-name="' + escapeAttr(p.name) + '">删除</button>' +
        '</div>';
      card.querySelector('.card-btn-danger').addEventListener('click', function() {
        deleteProject(p.id, p.name);
      });
      projectGrid.appendChild(card);
    });
  }

  function escapeHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function escapeAttr(s) {
    return String(s).replace(/"/g,'&quot;').replace(/&/g,'&amp;');
  }

  // ===== 上传项目 =====
  var selectedFile = null;

  fileSelectBtn.addEventListener('click', function() { fileInput.click(); });

  fileInput.addEventListener('change', function() {
    selectedFile = fileInput.files[0];
    if (selectedFile) {
      uploadFileName.textContent = selectedFile.name;
      uploadNameInput.value = selectedFile.name.replace(/\.sb3$/i, '');
      uploadConfirmBtn.disabled = false;
      uploadError.classList.remove('show');
    }
  });

  uploadBtn.addEventListener('click', function() {
    selectedFile = null;
    fileInput.value = '';
    uploadFileName.textContent = '';
    uploadNameInput.value = '';
    uploadConfirmBtn.disabled = true;
    uploadError.classList.remove('show');
    uploadModal.classList.add('active');
  });

  uploadCancelBtn.addEventListener('click', function() {
    uploadModal.classList.remove('active');
  });

  uploadModal.addEventListener('click', function(e) {
    if (e.target === uploadModal) uploadModal.classList.remove('active');
  });

  uploadConfirmBtn.addEventListener('click', function() {
    if (!selectedFile) return;
    var name = uploadNameInput.value.trim() || selectedFile.name.replace(/\.sb3$/i, '');
    uploadConfirmBtn.disabled = true;
    uploadConfirmBtn.textContent = '上传中...';
    uploadError.classList.remove('show');

    var reader = new FileReader();
    reader.onload = function(e) {
      var base64 = e.target.result.split(',')[1];
      fetch(SCRATCH_API + '/upload', {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: name, data: base64 })
      })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (data.id) {
          showToast('项目上传成功');
          uploadModal.classList.remove('active');
          fetchProjects();
        } else {
          uploadError.textContent = data.error || '上传失败';
          uploadError.classList.add('show');
          uploadConfirmBtn.disabled = false;
          uploadConfirmBtn.textContent = '上传';
        }
      })
      .catch(function() {
        uploadError.textContent = '上传失败，请重试';
        uploadError.classList.add('show');
        uploadConfirmBtn.disabled = false;
        uploadConfirmBtn.textContent = '上传';
      });
    };
    reader.readAsDataURL(selectedFile);
  });

  // ===== 删除项目 =====
  function deleteProject(id, name) {
    if (!confirm('确定要删除项目「' + name + '」吗？')) return;
    fetch(SCRATCH_API + '/projects/' + id + '/delete', {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' }
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.success) {
        showToast('已删除「' + name + '」');
        fetchProjects();
      } else {
        showToast(data.error || '删除失败');
      }
    })
    .catch(function() {
      showToast('删除失败，请重试');
    });
  }

  // ===== 隐藏加载遮罩 =====
  function hideLoading() {
    loadingOverlay.classList.add('fade-out');
    setTimeout(function() {
      loadingOverlay.style.display = 'none';
    }, 400);
  }

  // ===== 初始化页面 =====
  function initEditor() {
    authScreen.classList.remove('active');
    editorContainer.classList.add('active');
    hideLoading();
    fetchProjects();
  }

  // ===== 主流程 =====
  checkAuth().then(function(authed) {
    if (authed) {
      initEditor();
    } else {
      loadingOverlay.style.display = 'none';
      authScreen.classList.add('active');
      authUsername.focus();
    }
  });

  // ===== 工具栏操作 =====
  document.getElementById('tbBack').addEventListener('click', function() {
    window.location.href = '/';
  });
  document.getElementById('tbLogout').addEventListener('click', function() {
    delCookie(COOKIE_NAME);
    fetch(LOGOUT_URL, { method: 'POST', credentials: 'include' }).catch(function() {});
    showToast('已退出登录');
    window.location.href = '/web-games/';
  });

})();
</script>
<script src="/components/nav.js"></script>
</body>
</html>

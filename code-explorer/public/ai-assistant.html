<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 助手 - Code Explorer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --primary: #7b61ff;
      --primary-light: #f0f4ff;
      --primary-hover: #6a4fff;
      --border: #e8e8e8;
      --card-border: #e4e4e4;
      --text-primary: #222222;
      --text-secondary: #999999;
      --bg-white: #ffffff;
      --bg-gray: #f8f9fa;
      --bg-hover: #f5f5f5;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--bg-white);
      color: var(--text-primary);
      height: 100vh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Grid background */
    .ai-page {
      height: 100vh;
      display: flex;
      flex-direction: column;
      background-image:
        linear-gradient(rgba(0,0,0,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,0,0,0.025) 1px, transparent 1px);
      background-size: 32px 32px;
    }

    /* ===== Header (56px) ===== */
    .ai-header {
      height: 56px;
      background: var(--bg-white);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      flex-shrink: 0;
      z-index: 10;
    }
    .ai-header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .ai-header-title {
      font-size: 17px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-primary);
    }
    .ai-header-sparkle {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ai-header-quota {
      font-size: 13px;
      color: var(--text-secondary);
      padding: 4px 10px;
      background: var(--bg-gray);
      border-radius: 12px;
    }
    .ai-header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .ai-header-btn {
      padding: 7px 14px;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      background: var(--bg-white);
      color: var(--text-secondary);
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .ai-header-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--primary-light);
    }
    .ai-header-btn svg {
      width: 14px;
      height: 14px;
    }

    /* ===== Main content area ===== */
    .ai-main {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* ===== Left navigation (180px) ===== */
    .ai-nav {
      width: 180px;
      border-right: 1px solid var(--border);
      background: var(--bg-white);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      padding: 8px 0;
    }
    .ai-nav-item {
      padding: 11px 20px;
      font-size: 14px;
      color: var(--text-primary);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      border-left: 3px solid transparent;
      transition: all 0.15s;
      user-select: none;
    }
    .ai-nav-item:hover {
      background: var(--bg-hover);
    }
    .ai-nav-item.active {
      background: var(--primary-light);
      border-left-color: var(--primary);
      color: var(--primary);
      font-weight: 500;
    }
    .ai-nav-icon {
      font-size: 16px;
      width: 20px;
      text-align: center;
      line-height: 1;
    }
    .ai-nav-divider {
      height: 1px;
      background: var(--border);
      margin: 8px 16px;
    }

    /* ===== Middle panel - conversations (340px) ===== */
    .ai-conversations {
      width: 340px;
      border-right: 1px solid var(--border);
      background: var(--bg-white);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .ai-conversations-header {
      padding: 16px 20px;
      font-size: 15px;
      font-weight: 600;
      border-bottom: 1px solid var(--border);
      color: var(--text-primary);
      flex-shrink: 0;
    }
    .ai-conversations-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 0;
    }
    .ai-conversation-item {
      padding: 12px 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: background 0.15s;
      border-left: 3px solid transparent;
    }
    .ai-conversation-item:hover {
      background: var(--bg-hover);
    }
    .ai-conversation-item.active {
      background: var(--primary-light);
      border-left-color: var(--primary);
    }
    .ai-conversation-title {
      font-size: 14px;
      color: var(--text-primary);
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .ai-conversation-time {
      font-size: 12px;
      color: var(--text-secondary);
      margin-left: 8px;
      flex-shrink: 0;
    }
    .ai-conversations-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    .ai-new-chat-btn {
      width: 100%;
      padding: 11px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s;
    }
    .ai-new-chat-btn:hover {
      background: var(--primary-hover);
    }

    /* ===== Right panel - chat ===== */
    .ai-chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg-white);
      min-width: 0;
    }
    .ai-chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 32px;
    }

    /* Welcome screen */
    .ai-welcome {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
      padding: 40px;
    }
    .ai-welcome-robot {
      width: 100px;
      height: 100px;
      margin-bottom: 28px;
      position: relative;
    }
    .ai-welcome h2 {
      font-size: 26px;
      font-weight: 600;
      margin-bottom: 10px;
      color: var(--text-primary);
    }
    .ai-welcome p {
      font-size: 15px;
      color: var(--text-secondary);
      margin-bottom: 36px;
      max-width: 480px;
      line-height: 1.6;
    }

    /* Feature cards */
    .ai-feature-cards {
      display: flex;
      gap: 16px;
      margin-bottom: 36px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .ai-feature-card {
      width: 160px;
      padding: 20px 16px;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      background: var(--bg-white);
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .ai-feature-card:hover {
      border-color: var(--primary);
      box-shadow: 0 4px 12px rgba(123, 97, 255, 0.1);
      transform: translateY(-2px);
    }
    .ai-feature-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }
    .ai-feature-icon.purple {
      background: linear-gradient(135deg, #ede9fe, #ddd6fe);
    }
    .ai-feature-icon.blue {
      background: linear-gradient(135deg, #dbeafe, #bfdbfe);
    }
    .ai-feature-name {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-primary);
    }
    .ai-feature-desc {
      font-size: 12px;
      color: var(--text-secondary);
      text-align: center;
    }

    /* Suggestion chips */
    .ai-suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      max-width: 600px;
    }
    .ai-suggestion-chip {
      padding: 10px 18px;
      border: 1px solid var(--card-border);
      border-radius: 20px;
      font-size: 14px;
      color: var(--text-primary);
      cursor: pointer;
      background: var(--bg-white);
      transition: all 0.2s;
    }
    .ai-suggestion-chip:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--primary-light);
    }

    /* Message bubbles */
    .ai-msg {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      max-width: 80%;
      animation: fadeInUp 0.25s ease;
    }
    .ai-msg.user {
      flex-direction: row-reverse;
      margin-left: auto;
    }
    .ai-msg-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }
    .ai-msg.user .ai-msg-avatar {
      background: linear-gradient(135deg, #7b61ff, #a78bfa);
      color: white;
      font-size: 13px;
      font-weight: 600;
    }
    .ai-msg.assistant .ai-msg-avatar {
      background: var(--bg-gray);
      border: 1px solid var(--card-border);
    }
    .ai-msg-bubble {
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.6;
      word-break: break-word;
    }
    .ai-msg.user .ai-msg-bubble {
      background: var(--primary);
      color: white;
      border-bottom-right-radius: 4px;
    }
    .ai-msg.assistant .ai-msg-bubble {
      background: var(--bg-gray);
      color: var(--text-primary);
      border: 1px solid var(--card-border);
      border-bottom-left-radius: 4px;
    }
    .ai-msg-bubble p { margin: 0 0 8px 0; }
    .ai-msg-bubble p:last-child { margin-bottom: 0; }
    .ai-msg-bubble pre {
      background: #1e1e1e;
      color: #d4d4d4;
      padding: 12px;
      border-radius: 8px;
      overflow-x: auto;
      margin: 8px 0;
      font-size: 13px;
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
    }
    .ai-msg-bubble code {
      background: rgba(0,0,0,0.06);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 13px;
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
    }
    .ai-msg.user .ai-msg-bubble code {
      background: rgba(255,255,255,0.2);
    }

    /* Recommendation cards */
    .ai-msg-cards {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 12px;
    }
    .ai-msg-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      background: var(--bg-white);
      cursor: pointer;
      transition: all 0.2s;
    }
    .ai-msg-card:hover {
      border-color: var(--primary);
      background: var(--primary-light);
    }
    .ai-msg-card-icon {
      font-size: 20px;
      flex-shrink: 0;
    }
    .ai-msg-card-info { flex: 1; min-width: 0; }
    .ai-msg-card-name {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-primary);
    }
    .ai-msg-card-reason {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .ai-msg-card-type {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      background: var(--bg-gray);
      color: var(--text-secondary);
      flex-shrink: 0;
    }

    /* Image in messages */
    .ai-msg-image {
      max-width: 400px;
      border-radius: 8px;
      margin-top: 8px;
      cursor: pointer;
      display: block;
    }

    /* Typing indicator */
    .ai-typing {
      display: flex;
      gap: 4px;
      padding: 4px 0;
    }
    .ai-typing span {
      width: 8px;
      height: 8px;
      background: var(--text-secondary);
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out;
    }
    .ai-typing span:nth-child(1) { animation-delay: -0.32s; }
    .ai-typing span:nth-child(2) { animation-delay: -0.16s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Image generation form */
    .ai-image-gen {
      display: none;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-gray);
    }
    .ai-image-gen.active { display: block; }
    .ai-image-gen-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .ai-image-gen-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }
    .ai-image-gen-input { flex: 1; }
    .ai-image-gen-input label {
      display: block;
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }
    .ai-image-gen-input input,
    .ai-image-gen-input select {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      font-size: 13px;
      background: var(--bg-white);
    }
    .ai-image-gen-input input:focus,
    .ai-image-gen-input select:focus {
      outline: none;
      border-color: var(--primary);
    }
    .ai-image-gen-btn {
      padding: 9px 18px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
    }
    .ai-image-gen-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* ===== Input area (64px) ===== */
    .ai-input-area {
      height: 64px;
      padding: 0 24px;
      border-top: 1px solid var(--border);
      background: var(--bg-white);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .ai-model-select {
      padding: 9px 12px;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      font-size: 13px;
      color: var(--text-primary);
      background: var(--bg-white);
      cursor: pointer;
      min-width: 155px;
      flex-shrink: 0;
    }
    .ai-model-select:focus {
      outline: none;
      border-color: var(--primary);
    }
    .ai-input-wrapper {
      flex: 1;
      position: relative;
    }
    .ai-input {
      width: 100%;
      padding: 10px 16px;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      font-size: 14px;
      color: var(--text-primary);
      background: var(--bg-white);
    }
    .ai-input:focus {
      outline: none;
      border-color: var(--primary);
    }
    .ai-input::placeholder { color: var(--text-secondary); }
    .ai-input-actions {
      display: flex;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
    }
    .ai-input-icon-btn {
      width: 36px;
      height: 36px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .ai-input-icon-btn:hover {
      background: var(--bg-gray);
      color: var(--text-primary);
    }
    .ai-input-icon-btn svg {
      width: 18px;
      height: 18px;
    }
    .ai-send-btn {
      padding: 10px 20px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
      flex-shrink: 0;
    }
    .ai-send-btn:hover {
      background: var(--primary-hover);
    }
    .ai-send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .ai-send-btn svg {
      width: 16px;
      height: 16px;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #9ca3af; }

    /* Responsive */
    @media (max-width: 1024px) {
      .ai-conversations { width: 280px; }
      .ai-nav { width: 150px; }
    }
    @media (max-width: 768px) {
      .ai-nav { display: none; }
      .ai-conversations { display: none; }
      .ai-feature-cards { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="ai-page">
    <!-- Header -->
    <div class="ai-header">
      <div class="ai-header-left">
        <div class="ai-header-title">
          <span class="ai-header-sparkle">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
              <path d="M12 2L13.5 8.5L20 10L13.5 11.5L12 18L10.5 11.5L4 10L10.5 8.5L12 2Z" fill="#7b61ff"/>
              <path d="M19 14L19.7 16.3L22 17L19.7 17.7L19 20L18.3 17.7L16 17L18.3 16.3L19 14Z" fill="#a78bfa"/>
            </svg>
          </span>
          <span>AI 助手</span>
        </div>
        <span class="ai-header-quota" id="aiQuota">今日剩余 100 次</span>
      </div>
      <div class="ai-header-right">
        <button class="ai-header-btn" onclick="toggleImageGen()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
          生成图片
        </button>
        <button class="ai-header-btn" onclick="clearChat()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          清除
        </button>
        <button class="ai-header-btn" onclick="window.location.href='/'">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          返回首页
        </button>
      </div>
    </div>

    <!-- Main content -->
    <div class="ai-main">
      <!-- Left navigation -->
      <div class="ai-nav" id="aiNav">
        <div class="ai-nav-item" data-filter="all" onclick="navTo('all')">
          <span class="ai-nav-icon">📁</span><span>全部</span>
        </div>
        <div class="ai-nav-item" data-filter="web-game" onclick="navTo('web-game')">
          <span class="ai-nav-icon">🌐</span><span>网页游戏</span>
        </div>
        <div class="ai-nav-item" data-filter="game" onclick="navTo('game')">
          <span class="ai-nav-icon">🎮</span><span>游戏</span>
        </div>
        <div class="ai-nav-item" data-filter="ai" onclick="navTo('ai')">
          <span class="ai-nav-icon">🤖</span><span>AI</span>
        </div>
        <div class="ai-nav-item" data-filter="tool" onclick="navTo('tool')">
          <span class="ai-nav-icon">🔧</span><span>工具</span>
        </div>
        <div class="ai-nav-item" data-filter="other" onclick="navTo('other')">
          <span class="ai-nav-icon">📁</span><span>其他</span>
        </div>
        <div class="ai-nav-item" data-filter="system-file" onclick="navTo('system-file')">
          <span class="ai-nav-icon">📋</span><span>系统文件</span>
        </div>
        <div class="ai-nav-divider"></div>
        <div class="ai-nav-item" data-filter="about" onclick="navTo('about')">
          <span class="ai-nav-icon">ℹ️</span><span>关于</span>
        </div>
        <div class="ai-nav-item" data-filter="mindmap" onclick="navTo('mindmap')">
          <span class="ai-nav-icon">🧠</span><span>思维导图</span>
        </div>
        <div class="ai-nav-item active" data-filter="ai-assistant">
          <span class="ai-nav-icon">✨</span><span>AI 助手</span>
        </div>
      </div>

      <!-- Middle panel - conversations -->
      <div class="ai-conversations">
        <div class="ai-conversations-header">最近对话</div>
        <div class="ai-conversations-list" id="conversationList">
          <!-- Dynamic conversation items -->
        </div>
        <div class="ai-conversations-footer">
          <button class="ai-new-chat-btn" onclick="newConversation()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            新建对话
          </button>
        </div>
      </div>

      <!-- Right panel - chat -->
      <div class="ai-chat">
        <!-- Image generation form (toggleable) -->
        <div class="ai-image-gen" id="imageGenPanel">
          <div class="ai-image-gen-title">
            <span>🎨</span><span>图片生成</span>
          </div>
          <div class="ai-image-gen-row">
            <div class="ai-image-gen-input" style="flex:2">
              <label>图片描述</label>
              <input type="text" id="imagePrompt" placeholder="描述你想生成的图片内容..." />
            </div>
            <div class="ai-image-gen-input" style="flex:0 0 130px">
              <label>尺寸</label>
              <select id="imageSize">
                <option value="1024x1024">1024×1024</option>
                <option value="1024x768" selected>1024×768</option>
                <option value="768x1024">768×1024</option>
              </select>
            </div>
            <button class="ai-image-gen-btn" id="imageGenBtn" onclick="generateImage()">生成图片</button>
          </div>
        </div>

        <!-- Messages -->
        <div class="ai-chat-messages" id="chatMessages">
          <div class="ai-welcome" id="chatWelcome">
            <!-- Robot illustration -->
            <div class="ai-welcome-robot">
              <svg width="100" height="100" viewBox="0 0 100 100" fill="none">
                <!-- Antenna -->
                <line x1="50" y1="8" x2="50" y2="20" stroke="#7b61ff" stroke-width="2" stroke-linecap="round"/>
                <circle cx="50" cy="6" r="4" fill="#7b61ff"/>
                <!-- Head -->
                <rect x="28" y="20" width="44" height="36" rx="12" fill="#f0f4ff" stroke="#7b61ff" stroke-width="2"/>
                <!-- Eyes -->
                <circle cx="42" cy="36" r="5" fill="#7b61ff"/>
                <circle cx="58" cy="36" r="5" fill="#7b61ff"/>
                <circle cx="43" cy="35" r="2" fill="#fff"/>
                <circle cx="59" cy="35" r="2" fill="#fff"/>
                <!-- Smile -->
                <path d="M42 46 Q50 52 58 46" stroke="#7b61ff" stroke-width="2" stroke-linecap="round" fill="none"/>
                <!-- Body -->
                <rect x="32" y="58" width="36" height="28" rx="8" fill="#ede9fe" stroke="#7b61ff" stroke-width="2"/>
                <!-- Body button -->
                <circle cx="50" cy="72" r="3" fill="#7b61ff"/>
                <!-- Arms -->
                <line x1="32" y1="66" x2="22" y2="72" stroke="#7b61ff" stroke-width="2" stroke-linecap="round"/>
                <line x1="68" y1="66" x2="78" y2="72" stroke="#7b61ff" stroke-width="2" stroke-linecap="round"/>
                <circle cx="20" cy="73" r="3" fill="#7b61ff"/>
                <circle cx="80" cy="73" r="3" fill="#7b61ff"/>
              </svg>
            </div>
            <h2>今天想让 AI 帮你做什么？</h2>
            <p>我可以帮你推荐项目、回答代码问题、生成图片，或者和你聊天。</p>

            <!-- Feature cards -->
            <div class="ai-feature-cards">
              <div class="ai-feature-card" onclick="sendChat('推荐几个游戏项目')">
                <div class="ai-feature-icon purple">🤖</div>
                <div class="ai-feature-name">智能问答</div>
                <div class="ai-feature-desc">推荐项目、解答问题</div>
              </div>
              <div class="ai-feature-card" onclick="toggleImageGen()">
                <div class="ai-feature-icon blue">🖼️</div>
                <div class="ai-feature-name">图像生成</div>
                <div class="ai-feature-desc">描述需求生成图片</div>
              </div>
            </div>

            <!-- Suggestion chips -->
            <div class="ai-suggestions">
              <span class="ai-suggestion-chip" onclick="sendChat('推荐几个游戏项目')">推荐几个游戏项目</span>
              <span class="ai-suggestion-chip" onclick="sendChat('有哪些 AI 相关的项目？')">有哪些 AI 相关的项目？</span>
              <span class="ai-suggestion-chip" onclick="sendChat('我想做一个工具类项目')">我想做一个工具类项目</span>
              <span class="ai-suggestion-chip" onclick="sendChat('给我推荐热门项目')">给我推荐热门项目</span>
            </div>
          </div>
        </div>

        <!-- Input area -->
        <div class="ai-input-area">
          <select class="ai-model-select" id="modelSelect" onchange="setModel(this.value)">
            <option value="glm-4.7-flash">🧠 GLM-4.7-Flash</option>
            <optgroup label="OpenRouter (免费)">
              <option value="openrouter/free">🌐 Free Auto-Route</option>
              <option value="nvidia/nemotron-3-super-120b-a12b:free">🟢 Nemotron 3 Super 120B</option>
              <option value="nvidia/nemotron-3-ultra:free">🟢 Nemotron 3 Ultra</option>
              <option value="google/gemma-4-31b:free">🔵 Gemma 4 31B</option>
              <option value="openai/gpt-oss-20b:free">⚪ GPT-OSS 20B</option>
              <option value="qwen/qwen3-8b:free">🟠 Qwen3 8B</option>
            </optgroup>
          </select>
          <div class="ai-input-wrapper">
            <input type="text" class="ai-input" id="chatInput" placeholder="输入你的问题或需求..." autocomplete="off" />
          </div>
          <div class="ai-input-actions">
            <button class="ai-input-icon-btn" title="语音输入" onclick="voiceInput()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
            </button>
            <button class="ai-input-icon-btn" title="附件" onclick="attachFile()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
            </button>
          </div>
          <button class="ai-send-btn" id="sendBtn" onclick="sendChat()">
            发送
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // State
    const AI = {
      messages: [],
      conversations: [],
      currentConversation: null,
      model: 'glm-4.7-flash',
      awaiting: false,
      abortController: null,
      imageGenOpen: false
    };

    // Init
    document.addEventListener('DOMContentLoaded', () => {
      initModel();
      loadConversations();
      setupInput();
      fetchQuota();
    });

    function initModel() {
      try {
        const saved = localStorage.getItem('ai-model');
        if (saved) AI.model = saved;
      } catch {}
      const sel = document.getElementById('modelSelect');
      if (sel) sel.value = AI.model;
    }

    function setModel(model) {
      AI.model = model;
      try { localStorage.setItem('ai-model', model); } catch {}
    }

    function setupInput() {
      const input = document.getElementById('chatInput');
      if (input) {
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendChat();
          }
        });
      }
      const imgInput = document.getElementById('imagePrompt');
      if (imgInput) {
        imgInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            generateImage();
          }
        });
      }
    }

    async function fetchQuota() {
      try {
        const resp = await fetch('/api/ai-quota');
        const data = await resp.json();
        const el = document.getElementById('aiQuota');
        if (el && data && typeof data.remaining === 'number') {
          el.textContent = `今日剩余 ${data.remaining} 次`;
        }
      } catch {}
    }

    // Navigation
    function navTo(filter) {
      if (filter === 'about' || filter === 'mindmap' || filter === 'all' ||
          filter === 'web-game' || filter === 'game' || filter === 'ai' ||
          filter === 'tool' || filter === 'other' || filter === 'system-file') {
        window.location.href = '/?' + (filter !== 'all' ? 'filter=' + filter : '');
      }
    }

    // Conversations
    function loadConversations() {
      try {
        const saved = localStorage.getItem('ai-conversations');
        if (saved) AI.conversations = JSON.parse(saved);
      } catch {}
      renderConversations();
    }

    function saveConversations() {
      try { localStorage.setItem('ai-conversations', JSON.stringify(AI.conversations)); } catch {}
    }

    function renderConversations() {
      const list = document.getElementById('conversationList');
      if (!list) return;
      if (AI.conversations.length === 0) {
        list.innerHTML = '<div style="padding:24px 20px;text-align:center;color:var(--text-secondary);font-size:13px">暂无对话记录<br><span style="font-size:12px">点击下方按钮开始新对话</span></div>';
        return;
      }
      list.innerHTML = AI.conversations.map((c, i) => `
        <div class="ai-conversation-item ${AI.currentConversation === i ? 'active' : ''}" onclick="switchConversation(${i})">
          <span class="ai-conversation-title">${escapeHtml(c.title)}</span>
          <span class="ai-conversation-time">${c.time || ''}</span>
        </div>
      `).join('');
    }

    function newConversation() {
      if (AI.abortController) { AI.abortController.abort(); AI.abortController = null; }
      AI.messages = [];
      AI.currentConversation = null;
      AI.awaiting = false;
      renderMessages();
      renderConversations();
      const input = document.getElementById('chatInput');
      if (input) input.focus();
    }

    function switchConversation(idx) {
      AI.currentConversation = idx;
      AI.messages = [...(AI.conversations[idx]?.messages || [])];
      renderMessages();
      renderConversations();
    }

    function saveCurrentConversation(firstUserMsg) {
      const title = firstUserMsg.substring(0, 30) + (firstUserMsg.length > 30 ? '...' : '');
      const now = new Date();
      const time = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;

      if (AI.currentConversation !== null) {
        AI.conversations[AI.currentConversation].messages = [...AI.messages];
        AI.conversations[AI.currentConversation].title = title;
        AI.conversations[AI.currentConversation].time = time;
      } else {
        AI.conversations.unshift({ title, time, messages: [...AI.messages] });
        AI.currentConversation = 0;
      }
      saveConversations();
      renderConversations();
    }

    // Chat
    async function sendChat(prefilledText) {
      const input = document.getElementById('chatInput');
      const sendBtn = document.getElementById('sendBtn');
      if (!input || !sendBtn || AI.awaiting) return;

      let text = prefilledText || input.value.trim();
      if (!text) return;
      input.value = '';

      if (AI.abortController) AI.abortController.abort();
      AI.abortController = new AbortController();

      AI.awaiting = true;
      sendBtn.disabled = true;
      sendBtn.textContent = '发送中...';

      AI.messages.push({ role: 'user', content: text });
      addMessage('user', text);
      showTyping();

      if (AI.messages.length > 20) {
        AI.messages = AI.messages.slice(-20);
      }

      const isFirst = AI.messages.filter(m => m.role === 'user').length === 1;
      if (isFirst) saveCurrentConversation(text);

      try {
        const body = { messages: AI.messages, model: AI.model, needsProjects: needsProjectList(text) };
        const resp = await fetch('/api/recommend', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
          signal: AI.abortController.signal
        });

        removeTyping();
        const data = await resp.json();

        if (data.success) {
          AI.messages.push({ role: 'assistant', content: data.response || '' });
          addMessage('assistant', data.response, data.recommendations, data.reasoning);
          if (AI.currentConversation !== null) {
            AI.conversations[AI.currentConversation].messages = [...AI.messages];
            saveConversations();
          }
        } else {
          addMessage('assistant', data.error || '服务暂时不可用，请稍后再试。');
        }
      } catch (e) {
        removeTyping();
        if (e.name !== 'AbortError') {
          addMessage('assistant', '网络请求失败，请检查网络连接后重试。');
        }
      } finally {
        AI.awaiting = false;
        AI.abortController = null;
        sendBtn.disabled = false;
        sendBtn.innerHTML = '发送 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>';
        input.focus();
      }
    }

    function addMessage(role, content, recommendations, reasoning) {
      const container = document.getElementById('chatMessages');
      const welcome = document.getElementById('chatWelcome');
      if (!container) return;
      if (welcome) welcome.style.display = 'none';

      const msg = document.createElement('div');
      msg.className = `ai-msg ${role}`;

      const avatar = document.createElement('div');
      avatar.className = 'ai-msg-avatar';
      avatar.textContent = role === 'user' ? 'U' : '✨';

      const bubble = document.createElement('div');
      bubble.className = 'ai-msg-bubble';

      if (reasoning) {
        const rDiv = document.createElement('div');
        rDiv.innerHTML = `<details style="margin-bottom:8px"><summary style="cursor:pointer;color:var(--text-secondary);font-size:13px">🤔 推理过程</summary><div style="font-size:13px;color:var(--text-secondary);margin-top:8px;white-space:pre-wrap">${escapeHtml(reasoning)}</div></details>`;
        bubble.appendChild(rDiv);
      }

      if (content) {
        const textDiv = document.createElement('div');
        const escaped = escapeHtml(content);
        const withCode = escaped.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
        const withInline = withCode.replace(/`([^`]+)`/g, '<code>$1</code>');
        const withPara = withInline.split('\n').filter(Boolean).map(p => `<p>${p}</p>`).join('');
        textDiv.innerHTML = withPara || escaped;
        bubble.appendChild(textDiv);
      }

      msg.appendChild(avatar);
      msg.appendChild(bubble);

      if (recommendations && recommendations.length > 0) {
        const cards = document.createElement('div');
        cards.className = 'ai-msg-cards';
        const typeLabels = { 'game': '游戏', 'ai': 'AI', 'tool': '工具', 'other': '其他', 'web-game': '网页游戏' };
        const icons = { 'game': '🎮', 'ai': '🤖', 'tool': '🔧', 'other': '📁', 'web-game': '🌐' };
        cards.innerHTML = recommendations.map(rec => {
          const icon = icons[rec.type] || '📁';
          const label = typeLabels[rec.type] || '';
          return `<div class="ai-msg-card" onclick="window.open('/?project=${encodeURIComponent(rec.path)}','_blank')">
            <span class="ai-msg-card-icon">${icon}</span>
            <div class="ai-msg-card-info">
              <div class="ai-msg-card-name">${escapeHtml(rec.name)}</div>
              <div class="ai-msg-card-reason">${escapeHtml(rec.reason)}</div>
            </div>
            ${label ? `<span class="ai-msg-card-type">${label}</span>` : ''}
          </div>`;
        }).join('');
        bubble.appendChild(cards);
      }

      container.appendChild(msg);
      container.scrollTop = container.scrollHeight;
    }

    function showTyping() {
      const container = document.getElementById('chatMessages');
      if (!container) return;
      const welcome = document.getElementById('chatWelcome');
      if (welcome) welcome.style.display = 'none';
      const div = document.createElement('div');
      div.className = 'ai-msg assistant ai-typing-msg';
      div.innerHTML = '<div class="ai-msg-avatar">✨</div><div class="ai-msg-bubble"><div class="ai-typing"><span></span><span></span><span></span></div></div>';
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    function removeTyping() {
      const el = document.querySelector('.ai-typing-msg');
      if (el) el.remove();
    }

    function renderMessages() {
      const container = document.getElementById('chatMessages');
      if (!container) return;
      container.innerHTML = '';
      if (AI.messages.length === 0) {
        container.innerHTML = getWelcomeHTML();
        return;
      }
      AI.messages.forEach(m => addMessage(m.role, m.content));
    }

    function getWelcomeHTML() {
      return `<div class="ai-welcome" id="chatWelcome">
        <div class="ai-welcome-robot">
          <svg width="100" height="100" viewBox="0 0 100 100" fill="none">
            <line x1="50" y1="8" x2="50" y2="20" stroke="#7b61ff" stroke-width="2" stroke-linecap="round"/>
            <circle cx="50" cy="6" r="4" fill="#7b61ff"/>
            <rect x="28" y="20" width="44" height="36" rx="12" fill="#f0f4ff" stroke="#7b61ff" stroke-width="2"/>
            <circle cx="42" cy="36" r="5" fill="#7b61ff"/>
            <circle cx="58" cy="36" r="5" fill="#7b61ff"/>
            <circle cx="43" cy="35" r="2" fill="#fff"/>
            <circle cx="59" cy="35" r="2" fill="#fff"/>
            <path d="M42 46 Q50 52 58 46" stroke="#7b61ff" stroke-width="2" stroke-linecap="round" fill="none"/>
            <rect x="32" y="58" width="36" height="28" rx="8" fill="#ede9fe" stroke="#7b61ff" stroke-width="2"/>
            <circle cx="50" cy="72" r="3" fill="#7b61ff"/>
            <line x1="32" y1="66" x2="22" y2="72" stroke="#7b61ff" stroke-width="2" stroke-linecap="round"/>
            <line x1="68" y1="66" x2="78" y2="72" stroke="#7b61ff" stroke-width="2" stroke-linecap="round"/>
            <circle cx="20" cy="73" r="3" fill="#7b61ff"/>
            <circle cx="80" cy="73" r="3" fill="#7b61ff"/>
          </svg>
        </div>
        <h2>今天想让 AI 帮你做什么？</h2>
        <p>我可以帮你推荐项目、回答代码问题、生成图片，或者和你聊天。</p>
        <div class="ai-feature-cards">
          <div class="ai-feature-card" onclick="sendChat('推荐几个游戏项目')">
            <div class="ai-feature-icon purple">🤖</div>
            <div class="ai-feature-name">智能问答</div>
            <div class="ai-feature-desc">推荐项目、解答问题</div>
          </div>
          <div class="ai-feature-card" onclick="toggleImageGen()">
            <div class="ai-feature-icon blue">🖼️</div>
            <div class="ai-feature-name">图像生成</div>
            <div class="ai-feature-desc">描述需求生成图片</div>
          </div>
        </div>
        <div class="ai-suggestions">
          <span class="ai-suggestion-chip" onclick="sendChat('推荐几个游戏项目')">推荐几个游戏项目</span>
          <span class="ai-suggestion-chip" onclick="sendChat('有哪些 AI 相关的项目？')">有哪些 AI 相关的项目？</span>
          <span class="ai-suggestion-chip" onclick="sendChat('我想做一个工具类项目')">我想做一个工具类项目</span>
          <span class="ai-suggestion-chip" onclick="sendChat('给我推荐热门项目')">给我推荐热门项目</span>
        </div>
      </div>`;
    }

    function clearChat() {
      if (AI.abortController) { AI.abortController.abort(); AI.abortController = null; }
      AI.messages = [];
      AI.awaiting = false;
      AI.currentConversation = null;
      renderMessages();
      renderConversations();
    }

    // Image generation
    function toggleImageGen() {
      AI.imageGenOpen = !AI.imageGenOpen;
      const panel = document.getElementById('imageGenPanel');
      if (panel) panel.classList.toggle('active', AI.imageGenOpen);
      if (AI.imageGenOpen) {
        const input = document.getElementById('imagePrompt');
        if (input) setTimeout(() => input.focus(), 100);
      }
    }

    async function generateImage() {
      const prompt = document.getElementById('imagePrompt')?.value.trim();
      const size = document.getElementById('imageSize')?.value;
      const btn = document.getElementById('imageGenBtn');
      if (!prompt || !btn) return;

      btn.disabled = true;
      btn.textContent = '生成中...';

      addMessage('user', `[生成图片] ${prompt}`);
      showTyping();

      try {
        const resp = await fetch('/api/generate-image', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt, size })
        });
        removeTyping();
        const data = await resp.json();
        if (data.url) {
          const container = document.getElementById('chatMessages');
          const msg = document.createElement('div');
          msg.className = 'ai-msg assistant';
          msg.innerHTML = `<div class="ai-msg-avatar">✨</div><div class="ai-msg-bubble"><p>图片生成完成：</p><img class="ai-msg-image" src="${escapeHtml(data.url)}" alt="生成的图片" onclick="window.open('${escapeHtml(data.url)}','_blank')" /></div>`;
          container.appendChild(msg);
          container.scrollTop = container.scrollHeight;
        } else {
          addMessage('assistant', data.error || '图片生成失败，请稍后再试。');
        }
      } catch (e) {
        removeTyping();
        addMessage('assistant', '图片生成请求失败，请检查网络连接。');
      } finally {
        btn.disabled = false;
        btn.textContent = '生成图片';
      }
    }

    // Voice input (placeholder)
    function voiceInput() {
      if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
        alert('当前浏览器不支持语音输入');
        return;
      }
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const recognition = new SpeechRecognition();
      recognition.lang = 'zh-CN';
      recognition.continuous = false;
      recognition.interimResults = false;
      const input = document.getElementById('chatInput');
      recognition.onresult = function(event) {
        if (input) {
          input.value = event.results[0][0].transcript;
          input.focus();
        }
      };
      recognition.start();
    }

    // File attachment (placeholder)
    function attachFile() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.txt,.md,.py,.js,.json,.html,.css,.csv';
      input.onchange = function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(ev) {
          const content = ev.target.result;
          const text = `请分析以下文件 ${file.name} 的内容：\n\n\`\`\`\n${content.substring(0, 2000)}\n\`\`\``;
          sendChat(text);
        };
        reader.readAsText(file);
      };
      input.click();
    }

    // Helpers
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str || '';
      return div.innerHTML;
    }

    function needsProjectList(text) {
      const lower = text.toLowerCase();
      return ['推荐','项目','有什么','哪些','找一个','适合','游戏','工具','ai','热门','好玩','有趣'].some(kw => lower.includes(kw));
    }
  </script>
</body>
</html>

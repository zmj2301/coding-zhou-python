name = "coding-zhou-python"
compatibility_date = "2025-08-01"
compatibility_flags = ["streams_enable_constructors", "transformstream_enable_standard_constructor"]
main = "code-explorer/worker.ts"

[vars]
GITHUB_REPO = "zmj2301/coding-zhou-python"
GITHUB_BRANCH = "main"
# Worker 子请求不能直连裸 IP（Cloudflare 返回 error 1003），也不能用 *.nip.io（被 CF 边缘接管，返回 520）。
# *.sslip.io 由第三方权威 DNS 直接解析到 ECS 公网 IP，CF 正常回源，因此作为 ECS 代理入口。
ECS_SERVER_URL = "http://39-107-96-165.sslip.io"
OLLAMA_TUNNEL_URL = "https://ollama.codingzhou.top"

account_id = "d6b8ca32610afe0fd9407736b9266cb3"

[[kv_namespaces]]
binding = "CODE_EXPLORER_KV"
id = "69c61f369a764a519631b00e613f7ea6"
preview_id = "69c61f369a764a519631b00e613f7ea6"

[assets]
binding = "ASSETS"
directory = "public"
# public/ 下物理存在的文件默认由 CF Assets CDN 直接返回，不会经过 Worker，
# 导致前端登录墙（如 /fathers-day）被绕过。这里强制这些路径先走 Worker。
run_worker_first = ["/fathers-day", "/fathers-day/*"]

[ai]
binding = "AI"

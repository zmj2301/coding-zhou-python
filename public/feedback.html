<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>意见反馈 - Code Explorer</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

:root {
  --bg-primary: #0d1117;
  --bg-secondary: #161b22;
  --bg-tertiary: #21262d;
  --bg-overlay: #30363d;
  --border-color: #30363d;
  --border-light: #21262d;
  --text-primary: #c9d1d9;
  --text-secondary: #8b949e;
  --text-tertiary: #6e7681;
  --accent-blue: #58a6ff;
  --accent-green: #3fb950;
  --accent-yellow: #d29922;
  --accent-red: #f85149;
  --accent-purple: #a371f7;
  --accent-orange: #f0883e;
  --accent-pink: #db61a2;
  --accent-cyan: #39d353;
  --font-mono: 'JetBrains Mono','Cascadia Code','Fira Code','Consolas','Monaco',monospace;
  --font-sans: -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  --transition: 150ms ease;
  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 12px;
}

[data-theme="light"] {
  --bg-primary: #ffffff;
  --bg-secondary: #f6f8fa;
  --bg-tertiary: #eaeef2;
  --bg-overlay: #d0d7de;
  --border-color: #d0d7de;
  --border-light: #eaeef2;
  --text-primary: #24292f;
  --text-secondary: #57606a;
  --text-tertiary: #8c959f;
  --accent-blue: #0969da;
  --accent-green: #1a7f37;
  --accent-yellow: #bf8700;
  --accent-red: #cf222e;
  --accent-purple: #8250df;
  --accent-orange: #bf5612;
  --accent-pink: #bf3c5b;
  --accent-cyan: #1a7f37;
}

body {
  font-family: var(--font-sans);
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: -1;
  background-image:
    linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
  background-size: 24px 24px;
}

[data-theme="light"] body::before {
  background-image:
    linear-gradient(rgba(0,0,0,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,0,0,0.03) 1px, transparent 1px);
}

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--bg-overlay); border-radius: 5px; }
::-webkit-scrollbar-thumb:hover { background: var(--border-color); }
[data-theme="light"] ::-webkit-scrollbar-thumb { background: var(--border-color); }

/* ========== Top Bar ========== */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 24px;
  border-bottom: 1px solid var(--border-color);
  background: var(--bg-secondary);
  position: sticky;
  top: 0;
  z-index: 100;
}

.topbar-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 14px;
  background: var(--bg-tertiary);
  color: var(--text-primary);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  font-size: 13px;
  cursor: pointer;
  transition: var(--transition);
  text-decoration: none;
}

.back-btn:hover { background: var(--bg-overlay); }

.topbar-title {
  font-size: 16px;
  font-weight: 600;
  color: var(--text-primary);
}

.topbar-right {
  display: flex;
  align-items: center;
  gap: 10px;
}

.user-chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px;
  background: var(--bg-tertiary);
  border-radius: 999px;
  font-size: 12px;
  color: var(--text-secondary);
}

.user-chip b { color: var(--text-primary); }

.theme-toggle-btn {
  width: 34px;
  height: 34px;
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  background: var(--bg-tertiary);
  color: var(--text-primary);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: var(--transition);
}

.theme-toggle-btn:hover { background: var(--bg-overlay); }
.theme-toggle-btn svg { width: 17px; height: 17px; }
[data-theme="light"] .theme-toggle-btn .sun-icon { display: none; }
[data-theme="light"] .theme-toggle-btn .moon-icon { display: block; }
.theme-toggle-btn .moon-icon { display: none; }

/* ========== Layout ========== */
.container {
  max-width: 860px;
  margin: 0 auto;
  padding: 32px 24px 60px;
}

.page-head {
  margin-bottom: 24px;
}

.page-head h1 {
  font-size: 24px;
  font-weight: 700;
  margin-bottom: 6px;
}

.page-head p {
  color: var(--text-secondary);
  font-size: 14px;
  line-height: 1.6;
}

/* ========== Tabs ========== */
.tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 24px;
  border-bottom: 1px solid var(--border-color);
  padding-bottom: 0;
}

.tab {
  padding: 10px 18px;
  font-size: 14px;
  color: var(--text-secondary);
  cursor: pointer;
  border: none;
  background: none;
  border-bottom: 2px solid transparent;
  transition: var(--transition);
  font-family: var(--font-sans);
}

.tab:hover { color: var(--text-primary); }
.tab.active {
  color: var(--accent-blue);
  border-bottom-color: var(--accent-blue);
  font-weight: 500;
}

/* ========== Card & Form ========== */
.card {
  background: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  padding: 24px;
}

.form-group { margin-bottom: 20px; }

.form-label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
  margin-bottom: 8px;
}

.form-label .required { color: var(--accent-red); }

.form-select,
.form-textarea,
.form-input {
  width: 100%;
  padding: 10px 12px;
  background: var(--bg-primary);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  color: var(--text-primary);
  font-size: 14px;
  font-family: var(--font-sans);
  transition: var(--transition);
}

.form-select:focus,
.form-textarea:focus,
.form-input:focus {
  outline: none;
  border-color: var(--accent-blue);
  box-shadow: 0 0 0 3px rgba(88,166,255,0.12);
}

.form-textarea {
  min-height: 120px;
  resize: vertical;
  line-height: 1.6;
}

.form-hint {
  font-size: 12px;
  color: var(--text-tertiary);
  margin-top: 6px;
}

.star-rating {
  display: inline-flex;
  gap: 6px;
  font-size: 28px;
  cursor: pointer;
  user-select: none;
}

.star-rating .star {
  color: var(--border-color);
  transition: transform 0.15s, color 0.15s, text-shadow 0.15s;
  line-height: 1;
}

.star-rating .star:hover {
  transform: scale(1.2);
}

.star-rating .star.active {
  color: var(--accent-yellow);
  text-shadow: 0 0 12px rgba(210,153,34,0.5);
}

.rating-label { margin-left: 10px; font-size: 13px; color: var(--text-secondary); }

.submit-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 11px 24px;
  background: var(--accent-blue);
  color: #fff;
  border: none;
  border-radius: var(--radius-md);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: var(--transition);
}

.submit-btn:hover { filter: brightness(1.1); }
.submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }

/* ========== Message Toast ========== */
.message {
  padding: 14px 18px;
  border-radius: var(--radius-md);
  margin-bottom: 16px;
  font-size: 14px;
  font-weight: 500;
  display: none;
  border-left: 4px solid transparent;
  animation: none;
}

.message.show { display: block; animation: messageIn 0.3s ease; }
.message.success { background: rgba(63,185,80,0.15); color: var(--accent-green); border-color: var(--accent-green); }
.message.error { background: rgba(248,81,73,0.15); color: var(--accent-red); border-color: var(--accent-red); }

@keyframes messageIn {
  from { opacity: 0; transform: translateY(-10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ========== Ticket List ========== */
.ticket-list { display: flex; flex-direction: column; gap: 12px; }

.ticket-card {
  background: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  padding: 18px 20px;
  cursor: pointer;
  transition: var(--transition);
}

.ticket-card:hover {
  border-color: var(--accent-blue);
  box-shadow: 0 4px 16px rgba(88,166,255,0.1);
}

.ticket-card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 10px;
}

.ticket-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.ticket-type {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 500;
}

.type-bug { background: rgba(248,81,73,0.15); color: var(--accent-red); }
.type-feature { background: rgba(88,166,255,0.15); color: var(--accent-blue); }
.type-suggestion { background: rgba(163,113,247,0.15); color: var(--accent-purple); }
.type-praise { background: rgba(63,185,80,0.15); color: var(--accent-green); }
.type-other { background: rgba(139,148,158,0.15); color: var(--text-secondary); }

.status-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 10px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 500;
}

.status-badge::before {
  content: '';
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
}

.status-new { background: rgba(88,166,255,0.15); color: var(--accent-blue); }
.status-processing { background: rgba(210,153,34,0.15); color: var(--accent-yellow); }
.status-resolved { background: rgba(63,185,80,0.15); color: var(--accent-green); }
.status-closed { background: rgba(139,148,158,0.15); color: var(--text-tertiary); }

.ticket-content {
  font-size: 14px;
  color: var(--text-primary);
  line-height: 1.6;
  margin-bottom: 10px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.ticket-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  font-size: 12px;
  color: var(--text-tertiary);
}

.ticket-foot-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.reply-count {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  color: var(--accent-blue);
}

/* ========== Ticket Detail ========== */
.ticket-detail { padding: 0; overflow: hidden; }

.detail-head {
  padding: 20px 24px;
  border-bottom: 1px solid var(--border-color);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.detail-head-left {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.detail-body { padding: 24px; }

.original-post {
  background: var(--bg-primary);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  padding: 16px;
  margin-bottom: 20px;
}

.original-post-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}

.original-post-user {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--text-secondary);
}

.avatar {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 600;
  color: #fff;
}

.original-post-content {
  font-size: 14px;
  line-height: 1.7;
  white-space: pre-wrap;
  word-break: break-word;
}

.rating-stars {
  margin-top: 10px;
  color: var(--accent-yellow);
  font-size: 16px;
}

.replies-section {
  border-top: 1px solid var(--border-color);
  padding-top: 20px;
}

.replies-title {
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 14px;
  color: var(--text-secondary);
}

.reply-item {
  background: var(--bg-primary);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  padding: 14px 16px;
  margin-bottom: 10px;
  border-left: 3px solid var(--accent-blue);
}

.reply-item.admin-reply { border-left-color: var(--accent-purple); }

.reply-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
}

.reply-user {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
}

.reply-user .badge-admin {
  background: var(--accent-purple);
  color: #fff;
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 3px;
  font-weight: 600;
}

.reply-time { font-size: 12px; color: var(--text-tertiary); }

.reply-content {
  font-size: 14px;
  line-height: 1.6;
  white-space: pre-wrap;
  word-break: break-word;
}

.reply-form {
  margin-top: 20px;
  padding-top: 20px;
  border-top: 1px solid var(--border-color);
}

.quick-replies {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 12px;
}

.quick-reply {
  padding: 6px 12px;
  border: 1px solid var(--border-color);
  border-radius: 16px;
  font-size: 12px;
  cursor: pointer;
  background: var(--bg-secondary);
  color: var(--text-secondary);
  transition: all 0.15s ease;
  user-select: none;
}

.quick-reply:hover {
  border-color: var(--accent-blue);
  color: var(--accent-blue);
  background: rgba(88, 166, 255, 0.1);
}

.reply-form textarea {
  min-height: 80px;
  margin-bottom: 12px;
}

.detail-actions {
  display: flex;
  gap: 8px;
  align-items: center;
}

.status-select {
  padding: 6px 10px;
  background: var(--bg-primary);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-sm);
  color: var(--text-primary);
  font-size: 13px;
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 14px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  cursor: pointer;
  border: 1px solid var(--border-color);
  background: var(--bg-tertiary);
  color: var(--text-primary);
  transition: var(--transition);
  font-family: var(--font-sans);
}

.btn:hover { background: var(--bg-overlay); }
.btn-danger { background: rgba(248,81,73,0.15); color: var(--accent-red); border-color: rgba(248,81,73,0.3); }
.btn-danger:hover { background: rgba(248,81,73,0.25); }
.btn-primary { background: var(--accent-blue); color: #fff; border-color: var(--accent-blue); }
.btn-primary:hover { filter: brightness(1.1); }

/* ========== Empty / Loading ========== */
.loading-state, .empty-state {
  text-align: center;
  padding: 48px 24px;
  color: var(--text-tertiary);
}

.loading-state .spinner {
  width: 32px;
  height: 32px;
  border: 3px solid var(--border-color);
  border-top-color: var(--accent-blue);
  border-radius: 50%;
  margin: 0 auto 12px;
  animation: spin 0.8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

.empty-state svg { width: 48px; height: 48px; margin-bottom: 12px; opacity: 0.5; }
.empty-state p { font-size: 14px; }

/* ========== Filter Bar ========== */
.filter-bar {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}

.filter-btn {
  padding: 6px 14px;
  font-size: 13px;
  border-radius: 999px;
  border: 1px solid var(--border-color);
  background: var(--bg-tertiary);
  color: var(--text-secondary);
  cursor: pointer;
  transition: var(--transition);
  font-family: var(--font-sans);
}

.filter-btn:hover { color: var(--text-primary); }
.filter-btn.active { background: var(--accent-blue); color: #fff; border-color: var(--accent-blue); }

/* ========== Responsive ========== */
@media (max-width: 768px) {
  .container { padding: 20px 16px 40px; }
  .topbar { padding: 12px 16px; }
  .card { padding: 20px 16px; }
  .page-head h1 { font-size: 20px; }
  .detail-head { padding: 16px; flex-direction: column; align-items: flex-start; }
  .ticket-card-head { flex-direction: column; align-items: flex-start; }
  .topbar-title { display: none; }
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <a href="/" class="back-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><polyline points="15 18 9 12 15 6"></polyline></svg>
      返回
    </a>
    <span class="topbar-title">意见反馈</span>
  </div>
  <div class="topbar-right">
    <div class="user-chip" id="userChip" style="display:none">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      <span>你好，<b id="chipName"></b></span>
    </div>
    <button class="theme-toggle-btn" id="themeToggleBtn" title="切换主题 (Ctrl+T)">
      <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="17" height="17"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
      <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="17" height="17"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
    </button>
  </div>
</div>

<div class="container">
  <!-- Global Tabs -->
  <div class="tabs" id="mainTabs">
    <button class="tab active" id="tabSubmit">✍️ 提交新意见</button>
    <button class="tab" id="tabInbox">📋 <span id="inboxTabLabel">我的工单</span></button>
  </div>

  <!-- Submit View -->
  <div id="submitView">
    <div class="page-head">
      <h1>提交意见</h1>
      <p>欢迎提出您的宝贵意见，帮助我们做得更好。</p>
    </div>

    <div class="card">
      <div id="message"></div>
      <form id="feedbackForm">
        <div class="form-group">
          <label class="form-label">意见类型 <span class="required">*</span></label>
          <select class="form-select" id="feedbackType">
            <option value="bug">🐞 Bug 反馈</option>
            <option value="feature">✨ 功能建议</option>
            <option value="suggestion">💡 改进建议</option>
            <option value="praise">🌟 表扬</option>
            <option value="other">📌 其他</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">内容 <span class="required">*</span></label>
          <textarea class="form-textarea" id="feedbackContent" placeholder="请详细描述您的意见或建议... (至少 5 个字)" maxlength="2000"></textarea>
          <div class="form-hint"><span id="contentCount">0</span>/2000 字</div>
        </div>

        <div class="form-group">
          <label class="form-label">评分 <span class="required">*</span></label>
          <div>
            <div class="star-rating" id="starRating">
              <span class="star" data-value="1">★</span>
              <span class="star" data-value="2">★</span>
              <span class="star" data-value="3">★</span>
              <span class="star" data-value="4">★</span>
              <span class="star" data-value="5">★</span>
            </div>
            <span class="rating-label" id="ratingLabel">请选择评分</span>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">相关项目 <span style="color:var(--text-tertiary);font-weight:400">（可选）</span></label>
          <input class="form-input" id="feedbackProject" placeholder="填写相关项目名称，例如：植物大战僵尸">
          <div class="form-hint">如果意见与某个具体项目相关，请填写项目名称</div>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
          提交意见
        </button>
      </form>
    </div>
  </div>

  <!-- Tickets / Inbox View -->
  <div id="ticketsView" style="display:none">
    <div class="page-head">
      <h1 id="ticketsTitle">我的工单</h1>
      <p id="ticketsDesc">查看您提交的反馈和管理员的回复</p>
    </div>

    <div id="filterBar" class="filter-bar" style="display:none">
      <button class="filter-btn active" data-status="all">全部</button>
      <button class="filter-btn" data-status="new">🆕 新提交</button>
      <button class="filter-btn" data-status="processing">⏳ 处理中</button>
      <button class="filter-btn" data-status="resolved">✅ 已解决</button>
      <button class="filter-btn" data-status="closed">📕 已关闭</button>
    </div>

    <div id="ticketsList">
      <div class="loading-state"><div class="spinner"></div><div>加载中...</div></div>
    </div>
  </div>

  <!-- Ticket Detail View -->
  <div id="detailView" style="display:none">
    <div class="page-head">
      <button class="btn" id="backToListBtn" style="margin-bottom:12px">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><polyline points="15 18 9 12 15 6"></polyline></svg>
        返回列表
      </button>
      <h1 id="detailTitle">工单详情</h1>
    </div>

    <div class="card ticket-detail" id="detailCard">
      <div class="loading-state"><div class="spinner"></div><div>加载中...</div></div>
    </div>
  </div>
</div>

<script>
// ========== Safe DOM Helpers ==========
function $(id) { return document.getElementById(id); }

// ========== Theme ==========
var THEME_KEY = 'code_explorer_theme';
function getTheme() { return localStorage.getItem(THEME_KEY) || 'dark'; }
function setTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  try { localStorage.setItem(THEME_KEY, theme); } catch(e) {}
}
function toggleTheme() { setTheme(getTheme() === 'dark' ? 'light' : 'dark'); }
setTheme(getTheme());

document.addEventListener('DOMContentLoaded', function() {
'use strict';

// ========== Theme Init ==========
var themeBtn = $('themeToggleBtn');
if (themeBtn) themeBtn.addEventListener('click', toggleTheme);

document.addEventListener('keydown', function(e) {
  if ((e.ctrlKey || e.metaKey) && e.key === 't') {
    e.preventDefault();
    toggleTheme();
  }
});

// ========== State ==========
var state = {
  currentUser: null,
  isAdmin: false,
  rating: 0,
  currentTicketId: null,
  currentFilter: 'all'
};

// ========== Auth ==========
async function checkAuth() {
  try {
    var r = await fetch('/api/auth-check');
    if (!r.ok) throw new Error('Auth check failed');
    var d = await r.json();
    if (d.authenticated && d.user) {
      state.currentUser = d.user;
      state.isAdmin = d.user.role === 'admin';
      var chip = $('userChip');
      if (chip) chip.style.display = 'inline-flex';
      var name = $('chipName');
      if (name) name.textContent = d.user.username;

      // Configure inbox tab based on role
      var inboxTab = $('tabInbox');
      var inboxLabel = $('inboxTabLabel');
      var ticketsTitle = $('ticketsTitle');
      var ticketsDesc = $('ticketsDesc');

      if (state.isAdmin) {
        // Admin: show "意见箱" with management features
        if (inboxLabel) inboxLabel.textContent = '意见箱';
        if (ticketsTitle) ticketsTitle.textContent = '📋 意见箱';
        if (ticketsDesc) ticketsDesc.textContent = '查看所有用户提交的工单，进行回复和状态管理';
      } else {
        // Non-admin: show "我的工单" (read-only personal tickets)
        if (inboxLabel) inboxLabel.textContent = '我的工单';
        if (ticketsTitle) ticketsTitle.textContent = '📋 我的工单';
        if (ticketsDesc) ticketsDesc.textContent = '查看您提交的反馈和管理员的回复';
      }

      return true;
    }
  } catch(e) {
    console.warn('Auth check error:', e.message);
  }
  window.location.href = '/';
  return false;
}

// ========== View Switching ==========
function showSubmitView() {
  var sv = $('submitView'), tv = $('ticketsView'), dv = $('detailView');
  if (sv) sv.style.display = 'block';
  if (tv) tv.style.display = 'none';
  if (dv) dv.style.display = 'none';
  var t1 = $('tabSubmit'); if (t1) t1.classList.add('active');
  var t2 = $('tabInbox'); if (t2) t2.classList.remove('active');
}

async function showTicketsView() {
  var sv = $('submitView'), tv = $('ticketsView'), dv = $('detailView');
  if (sv) sv.style.display = 'none';
  if (tv) tv.style.display = 'block';
  if (dv) dv.style.display = 'none';
  var t1 = $('tabSubmit'); if (t1) t1.classList.remove('active');
  var t2 = $('tabInbox'); if (t2) t2.classList.add('active');
  var fb = $('filterBar');
  if (fb) fb.style.display = state.isAdmin ? 'flex' : 'none';
  try { await loadTickets(); } catch(err) { console.error('loadTickets error:', err); }
}

async function showDetailView(ticketId) {
  state.currentTicketId = ticketId;
  var sv = $('submitView'), tv = $('ticketsView'), dv = $('detailView');
  if (sv) sv.style.display = 'none';
  if (tv) tv.style.display = 'none';
  if (dv) dv.style.display = 'block';
  try { await loadTicketDetail(ticketId); } catch(err) { console.error('loadTicketDetail error:', err); }
}

// ========== Event Bindings ==========
var el1 = $('tabSubmit'); if (el1) el1.addEventListener('click', showSubmitView);
var el2 = $('tabInbox'); if (el2) el2.addEventListener('click', showTicketsView);
var el5 = $('backToListBtn'); if (el5) el5.addEventListener('click', showTicketsView);

// Filter bar
var filterBar = $('filterBar');
if (filterBar) {
  filterBar.addEventListener('click', function(e) {
    var btn = e.target.closest('.filter-btn');
    if (!btn) return;
    filterBar.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
    state.currentFilter = btn.getAttribute('data-status');
    loadTickets();
  });
}

// ========== Star Rating ==========
var ratingTexts = ['', '非常不满意', '不满意', '一般', '满意', '非常满意'];
var starRating = $('starRating');

if (starRating) {
  starRating.addEventListener('click', function(e) {
    var star = e.target.closest('.star');
    if (!star) return;
    state.rating = parseInt(star.getAttribute('data-value'), 10);
    updateStars();
  });

  starRating.addEventListener('mouseleave', updateStars);
}

function updateStars() {
  var stars = document.querySelectorAll('#starRating .star');
  for (var i = 0; i < stars.length; i++) {
    var val = parseInt(stars[i].getAttribute('data-value'), 10);
    if (val <= state.rating) {
      stars[i].classList.add('active');
    } else {
      stars[i].classList.remove('active');
    }
  }
  var label = $('ratingLabel');
  if (label) {
    label.textContent = state.rating ? ratingTexts[state.rating] : '请选择评分';
  }
}

// ========== Content Counter ==========
var contentInput = $('feedbackContent');
if (contentInput) {
  contentInput.addEventListener('input', function() {
    var counter = $('contentCount');
    if (counter) counter.textContent = this.value.length;
  });
}

// ========== Messages ==========
function showMessage(type, text) {
  var el = $('message');
  if (!el) return;
  el.className = 'message ' + type + ' show';
  el.textContent = text;
  try { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch(e) {}
  setTimeout(function() {
    el.className = 'message';
  }, 4000);
}

// ========== Submit Feedback ==========
async function submitFeedback(e) {
  if (e) e.preventDefault();
  var type = $('feedbackType').value;
  var content = $('feedbackContent').value.trim();
  var project = $('feedbackProject') ? $('feedbackProject').value.trim() : '';
  var rating = state.rating;

  if (!content) { showMessage('error', '请输入反馈内容'); return; }
  if (content.length < 5) { showMessage('error', '反馈内容至少 5 个字'); return; }
  if (!rating) { showMessage('error', '请选择评分'); return; }

  var btn = $('submitBtn');
  btn.disabled = true;
  btn.textContent = '提交中...';

  try {
    var r = await fetch('/api/feedback', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ type: type, content: content, rating: rating, project: project })
    });
    var d = await r.json();
    if (r.ok) {
      showMessage('success', '✅ 感谢您的反馈！意见已提交，即将返回首页...');
      $('feedbackContent').value = '';
      if ($('feedbackProject')) $('feedbackProject').value = '';
      state.rating = 0;
      updateStars();
      var counter = $('contentCount');
      if (counter) counter.textContent = '0';
      setTimeout(function() { window.location.href = '/'; }, 2000);
    } else {
      showMessage('error', d.error || '提交失败，请重试');
      btn.disabled = false;
      btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg> 提交意见';
    }
  } catch(err) {
    showMessage('error', '网络错误，请重试');
    btn.disabled = false;
    btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg> 提交意见';
  }
}

var feedbackForm = $('feedbackForm');
if (feedbackForm) {
  feedbackForm.addEventListener('submit', function(e) {
    e.preventDefault();
    submitFeedback(e);
    return false;
  });
}

// ========== Helpers ==========
function escapeHtml(s) {
  var d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

function formatTime(ts) {
  if (!ts) return '';
  var d = new Date(ts * 1000);
  var pad = function(n) { return n < 10 ? '0' + n : '' + n; };
  return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}

function starsHtml(n) {
  var s = '';
  for (var i = 0; i < 5; i++) s += i < n ? '★' : '☆';
  return s;
}

var typeNames = { bug: 'Bug 反馈', feature: '功能建议', suggestion: '改进建议', praise: '表扬', other: '其他' };
var typeClasses = { bug: 'type-bug', feature: 'type-feature', suggestion: 'type-suggestion', praise: 'type-praise', other: 'type-other' };
var statusNames = { new: '新提交', processing: '处理中', resolved: '已解决', closed: '已关闭' };
var statusClasses = { new: 'status-new', processing: 'status-processing', resolved: 'status-resolved', closed: 'status-closed' };

// ========== Load Tickets List ==========
async function loadTickets() {
  var container = $('ticketsList');
  if (!container) return;
  container.innerHTML = '<div class="loading-state"><div class="spinner"></div><div>加载中...</div></div>';

  try {
    var r = await fetch('/api/feedback/list');
    var d = await r.json();
    if (!r.ok) {
      container.innerHTML = '<div class="empty-state"><p>' + escapeHtml(d.error || '加载失败') + '</p></div>';
      return;
    }

    var items = d.feedback || [];
    if (state.currentFilter !== 'all') {
      items = items.filter(function(f) { return f.status === state.currentFilter; });
    }

    if (items.length === 0) {
      container.innerHTML = '<div class="empty-state">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>' +
        '<p>暂无工单反馈</p></div>';
      return;
    }

    var html = '<div class="ticket-list">';
    for (var idx = 0; idx < items.length; idx++) {
      var f = items[idx];
      var avatar = escapeHtml((f.username || '?').charAt(0).toUpperCase());
      var time = formatTime(f.created_at);
      var typeName = escapeHtml(typeNames[f.type] || f.type || '其他');
      var statusName = escapeHtml(statusNames[f.status] || f.status || 'new');
      var replyCount = f.reply_count || 0;
      var contentPreview = escapeHtml(f.content.length > 100 ? f.content.slice(0, 100) + '...' : f.content);
      var projectHtml = f.project ? '<span style="color:var(--text-tertiary)">📁 ' + escapeHtml(f.project) + '</span>' : '';

      html += '<div class="ticket-card" data-id="' + f.id + '">' +
        '<div class="ticket-card-head">' +
          '<div class="ticket-meta">' +
            '<span class="ticket-type ' + (typeClasses[f.type] || 'type-other') + '">' + typeName + '</span>' +
            '<span class="status-badge ' + (statusClasses[f.status] || 'status-new') + '">' + statusName + '</span>' +
          '</div>' +
        '</div>' +
        '<div class="ticket-content">' + contentPreview + '</div>' +
        '<div class="ticket-foot">' +
          '<div class="ticket-foot-left">' +
            '<span><span class="avatar" style="width:20px;height:20px;font-size:10px">' + avatar + '</span> ' + escapeHtml(f.username || '匿名') + '</span>' +
            projectHtml +
          '</div>' +
          '<div class="ticket-foot-left">' +
            '<span class="reply-count">💬 ' + replyCount + ' 条回复</span>' +
            '<span>' + time + '</span>' +
          '</div>' +
        '</div>' +
      '</div>';
    }
    html += '</div>';
    container.innerHTML = html;

    var cards = container.querySelectorAll('.ticket-card');
    for (var i = 0; i < cards.length; i++) {
      cards[i].addEventListener('click', function() {
        showDetailView(parseInt(this.getAttribute('data-id')));
      });
    }

    var fb = $('filterBar');
    if (fb) fb.style.display = state.isAdmin ? 'flex' : 'none';

  } catch(err) {
    container.innerHTML = '<div class="empty-state"><p>加载失败：' + escapeHtml(err.message) + '</p></div>';
  }
}

// ========== Load Ticket Detail ==========
async function loadTicketDetail(ticketId) {
  var card = $('detailCard');
  if (!card) return;
  card.className = 'card ticket-detail';
  card.innerHTML = '<div class="loading-state"><div class="spinner"></div><div>加载中...</div></div>';

  try {
    var r = await fetch('/api/feedback/detail?id=' + ticketId);
    var d = await r.json();
    if (!r.ok) {
      card.innerHTML = '<div class="empty-state"><p>' + escapeHtml(d.error || '加载失败') + '</p></div>';
      return;
    }

    var avatar = escapeHtml((d.username || '?').charAt(0).toUpperCase());
    var time = formatTime(d.created_at);
    var typeName = escapeHtml(typeNames[d.type] || d.type || '其他');
    var statusName = escapeHtml(statusNames[d.status] || d.status || 'new');
    var ratingStars = starsHtml(d.rating || 0);
    var projectHtml = d.project ? '<div style="margin-top:8px;color:var(--text-tertiary);font-size:13px">📁 ' + escapeHtml(d.project) + '</div>' : '';
    var replies = d.replies || [];

    var repliesHtml = '';
    if (replies.length > 0) {
      repliesHtml = '<div class="replies-section">' +
        '<div class="replies-title">💬 管理员回复 (' + replies.length + ')</div>';
      for (var ri = 0; ri < replies.length; ri++) {
        var reply = replies[ri];
        var rAvatar = escapeHtml((reply.username || '?').charAt(0).toUpperCase());
        var rTime = formatTime(reply.created_at);
        var isAdmin = reply.is_admin === 1;
        repliesHtml += '<div class="reply-item' + (isAdmin ? ' admin-reply' : '') + '">' +
          '<div class="reply-head">' +
            '<div class="reply-user">' +
              '<span class="avatar" style="width:24px;height:24px;font-size:10px">' + rAvatar + '</span>' +
              escapeHtml(reply.username || '匿名') +
              (isAdmin ? '<span class="badge-admin">管理员</span>' : '') +
            '</div>' +
            '<span class="reply-time">' + rTime + '</span>' +
          '</div>' +
          '<div class="reply-content">' + escapeHtml(reply.content) + '</div>' +
        '</div>';
      }
      repliesHtml += '</div>';
    }

    var adminActionsHtml = '';
    if (state.isAdmin) {
      adminActionsHtml = '<div class="detail-actions">' +
        '<select class="status-select" id="statusSelect">' +
          '<option value="new"' + (d.status === 'new' ? ' selected' : '') + '>🆕 新提交</option>' +
          '<option value="processing"' + (d.status === 'processing' ? ' selected' : '') + '>⏳ 处理中</option>' +
          '<option value="resolved"' + (d.status === 'resolved' ? ' selected' : '') + '>✅ 已解决</option>' +
          '<option value="closed"' + (d.status === 'closed' ? ' selected' : '') + '>📕 已关闭</option>' +
        '</select>' +
        '<button class="btn btn-danger" id="deleteTicketBtn">🗑 删除工单</button>' +
      '</div>';
    }

    var replyFormHtml = '';
    if (state.isAdmin) {
      replyFormHtml = '<div class="reply-form">' +
        '<div class="form-label">管理员回复</div>' +
        '<div class="quick-replies">' +
          '<span class="quick-reply" data-text="您好，问题已解决，感谢您的反馈！">✅ 问题解决</span>' +
          '<span class="quick-reply" data-text="您好，我们正在处理您的反馈，请耐心等待。">⏳ 正在处理</span>' +
          '<span class="quick-reply" data-text="感谢您的宝贵反馈！我们会尽快核实并处理。">🙏 感谢反馈</span>' +
          '<span class="quick-reply" data-text="您好，已收到您的反馈，我们将在下个版本中修复。">🔧 下个版本修复</span>' +
          '<span class="quick-reply" data-text="您好，此问题已记录并安排开发人员跟进。">📝 已记录跟进</span>' +
          '<span class="quick-reply" data-text="您好，请提供更多详细信息以便我们更好地排查问题。">❓ 需要更多信息</span>' +
          '<span class="quick-reply" data-text="您好，建议您尝试更新到最新版本后再试。">📦 请更新版本</span>' +
          '<span class="quick-reply" data-text="您好，此为预期行为，我们已在文档中说明。">📖 预期行为</span>' +
          '<span class="quick-reply" data-text="您好，我们已将此问题转交给相关团队处理。">👥 已转交团队</span>' +
          '<span class="quick-reply" data-text="您好，感谢您的建议！我们已将其纳入后续规划。">💡 建议已采纳</span>' +
        '</div>' +
        '<textarea class="form-textarea" id="replyContent" placeholder="输入回复内容..."></textarea>' +
        '<button class="submit-btn" id="sendReplyBtn">发送回复</button>' +
      '</div>';
    } else if (replies.length === 0) {
      replyFormHtml = '<div class="reply-form" style="text-align:center;color:var(--text-tertiary);font-size:13px">暂无回复，管理员收到反馈后会尽快回复您</div>';
    }

    card.innerHTML =
      '<div class="detail-head">' +
        '<div class="detail-head-left">' +
          '<span class="ticket-type ' + (typeClasses[d.type] || 'type-other') + '">' + typeName + '</span>' +
          '<span class="status-badge ' + (statusClasses[d.status] || 'status-new') + '">' + statusName + '</span>' +
          '<span style="font-size:12px;color:var(--text-tertiary)">#' + d.id + '</span>' +
        '</div>' +
        adminActionsHtml +
      '</div>' +
      '<div class="detail-body">' +
        '<div class="original-post">' +
          '<div class="original-post-head">' +
            '<div class="original-post-user">' +
              '<span class="avatar">' + avatar + '</span>' +
              escapeHtml(d.username || '匿名') +
            '</div>' +
            '<span class="reply-time">' + time + '</span>' +
          '</div>' +
          '<div class="original-post-content">' + escapeHtml(d.content) + '</div>' +
          projectHtml +
          '<div class="rating-stars">' + ratingStars + '</div>' +
        '</div>' +
        repliesHtml +
        replyFormHtml +
      '</div>';

    // Bind admin event handlers
    if (state.isAdmin) {
      var statusSelect = $('statusSelect');
      if (statusSelect) {
        statusSelect.addEventListener('change', function() {
          fetch('/api/feedback/status', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: d.id, status: this.value })
          }).then(function(r) {
            if (r.ok) {
              showMessage('success', '状态已更新');
            } else {
              return r.json().then(function(err) { showMessage('error', err.error || '更新失败'); });
            }
          }).catch(function() { showMessage('error', '网络错误'); });
        });
      }

      // Quick reply buttons
      var quickReplies = card.querySelectorAll('.quick-reply');
      for (var qi = 0; qi < quickReplies.length; qi++) {
        quickReplies[qi].addEventListener('click', function() {
          var text = this.getAttribute('data-text');
          var replyArea = $('replyContent');
          if (replyArea) {
            replyArea.value = text;
            replyArea.focus();
          }
        });
      }

      var replyBtn = $('sendReplyBtn');
      if (replyBtn) {
        replyBtn.addEventListener('click', function() {
          var content = $('replyContent').value.trim();
          if (!content) { showMessage('error', '请输入回复内容'); return; }
          var self = this;
          self.disabled = true;
          self.textContent = '发送中...';
          fetch('/api/feedback/reply', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ feedback_id: d.id, content: content })
          }).then(function(r) {
            if (r.ok) {
              showMessage('success', '回复成功');
              loadTicketDetail(d.id);
            } else {
              return r.json().then(function(err) { showMessage('error', err.error || '回复失败'); });
            }
          }).catch(function() { showMessage('error', '网络错误'); })
            .finally(function() {
              self.disabled = false;
              self.textContent = '发送回复';
            });
        });
      }

      var delBtn = $('deleteTicketBtn');
      if (delBtn) {
        delBtn.addEventListener('click', function() {
          if (!confirm('确定要删除此工单吗？所有回复也会一同删除。')) return;
          fetch('/api/feedback/delete', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: d.id })
          }).then(function(r) {
            if (r.ok) {
              showMessage('success', '工单已删除');
              setTimeout(function() { showTicketsView(); }, 500);
            } else {
              return r.json().then(function(err) { showMessage('error', err.error || '删除失败'); });
            }
          }).catch(function() { showMessage('error', '网络错误'); });
        });
      }
    }

  } catch(err) {
    card.innerHTML = '<div class="empty-state"><p>加载失败：' + escapeHtml(err.message) + '</p></div>';
  }
}

// ========== Init ==========
(async function init() {
  try {
    var authed = await checkAuth();
    if (!authed) return;

    var params = new URLSearchParams(window.location.search);
    var view = params.get('view');
    if (view === 'tickets' || view === 'inbox') {
      await showTicketsView();
    } else if (view === 'detail' && params.get('id')) {
      await showDetailView(parseInt(params.get('id')));
    } else {
      showSubmitView();
    }
  } catch(err) {
    console.error('Init error:', err);
    showMessage('error', '页面加载失败，请刷新重试');
  }
})();

}); // end DOMContentLoaded
</script>

</body>
</html>

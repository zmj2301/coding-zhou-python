<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>意见反馈 - Code Explorer</title>
<style>
/* ========== CSS Reset & Variables ========== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

:root {
  --bg-primary: #0d1117;
  --bg-secondary: #161b22;
  --bg-tertiary: #21262d;
  --bg-overlay: #30363d;
  --border-color: #30363d;
  --border-light: #21262d;
  --text-primary: #c9d1d9;
  --text-secondary: #8b949e;
  --text-tertiary: #6e7681;
  --accent-blue: #58a6ff;
  --accent-green: #3fb950;
  --accent-yellow: #d29922;
  --accent-red: #f85149;
  --accent-purple: #a371f7;
  --accent-orange: #f0883e;
  --accent-pink: #db61a2;
  --accent-cyan: #39d353;
  --font-mono: 'JetBrains Mono','Cascadia Code','Fira Code','Consolas','Monaco',monospace;
  --font-sans: -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  --transition: 150ms ease;
  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 12px;
}

[data-theme="light"] {
  --bg-primary: #ffffff;
  --bg-secondary: #f6f8fa;
  --bg-tertiary: #eaeef2;
  --bg-overlay: #d0d7de;
  --border-color: #d0d7de;
  --border-light: #eaeef2;
  --text-primary: #24292f;
  --text-secondary: #57606a;
  --text-tertiary: #8c959f;
  --accent-blue: #0969da;
  --accent-green: #1a7f37;
  --accent-yellow: #bf8700;
  --accent-red: #cf222e;
  --accent-purple: #8250df;
  --accent-orange: #bf5612;
  --accent-pink: #bf3c5b;
  --accent-cyan: #1a7f37;
}

body {
  font-family: var(--font-sans);
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: -1;
  background-image:
    linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
  background-size: 24px 24px;
}

[data-theme="light"] body::before {
  background-image:
    linear-gradient(rgba(0,0,0,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,0,0,0.03) 1px, transparent 1px);
}

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--bg-overlay); border-radius: 5px; }
::-webkit-scrollbar-thumb:hover { background: var(--border-color); }
[data-theme="light"] ::-webkit-scrollbar-thumb { background: var(--border-color); }

/* ========== Top Bar ========== */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 24px;
  border-bottom: 1px solid var(--border-color);
  background: var(--bg-secondary);
  position: sticky;
  top: 0;
  z-index: 100;
}

.topbar-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 14px;
  background: var(--bg-tertiary);
  color: var(--text-primary);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  font-size: 13px;
  cursor: pointer;
  transition: var(--transition);
  text-decoration: none;
}

.back-btn:hover { background: var(--bg-overlay); }

.topbar-title {
  font-size: 16px;
  font-weight: 600;
  color: var(--text-primary);
}

.topbar-right {
  display: flex;
  align-items: center;
  gap: 10px;
}

.user-chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px;
  background: var(--bg-tertiary);
  border-radius: 999px;
  font-size: 12px;
  color: var(--text-secondary);
}

.user-chip b { color: var(--text-primary); }

.theme-toggle-btn {
  width: 34px;
  height: 34px;
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  background: var(--bg-tertiary);
  color: var(--text-primary);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: var(--transition);
}

.theme-toggle-btn:hover { background: var(--bg-overlay); }
.theme-toggle-btn svg { width: 17px; height: 17px; }
[data-theme="light"] .theme-toggle-btn .sun-icon { display: none; }
[data-theme="light"] .theme-toggle-btn .moon-icon { display: block; }
.theme-toggle-btn .moon-icon { display: none; }

/* ========== Layout ========== */
.container {
  max-width: 860px;
  margin: 0 auto;
  padding: 32px 24px 60px;
}

.page-head {
  margin-bottom: 24px;
}

.page-head h1 {
  font-size: 24px;
  font-weight: 700;
  margin-bottom: 6px;
}

.page-head p {
  color: var(--text-secondary);
  font-size: 14px;
  line-height: 1.6;
}

/* ========== Tabs ========== */
.tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 24px;
  border-bottom: 1px solid var(--border-color);
  padding-bottom: 0;
}

.tab {
  padding: 10px 18px;
  font-size: 14px;
  color: var(--text-secondary);
  cursor: pointer;
  border: none;
  background: none;
  border-bottom: 2px solid transparent;
  transition: var(--transition);
  font-family: var(--font-sans);
}

.tab:hover { color: var(--text-primary); }
.tab.active {
  color: var(--accent-blue);
  border-bottom-color: var(--accent-blue);
  font-weight: 500;
}

/* ========== Form ========== */
.card {
  background: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  padding: 24px;
}

.form-group { margin-bottom: 20px; }

.form-label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
  margin-bottom: 8px;
}

.form-label .required { color: var(--accent-red); }

.form-select,
.form-textarea,
.form-input {
  width: 100%;
  padding: 10px 12px;
  background: var(--bg-primary);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  color: var(--text-primary);
  font-size: 14px;
  font-family: var(--font-sans);
  transition: var(--transition);
}

.form-select:focus,
.form-textarea:focus,
.form-input:focus {
  outline: none;
  border-color: var(--accent-blue);
  box-shadow: 0 0 0 3px rgba(88,166,255,0.12);
}

.form-textarea {
  min-height: 120px;
  resize: vertical;
  line-height: 1.6;
}

.form-hint {
  font-size: 12px;
  color: var(--text-tertiary);
  margin-top: 6px;
}

/* Star rating */
.star-rating {
  display: inline-flex;
  gap: 6px;
  font-size: 28px;
  cursor: pointer;
  user-select: none;
}

.star-rating .star {
  color: var(--border-color);
  transition: var(--transition);
  line-height: 1;
}

.star-rating .star.active { color: var(--accent-yellow); text-shadow: 0 0 12px rgba(210,153,34,0.4); }

.rating-label { margin-left: 10px; font-size: 13px; color: var(--text-secondary); }

/* Submit button */
.submit-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 11px 24px;
  background: var(--accent-blue);
  color: #fff;
  border: none;
  border-radius: var(--radius-md);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: var(--transition);
}

.submit-btn:hover { filter: brightness(1.1); }
.submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }

/* ========== Inbox ========== */
.feedback-item {
  background: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  padding: 18px 20px;
  margin-bottom: 14px;
}

.feedback-item-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 10px;
}

.feedback-item-user {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

.feedback-avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 13px;
  font-weight: 600;
  flex-shrink: 0;
}

.feedback-item-username { font-size: 13px; font-weight: 500; color: var(--text-primary); }

.feedback-item-time { font-size: 12px; color: var(--text-tertiary); }

.feedback-item-stars {
  color: var(--accent-yellow);
  font-size: 14px;
  letter-spacing: 1px;
  flex-shrink: 0;
}

.feedback-item-type {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 11px;
  margin-bottom: 8px;
}

.type-bug { background: rgba(248,81,73,0.12); color: var(--accent-red); }
.type-feature { background: rgba(88,166,255,0.12); color: var(--accent-blue); }
.type-suggestion { background: rgba(163,113,247,0.12); color: var(--accent-purple); }
.type-praise { background: rgba(63,185,80,0.12); color: var(--accent-green); }
.type-other { background: rgba(139,148,158,0.12); color: var(--text-secondary); }

.feedback-item-body {
  font-size: 14px;
  line-height: 1.7;
  color: var(--text-primary);
  white-space: pre-wrap;
  word-break: break-word;
}

.feedback-item-project {
  margin-top: 10px;
  font-size: 12px;
  color: var(--text-tertiary);
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

/* Status */
.feedback-status {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 4px;
}

.status-new { background: rgba(210,153,34,0.12); color: var(--accent-yellow); }
.status-read { background: rgba(139,148,158,0.12); color: var(--text-secondary); }

/* ========== Message ========== */
.message {
  padding: 14px 18px;
  border-radius: var(--radius-md);
  margin-bottom: 20px;
  font-size: 14px;
  display: none;
}

.message.show { display: block; }

.message.success { background: rgba(63,185,80,0.12); color: var(--accent-green); border: 1px solid rgba(63,185,80,0.3); }
.message.error { background: rgba(248,81,73,0.12); color: var(--accent-red); border: 1px solid rgba(248,81,73,0.3); }

/* ========== Empty & Loading ========== */
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-tertiary);
}

.empty-state svg { width: 48px; height: 48px; margin-bottom: 14px; opacity: 0.5; }
.empty-state p { font-size: 14px; }

.loading-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-tertiary);
  font-size: 14px;
}

.spinner {
  display: inline-block;
  width: 24px;
  height: 24px;
  border: 3px solid var(--bg-overlay);
  border-top-color: var(--accent-blue);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-bottom: 10px;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* Delete button */
.delete-btn {
  padding: 4px 10px;
  background: transparent;
  border: 1px solid var(--border-color);
  color: var(--text-secondary);
  border-radius: 4px;
  font-size: 11px;
  cursor: pointer;
  transition: var(--transition);
}

.delete-btn:hover { border-color: var(--accent-red); color: var(--accent-red); }

/* Responsive */
@media (max-width: 600px) {
  .container { padding: 20px 16px 40px; }
  .topbar { padding: 12px 16px; }
  .feedback-item-head { flex-wrap: wrap; }
  .star-rating { font-size: 26px; }
}
</style>
</head>
<body>

<!-- ========== Top Bar ========== -->
<div class="topbar">
  <div class="topbar-left">
    <a class="back-btn" href="/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      返回首页
    </a>
    <span class="topbar-title">意见反馈</span>
  </div>
  <div class="topbar-right">
    <span class="user-chip" id="userChip" style="display:none">👤 <span><b id="chipName"></b></span></span>
    <button class="theme-toggle-btn" id="themeToggleBtn" title="切换主题 (Ctrl+T)">
      <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </div>
</div>

<div class="container">
  <div id="message" class="message"></div>

  <!-- ========== Submit View ========== -->
  <div id="submitView">
    <div class="page-head">
      <h1>提交意见</h1>
      <p>欢迎提出您的宝贵意见，帮助我们做得更好。您的反馈对我们非常重要！</p>
    </div>

    <div class="tabs">
      <button class="tab active" id="tabSubmit">✍️ 提交意见</button>
      <button class="tab" id="tabInbox" style="display:none">📥 意见箱</button>
    </div>

    <div class="card">
      <form id="feedbackForm" onsubmit="return submitFeedback(event)">
        <div class="form-group">
          <label class="form-label">意见类型 <span class="required">*</span></label>
          <select class="form-select" id="feedbackType">
            <option value="bug">🐞 Bug 反馈</option>
            <option value="feature">✨ 功能建议</option>
            <option value="suggestion">💡 改进建议</option>
            <option value="praise">🌟 表扬</option>
            <option value="other">📌 其他</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">内容 <span class="required">*</span></label>
          <textarea class="form-textarea" id="feedbackContent" placeholder="请详细描述您的意见或建议..." maxlength="2000"></textarea>
          <div class="form-hint"><span id="contentCount">0</span>/2000 字</div>
        </div>

        <div class="form-group">
          <label class="form-label">评分 <span class="required">*</span></label>
          <div>
            <div class="star-rating" id="starRating">
              <span class="star" data-value="1">★</span>
              <span class="star" data-value="2">★</span>
              <span class="star" data-value="3">★</span>
              <span class="star" data-value="4">★</span>
              <span class="star" data-value="5">★</span>
            </div>
            <span class="rating-label" id="ratingLabel">请选择评分</span>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">相关项目 <span style="color:var(--text-tertiary);font-weight:400">（可选）</span></label>
          <input class="form-input" id="feedbackProject" placeholder="填写相关项目名称，例如：植物大战僵尸">
          <div class="form-hint">如果意见与某个具体项目相关，请填写项目名称</div>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
          提交意见
        </button>
      </form>
    </div>
  </div>

  <!-- ========== Inbox View ========== -->
  <div id="inboxView" style="display:none">
    <div class="page-head">
      <h1>意见箱</h1>
      <p>所有用户提交的意见反馈，按时间倒序排列。</p>
    </div>

    <div class="tabs">
      <button class="tab" id="tabSubmit2">✍️ 提交意见</button>
      <button class="tab active" id="tabInbox2">📥 意见箱</button>
    </div>

    <div id="inboxContent">
      <div class="loading-state">
        <div class="spinner"></div>
        <div>加载中...</div>
      </div>
    </div>
  </div>
</div>

<script>
// ========== Theme ==========
const THEME_KEY = 'code_explorer_theme';
function getTheme() { return localStorage.getItem(THEME_KEY) || 'dark'; }
function setTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem(THEME_KEY, theme);
}
function toggleTheme() { setTheme(getTheme() === 'dark' ? 'light' : 'dark'); }
document.getElementById('themeToggleBtn').addEventListener('click', toggleTheme);
setTheme(getTheme());
document.addEventListener('keydown', function(e) { if ((e.ctrlKey || e.metaKey) && e.key === 't') { e.preventDefault(); toggleTheme(); } });

// ========== State ==========
const state = { currentUser: null, rating: 0, isAdmin: false };

// ========== Auth ==========
async function checkAuth() {
  try {
    const r = await fetch('/api/auth-check');
    const d = await r.json();
    if (d.authenticated && d.user) {
      state.currentUser = d.user;
      state.isAdmin = d.user.role === 'admin';
      document.getElementById('userChip').style.display = 'inline-flex';
      document.getElementById('chipName').textContent = d.user.username;
      document.getElementById('tabInbox').style.display = state.isAdmin ? 'inline-block' : 'none';
      return true;
    }
  } catch(e) {}
  window.location.href = '/';
  return false;
}

// ========== View switching ==========
function showSubmitView() {
  document.getElementById('submitView').style.display = 'block';
  document.getElementById('inboxView').style.display = 'none';
  document.getElementById('tabSubmit').classList.add('active');
  document.getElementById('tabSubmit2').classList.add('active');
  document.getElementById('tabInbox').classList.remove('active');
  document.getElementById('tabInbox2').classList.remove('active');
}

async function showInboxView() {
  if (!state.isAdmin) return;
  document.getElementById('submitView').style.display = 'none';
  document.getElementById('inboxView').style.display = 'block';
  document.getElementById('tabSubmit').classList.remove('active');
  document.getElementById('tabSubmit2').classList.remove('active');
  document.getElementById('tabInbox').classList.add('active');
  document.getElementById('tabInbox2').classList.add('active');
  await loadFeedback();
}

document.getElementById('tabSubmit').addEventListener('click', showSubmitView);
document.getElementById('tabSubmit2').addEventListener('click', showSubmitView);
document.getElementById('tabInbox').addEventListener('click', function() { if (state.isAdmin) showInboxView(); });
document.getElementById('tabInbox2').addEventListener('click', function() { if (state.isAdmin) showInboxView(); });

// ========== Star Rating ==========
const starRating = document.getElementById('starRating');
const ratingLabel = document.getElementById('ratingLabel');
const ratingTexts = ['', '非常不满意', '不满意', '一般', '满意', '非常满意'];

starRating.querySelectorAll('.star').forEach(star => {
  star.addEventListener('click', function() {
    state.rating = parseInt(this.dataset.value, 10);
    updateStars();
  });
  star.addEventListener('mouseenter', function() {
    const val = parseInt(this.dataset.value, 10);
    starRating.querySelectorAll('.star').forEach(s => {
      s.classList.toggle('active', parseInt(s.dataset.value, 10) <= val);
    });
  });
});
starRating.addEventListener('mouseleave', updateStars);

function updateStars() {
  starRating.querySelectorAll('.star').forEach(s => {
    s.classList.toggle('active', parseInt(s.dataset.value, 10) <= state.rating);
  });
  ratingLabel.textContent = state.rating ? ratingTexts[state.rating] : '请选择评分';
}

// ========== Content counter ==========
document.getElementById('feedbackContent').addEventListener('input', function() {
  document.getElementById('contentCount').textContent = this.value.length;
});

// ========== Submit ==========
function showMessage(type, text) {
  const el = document.getElementById('message');
  el.className = 'message ' + type + ' show';
  el.textContent = text;
}

async function submitFeedback(e) {
  e.preventDefault();
  const type = document.getElementById('feedbackType').value;
  const content = document.getElementById('feedbackContent').value.trim();
  const project = document.getElementById('feedbackProject').value.trim();
  const rating = state.rating;

  if (!content) { showMessage('error', '请输入反馈内容'); return; }
  if (content.length < 5) { showMessage('error', '反馈内容至少 5 个字'); return; }
  if (!rating) { showMessage('error', '请选择评分'); return; }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.innerHTML = '提交中...';

  try {
    const r = await fetch('/api/feedback', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ type, content, rating, project })
    });
    const d = await r.json();
    if (r.ok) {
      showMessage('success', '感谢您的反馈！意见已提交。');
      document.getElementById('feedbackContent').value = '';
      document.getElementById('feedbackProject').value = '';
      state.rating = 0;
      updateStars();
      document.getElementById('contentCount').textContent = '0';
    } else {
      showMessage('error', d.error || '提交失败，请重试');
    }
  } catch(err) {
    showMessage('error', '网络错误，请重试');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg> 提交意见';
  }
  return false;
}

// ========== Inbox ==========
function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

const typeNames = { bug: 'Bug 反馈', feature: '功能建议', suggestion: '改进建议', praise: '表扬', other: '其他' };
const typeClasses = { bug: 'type-bug', feature: 'type-feature', suggestion: 'type-suggestion', praise: 'type-praise', other: 'type-other' };

function formatTime(ts) {
  if (!ts) return '';
  const d = new Date(ts * 1000);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0') + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}

function starsHtml(n) {
  let s = '';
  for (let i = 0; i < 5; i++) s += i < n ? '★' : '☆';
  return s;
}

async function loadFeedback() {
  const content = document.getElementById('inboxContent');
  content.innerHTML = '<div class="loading-state"><div class="spinner"></div><div>加载中...</div></div>';
  try {
    const r = await fetch('/api/feedback/list');
    const d = await r.json();
    if (!r.ok) {
      content.innerHTML = '<div class="empty-state"><p>' + escapeHtml(d.error || '加载失败') + '</p></div>';
      return;
    }
    const items = d.feedback || [];
    if (items.length === 0) {
      content.innerHTML = '<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg><p>暂无意见反馈</p></div>';
      return;
    }
    content.innerHTML = items.map(f => {
      const avatar = escapeHtml((f.username || '?').charAt(0).toUpperCase());
      const projectHtml = f.project
        ? '<div class="feedback-item-project">📁 ' + escapeHtml(f.project) + '</div>'
        : '';
      return '<div class="feedback-item" data-id="' + f.id + '">' +
        '<div class="feedback-item-head">' +
          '<div class="feedback-item-user">' +
            '<div class="feedback-avatar">' + avatar + '</div>' +
            '<div>' +
              '<div class="feedback-item-username">' + escapeHtml(f.username || '匿名') + '</div>' +
              '<div class="feedback-item-time">' + formatTime(f.created_at) + '</div>' +
            '</div>' +
          '</div>' +
          '<div style="display:flex;align-items:center;gap:10px">' +
            '<span class="feedback-item-stars">' + starsHtml(f.rating || 0) + '</span>' +
            '<button class="delete-btn" onclick="deleteFeedback(' + f.id + ')">删除</button>' +
          '</div>' +
        '</div>' +
        '<span class="feedback-item-type ' + (typeClasses[f.type] || 'type-other') + '">' + escapeHtml(typeNames[f.type] || f.type || '其他') + '</span>' +
        '<div class="feedback-item-body">' + escapeHtml(f.content) + '</div>' +
        projectHtml +
      '</div>';
    }).join('');
  } catch(err) {
    content.innerHTML = '<div class="empty-state"><p>加载失败：' + escapeHtml(err.message) + '</p></div>';
  }
}

async function deleteFeedback(id) {
  if (!confirm('确定要删除这条反馈吗？')) return;
  try {
    const r = await fetch('/api/feedback/delete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id })
    });
    const d = await r.json();
    if (r.ok) {
      document.querySelector('.feedback-item[data-id="' + id + '"]')?.remove();
      const remaining = document.querySelectorAll('.feedback-item').length;
      if (remaining === 0) {
        document.getElementById('inboxContent').innerHTML = '<div class="empty-state"><p>暂无意见反馈</p></div>';
      }
    } else {
      alert(d.error || '删除失败');
    }
  } catch(e) {
    alert('网络错误');
  }
}

// ========== Init ==========
(async function init() {
  const authed = await checkAuth();
  if (!authed) return;

  const params = new URLSearchParams(window.location.search);
  if (params.get('view') === 'inbox' && state.isAdmin) {
    await showInboxView();
  } else {
    showSubmitView();
  }
})();
</script>

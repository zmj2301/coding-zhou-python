<style>
/* ========== CSS Variables (复用主站主题) ========== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root {
  --bg-primary: #0d1117;
  --bg-secondary: #161b22;
  --bg-tertiary: #21262d;
  --bg-overlay: #30363d;
  --border-color: #30363d;
  --border-light: #21262d;
  --text-primary: #c9d1d9;
  --text-secondary: #8b949e;
  --text-tertiary: #6e7681;
  --accent-blue: #58a6ff;
  --accent-green: #3fb950;
  --accent-yellow: #d29922;
  --accent-red: #f85149;
  --accent-purple: #a371f7;
  --accent-orange: #f0883e;
  --accent-cyan: #39d353;
  --accent-pink: #db61a2;
  --term-bg: #1e1e2e;
  --term-header-bg: #181825;
  --term-text: #cdd6f4;
  --term-stdout: #cdd6f4;
  --term-stderr: #f38ba8;
  --term-info: #89b4fa;
  --term-success: #a6e3a1;
  --term-error: #f38ba8;
  --term-border: #313244;
  --font-mono: 'JetBrains Mono','Cascadia Code','Fira Code','Consolas','Monaco',monospace;
  --font-sans: -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  --font-display: 'Outfit','DM Sans',sans-serif;
  --transition: 150ms ease;
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --glass-bg: rgba(255,255,255,0.04);
  --glass-border: rgba(255,255,255,0.08);
}
[data-theme="light"] {
  --bg-primary: #faf9f6;
  --bg-secondary: #ffffff;
  --bg-tertiary: #f0ede8;
  --bg-overlay: #e6e2db;
  --border-color: #e2ddd5;
  --border-light: #f0ede8;
  --text-primary: #1a1a2e;
  --text-secondary: #4a4a68;
  --text-tertiary: #8a8a9a;
  --accent-blue: #0284c7;
  --accent-green: #059669;
  --accent-yellow: #d97706;
  --accent-red: #e11d48;
  --accent-purple: #7c3aed;
  --accent-orange: #ea580c;
  --accent-pink: #db2777;
  --accent-cyan: #0891b2;
  --term-bg: #eff1f5;
  --term-header-bg: #e6e9ef;
  --term-text: #4c4f69;
  --term-stdout: #4c4f69;
  --term-stderr: #d20f39;
  --term-info: #1e66f5;
  --term-success: #40a02b;
  --term-error: #d20f39;
  --term-border: #bcc0cc;
  --glass-bg: rgba(255,255,255,0.7);
  --glass-border: rgba(0,0,0,0.08);
}
[data-theme="light"] body::before {
  background: radial-gradient(ellipse at 20% 0%, rgba(2,132,199,0.04) 0%, transparent 50%), radial-gradient(ellipse at 80% 100%, rgba(124,58,237,0.03) 0%, transparent 50%);
}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-color);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#484f58}

body {
  font-family: var(--font-sans);
  background: var(--bg-primary);
  color: var(--text-primary);
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  position: relative;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: radial-gradient(ellipse at 20% 0%, rgba(88,166,255,0.04) 0%, transparent 50%), radial-gradient(ellipse at 80% 100%, rgba(163,113,247,0.04) 0%, transparent 50%);
  pointer-events: none;
  z-index: 0;
}

/* ========== 顶部导航栏 ========== */
.top-nav {
  position: sticky; top: 0; z-index: 9998;
  height: 56px; background: color-mix(in srgb, var(--bg-secondary) 85%, transparent);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border-color);
  display: flex; align-items: center;
  padding: 0 24px; gap: 8px;
  flex-shrink: 0;
  box-shadow: 0 1px 0 rgba(0,0,0,0.2);
}
.top-nav-brand {
  display: flex; align-items: center; gap: 10px;
  font-size: 15px; font-weight: 700; color: var(--text-primary);
  margin-right: 24px; white-space: nowrap;
  font-family: var(--font-display);
}
.top-nav-brand-logo {
  width: 28px; height: 28px; border-radius: 7px;
  background: linear-gradient(135deg, #306998, #FFD43B);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 12px; font-weight: 700;
  box-shadow: 0 2px 8px rgba(48,105,152,0.35);
}
.top-nav-links {
  display: flex; align-items: center; gap: 2px; flex: 1;
}
.top-nav-link {
  padding: 8px 14px; border-radius: 8px;
  font-size: 13px; font-weight: 500;
  color: var(--text-secondary); text-decoration: none;
  transition: all 0.15s; cursor: pointer;
  white-space: nowrap;
}
.top-nav-link:hover { color: var(--text-primary); background: var(--bg-tertiary); }
.top-nav-link.active { color: var(--accent-blue); background: rgba(88,166,255,0.1); }
.theme-toggle-btn {
  width: 36px; height: 36px;
  border-radius: 8px;
  background: transparent;
  border: 1px solid var(--border-color);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-secondary);
  transition: all 0.15s;
  flex-shrink: 0;
}
.theme-toggle-btn:hover { background: var(--bg-tertiary); color: var(--text-primary); }
.theme-toggle-btn svg { width: 18px; height: 18px; }
.theme-toggle-btn .sun-icon { display: block; }
.theme-toggle-btn .moon-icon { display: none; }
[data-theme="light"] .theme-toggle-btn .sun-icon { display: none; }
[data-theme="light"] .theme-toggle-btn .moon-icon { display: block; }

/* 返回按钮 */
.back-btn {
  display: none;
  padding: 6px 12px;
  border-radius: 8px;
  background: transparent;
  border: 1px solid var(--border-color);
  color: var(--text-secondary);
  font-size: 12px;
  cursor: pointer;
  gap: 6px;
  align-items: center;
  transition: all .15s;
}
.back-btn:hover { background: var(--bg-tertiary); color: var(--text-primary); border-color: var(--accent-blue); }
.back-btn svg { width: 14px; height: 14px; }
body.view-editor .back-btn { display: inline-flex; }
body.view-editor .top-nav-links .top-nav-link:not(.active) { opacity: 0.4; }

/* ========== 视图容器 ========== */
.view { display: none; flex: 1; overflow: hidden; position: relative; z-index: 1; }
.view.active { display: flex; flex-direction: column; }

/* ========== Grid 首页 ========== */
.grid-view {
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  overflow-x: hidden;
  flex: 1;
  padding: 28px 32px;
  gap: 20px;
}
.grid-hero {
  max-width: 1100px;
  margin: 0 auto;
  width: 100%;
}
.grid-hero h1 {
  font-size: 28px;
  font-weight: 700;
  font-family: var(--font-display);
  background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: -0.5px;
  margin-bottom: 8px;
}
.grid-hero p {
  font-size: 13px;
  color: var(--text-tertiary);
  line-height: 1.7;
}
.grid-search-bar {
  display: flex;
  gap: 12px;
  max-width: 1100px;
  margin: 0 auto;
  width: 100%;
}
.grid-search-bar input {
  flex: 1;
  padding: 10px 16px;
  background: color-mix(in srgb, var(--bg-secondary) 85%, transparent);
  border: 1px solid var(--border-color);
  border-radius: 10px;
  color: var(--text-primary);
  font-size: 13px;
  outline: none;
  transition: all .15s;
  font-family: var(--font-sans);
}
.grid-search-bar input:focus {
  border-color: var(--accent-blue);
  box-shadow: 0 0 0 3px rgba(88,166,255,0.15);
}
.grid-search-bar input::placeholder { color: var(--text-tertiary); }

.grid-filters {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  max-width: 1100px;
  margin: 0 auto;
  width: 100%;
}
.grid-filter {
  padding: 5px 14px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 500;
  color: var(--text-secondary);
  background: var(--bg-tertiary);
  border: 1px solid transparent;
  cursor: pointer;
  transition: all .15s;
}
.grid-filter:hover { color: var(--text-primary); border-color: var(--border-color); }
.grid-filter.active {
  background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
  color: #fff;
  border-color: transparent;
  box-shadow: 0 2px 8px rgba(88,166,255,0.25);
}

.grid-stats {
  font-size: 12px;
  color: var(--text-tertiary);
  text-align: right;
  max-width: 1100px;
  margin: 0 auto;
  width: 100%;
}

.grid-cards {
  max-width: 1100px;
  margin: 0 auto;
  width: 100%;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 14px;
}

.project-card {
  background: color-mix(in srgb, var(--bg-secondary) 80%, transparent);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid var(--border-color);
  border-radius: 12px;
  padding: 16px;
  cursor: pointer;
  transition: all .2s;
  position: relative;
  overflow: hidden;
}
.project-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--accent-blue), var(--accent-purple));
  opacity: 0.85;
}
.project-card:hover {
  transform: translateY(-3px);
  border-color: var(--accent-blue);
  box-shadow: 0 10px 30px rgba(88,166,255,0.15);
}
.project-card-icon {
  width: 44px; height: 44px;
  border-radius: 11px;
  background: linear-gradient(135deg, rgba(48,105,152,0.85), rgba(255,212,59,0.7));
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
  margin-bottom: 12px;
  box-shadow: 0 2px 10px rgba(48,105,152,0.2);
}
.project-card-name {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 4px;
  letter-spacing: -0.1px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.project-card-desc {
  font-size: 12px;
  color: var(--text-tertiary);
  line-height: 1.5;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  min-height: 36px;
}
.project-card-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid rgba(255,255,255,0.05);
}
.project-card-files {
  font-size: 11px;
  color: var(--text-tertiary);
  font-family: var(--font-mono);
}
.project-card-arrow {
  font-size: 11px;
  color: var(--accent-blue);
  font-weight: 600;
}
.project-card:hover .project-card-arrow { transform: translateX(3px); }

.grid-loading, .grid-empty {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-tertiary);
}
.grid-empty-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.5; }

/* ========== 编辑器视图 ========== */
.editor-shell {
  display: flex;
  flex: 1;
  overflow: hidden;
  position: relative;
}

/* 左栏：文件树 */
.file-tree-panel {
  width: 240px;
  flex-shrink: 0;
  background: color-mix(in srgb, var(--bg-secondary) 85%, transparent);
  border-right: 1px solid var(--border-color);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.file-tree-header {
  padding: 10px 14px;
  border-bottom: 1px solid var(--border-color);
  font-size: 12px;
  font-weight: 600;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  flex-shrink: 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.file-tree-header .project-name {
  color: var(--text-primary);
  font-size: 11px;
  text-transform: none;
  letter-spacing: 0;
  max-width: 150px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.file-tree-search {
  padding: 6px 10px;
  border-bottom: 1px solid var(--border-color);
}
.file-tree-search input {
  width: 100%;
  padding: 5px 10px;
  background: var(--bg-tertiary);
  border: none;
  border-radius: 6px;
  color: var(--text-primary);
  font-size: 12px;
  outline: none;
}
.file-tree-search input::placeholder { color: var(--text-tertiary); }
.file-tree-body {
  flex: 1;
  overflow-y: auto;
  padding: 4px 0;
}

/* 文件树节点 */
.ft-node { user-select: none; }
.ft-node-row {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 4px 10px 4px 6px;
  font-size: 12px;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all .1s;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ft-node-row:hover { background: var(--bg-tertiary); color: var(--text-primary); }
.ft-node-row.active { background: rgba(88,166,255,0.12); color: var(--accent-blue); }
.ft-caret {
  width: 14px; height: 14px;
  display: flex; align-items: center; justify-content: center;
  font-size: 9px;
  color: var(--text-tertiary);
  flex-shrink: 0;
  transition: transform .15s;
}
.ft-caret.collapsed { transform: rotate(-90deg); }
.ft-icon {
  width: 14px;
  flex-shrink: 0;
  text-align: center;
  font-size: 11px;
}
.ft-icon.py { color: var(--accent-blue); }
.ft-icon.folder { color: var(--accent-yellow); }
.ft-icon.unknown { color: var(--text-tertiary); }
.ft-label {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.ft-children { overflow: hidden; }

/* 中栏：编辑器 */
.editor-main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
}

/* 工具栏 */
.toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 14px;
  height: 44px;
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border-color);
  flex-shrink: 0;
}
.toolbar-title {
  font-size: 13px; font-weight: 600; color: var(--text-primary);
  white-space: nowrap; flex-shrink: 0;
  max-width: 220px;
  overflow: hidden; text-overflow: ellipsis;
}
.toolbar-divider { width: 1px; height: 20px; background: var(--border-color); flex-shrink: 0; }
.toolbar-hint { font-size: 12px; color: var(--text-tertiary); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.toolbar-action {
  display: flex; align-items: center; gap: 4px;
  padding: 5px 12px;
  background: transparent;
  border: 1px solid var(--border-color);
  color: var(--text-secondary);
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 12px;
  font-family: var(--font-sans);
  transition: all var(--transition);
  white-space: nowrap;
}
.toolbar-action:hover { background: var(--bg-tertiary); color: var(--text-primary); }
.toolbar-action svg { width: 14px; height: 14px; }
.toolbar-action.btn-run { color: var(--accent-green); border-color: rgba(63,185,80,0.4); }
.toolbar-action.btn-run:hover { background: rgba(63,185,80,0.12); }
.toolbar-action.btn-stop { color: var(--accent-red); border-color: rgba(248,81,73,0.4); }
.toolbar-action.btn-stop:hover { background: rgba(248,81,73,0.12); }

/* 编辑器主体 */
.editor-body { flex: 1; display: flex; flex-direction: column; min-height: 0; }
#editorHost { flex: 1; min-height: 0; }

/* 多文件标签栏 */
.file-tabs {
  display: flex; align-items: center; gap: 2px;
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border-color);
  padding: 0 8px;
  overflow-x: auto;
  flex-shrink: 0;
  height: 32px;
  min-height: 32px;
}
.file-tab {
  display: flex; align-items: center; gap: 6px;
  padding: 4px 10px;
  font-size: 11px;
  color: var(--text-secondary);
  border: 1px solid transparent;
  border-bottom: none;
  border-radius: 6px 6px 0 0;
  cursor: pointer;
  white-space: nowrap;
  transition: all var(--transition);
  flex-shrink: 0;
  font-family: var(--font-mono);
}
.file-tab:hover { color: var(--text-primary); background: var(--bg-tertiary); }
.file-tab.active {
  color: var(--text-primary);
  background: var(--bg-primary);
  border-color: var(--border-color);
  border-bottom: 1px solid var(--bg-primary);
}
.file-tab.active::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--accent-green); flex-shrink: 0; }

/* 终端 */
.terminal-panel {
  height: 200px;
  display: flex;
  flex-direction: column;
  background: var(--term-bg);
  border-top: 1px solid var(--term-border);
  overflow: hidden;
  flex-shrink: 0;
}
.terminal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 5px 12px;
  background: var(--term-header-bg);
  border-bottom: 1px solid var(--term-border);
  font-size: 11px;
  font-weight: 500;
  color: var(--text-secondary);
  flex-shrink: 0;
}
.terminal-title { display: flex; align-items: center; gap: 6px; }
.terminal-title svg { width: 12px; height: 12px; }
.run-status {
  font-size: 10px; padding: 2px 6px; border-radius: 3px;
  background: var(--accent-blue); color: #fff; margin-left: 8px;
}
.run-status.running { background: var(--accent-green); animation: pulse-run 1.5s infinite; }
.run-status.error { background: var(--accent-red); }
@keyframes pulse-run { 0%,100%{opacity:1} 50%{opacity:0.6} }
.terminal-close-btn {
  background: transparent; border: none; outline: none;
  color: var(--text-tertiary); cursor: pointer; padding: 4px; border-radius: 4px;
  transition: all var(--transition);
}
.terminal-close-btn:hover { background: rgba(248,81,73,0.15); color: var(--accent-red); }
.terminal-close-btn svg { width: 14px; height: 14px; }
.deps-progress {
  display: flex; align-items: center; gap: 8px;
  background: var(--bg-secondary); padding: 5px 12px; font-size: 11px;
  border-bottom: 1px solid var(--border-color);
}
.deps-progress-bar {
  height: 4px; background: var(--accent-blue); border-radius: 2px;
  width: 100px; min-width: 100px; transition: width 0.3s;
}
.deps-progress-text { color: var(--text-secondary); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.terminal-body {
  flex: 1; padding: 10px 12px;
  font-family: var(--font-mono); font-size: 12px; line-height: 1.5;
  color: var(--term-text); overflow-y: auto; background: var(--term-bg);
}
.terminal-body::-webkit-scrollbar { width: 8px; }
.terminal-output { white-space: pre-wrap; word-break: break-all; }
.terminal-output .stdout { color: var(--term-stdout); }
.terminal-output .stderr { color: var(--term-stderr); }
.terminal-output .error { color: var(--term-error); font-weight: 500; }
.terminal-output .info { color: var(--term-info); }
.terminal-output .success { color: var(--term-success); }

/* README 右栏 */
.readme-panel {
  width: 380px;
  min-width: 300px;
  max-width: 520px;
  flex-shrink: 0;
  background: color-mix(in srgb, var(--bg-secondary) 85%, transparent);
  border-left: 1px solid var(--border-color);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transition: width .2s, min-width .2s, opacity .2s;
}
.readme-panel.collapsed {
  width: 0;
  min-width: 0;
  border-left: none;
  overflow: hidden;
}
.readme-header {
  padding: 10px 14px;
  border-bottom: 1px solid var(--border-color);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
.readme-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.readme-toggle {
  background: transparent;
  border: none;
  color: var(--text-tertiary);
  cursor: pointer;
  padding: 4px;
  border-radius: 4px;
  display: flex;
  align-items: center;
}
.readme-toggle:hover { background: var(--bg-tertiary); color: var(--text-primary); }
.readme-toggle svg { width: 14px; height: 14px; }

</style>
</head>
<body>

<!-- 顶部导航栏 -->

    <!-- 右栏：README -->

        <span class="readme-title">README</span>
        <button class="readme-toggle" id="btnReadmeToggle" title="隐藏">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
      </div>
      <div class="readme-body" id="readmeBody">
        <div class="grid-loading">加载中...</div>
      </div>

<script>
const $ = id => document.getElementById(id);
let monacoEditor = null;
let runAbortController = null;
let currentRunId = null;

// 全局状态
const state = {
  view: 'grid',           // 'grid' | 'editor'
  treeData: null,         // 根目录完整文件树
  pythonProjects: [],     // 筛选出的 Python 项目
  currentProject: null,   // { name, path, treeNode, ... }
  projectFileTree: null,  // 当前项目的文件树
  openTabs: [],           // [{ name, path, content }]
  activeTabIdx: -1,
  isRunning: false,
  searchQuery: '',
  activeFilter: 'all',
  ftExpanded: new Set(),  // 文件树展开的目录
  ftFilter: '',
};

// ==================== 主题切换 ====================
(function(){
  const root = document.documentElement;
  const stored = localStorage.getItem('theme');
  if (stored) root.setAttribute('data-theme', stored);
  else if (window.matchMedia('(prefers-color-scheme: light)').matches) root.setAttribute('data-theme', 'light');

  $('themeToggle').addEventListener('click', () => {
    const current = root.getAttribute('data-theme');
    const next = current === 'light' ? '' : 'light';
    if (next) { root.setAttribute('data-theme', next); localStorage.setItem('theme', next); }
    else { root.removeAttribute('data-theme'); localStorage.removeItem('theme'); }
    if (monacoEditor) {
      monacoEditor.updateOptions({ theme: next ? 'vs' : 'vs-dark' });
    }
  });

  $('btnReadmeToggle').addEventListener('click', () => {
    $('readmePanel').classList.toggle('collapsed');
  });
})();

// ==================== API ====================
async function api(url, opts = {}) {
  const res = await fetch(url, opts);
  return res;
}
async function fetchTree() { return (await api('/api/files/tree')).json(); }
async function fetchProjectTree(path) {
  try {
    const res = await fetch(`/api/projects/tree?path=${encodeURIComponent(path)}&depth=2`);
    if (res.ok) return await res.json();
  } catch {}
  return null;
}
async function fetchContent(path) {
  const res = await fetch(`/api/files/content?path=${encodeURIComponent(path)}&_t=${Date.now()}`);
  if (res.ok) return await res.json();
  return null;
}
async function fetchReadme(path) {
  const res = await fetch(`/api/projects/readme?path=${encodeURIComponent(path)}`);
  if (res.ok) return await res.json();
  return { found: false };
}

// ==================== 项目分类 ====================
const EXCLUDE_DIRS = ['code-explorer','public','images','functions','converter','portfolio',
  'deepseek_v3_tokenizer','workbody','web-games','fathers-day','output','02 侯老师编程网站相关素材',
  'learning-materials','02 侯老师编程网站相关素材'];
const CATEGORY_KEYWORDS = {
  game: ['游戏','对战','大战','塔防','射击','五子棋','消消乐','飞机大战','俄罗斯方块','跑酷','赛车','模拟','mc','Minecraft','我的世界','水果忍者','象棋','海龟汤','坦克'],
  ai: ['AI','ai','智能','机器人','对话','聊天','语音','视觉','图像识别','手写识别','深度学习','神经网络'],
  tool: ['工具','查询','管理','计算','转码','转换','压缩','日历','日历','桌面','宠物','自动','查询','天气','文字转语音','TTS','二维码','加密'],
};

function classifyProject(name) {
  for (const cat of Object.keys(CATEGORY_KEYWORDS)) {
    for (const kw of CATEGORY_KEYWORDS[cat]) {
      if (name.includes(kw)) return cat;
    }
  }
  return 'other';
}

function countFiles(node) {
  let n = 0;
  if (node.type === 'file') return 1;
  if (node.children) for (const c of node.children) n += countFiles(c);
  return n;
}

function getDefaultDesc(name, cat) {
  const descs = {
    game: '一个有趣的 Python 游戏项目',
    ai: '一个使用 AI 技术的 Python 应用',
    tool: '一个实用的 Python 工具',
    other: '一个 Python 编程项目',
  };
  return descs[cat] || descs.other;
}

// ==================== Grid 渲染 ====================
function renderGrid() {
  const cards = $('gridCards');
  let projects = state.pythonProjects;

  // 搜索过滤
  if (state.searchQuery) {
    const q = state.searchQuery.toLowerCase();
    projects = projects.filter(p =>
      p.name.toLowerCase().includes(q) ||
      (p.desc && p.desc.toLowerCase().includes(q)) ||
      (p.category && p.category.toLowerCase().includes(q))
    );
  }
  // 分类过滤
  if (state.activeFilter !== 'all') {
    projects = projects.filter(p => p.category === state.activeFilter);
  }

  $('gridStats').textContent = `共 ${state.pythonProjects.length} 个项目 · 显示 ${projects.length} 个`;

  if (!projects.length) {
    cards.innerHTML = `<div class="grid-empty">
      <div class="grid-empty-icon">🔍</div>
      <div>没有找到匹配的项目</div>
    </div>`;
    return;
  }

  const iconMap = {
    game: '🎮', ai: '🤖', tool: '🛠', other: '📦'
  };

  cards.innerHTML = projects.map(p => {
    const icon = iconMap[p.category] || '📦';
    return `
      <div class="project-card" data-path="${p.path}">
        <div class="project-card-icon">${icon}</div>
        <div class="project-card-name">${escapeHtml(p.name)}</div>
        <div class="project-card-desc">${escapeHtml(p.desc)}</div>
        <div class="project-card-meta">
          <span class="project-card-files">${p.fileCount} 个文件</span>
          <span class="project-card-arrow">进入 →</span>
        </div>
      </div>
    `;
  }).join('');

  cards.querySelectorAll('.project-card').forEach(el => {
    el.addEventListener('click', () => openProject(el.dataset.path));
  });
}

// ==================== 视图切换 ====================
function switchView(view) {
  state.view = view;
  document.body.className = 'view-' + view;
  $('gridView').classList.toggle('active', view === 'grid');
  $('editorView').classList.toggle('active', view === 'editor');
  if (view === 'editor') {
    // 延迟初始化 Monaco，等容器可见
    setTimeout(() => {
      if (!monacoEditor && $('editorHost')) initMonaco();
    }, 50);
  }
}

// ==================== 打开项目 ====================
async function openProject(projectPath) {
  const project = state.pythonProjects.find(p => p.path === projectPath);
  if (!project) return;

  state.currentProject = project;
  state.openTabs = [];
  state.activeTabIdx = -1;
  state.projectFileTree = null;
  state.ftExpanded.clear();

  $('toolbarTitle').textContent = project.name;
  $('ftProjectName').textContent = project.name;
  $('editorEmpty').style.display = 'flex';
  $('editorHost').style.display = 'none';
  $('fileTabs').style.display = 'none';

  // 先切到编辑器视图
  switchView('editor');

  // 并行加载：项目文件树 + README
  $('ftBody').innerHTML = '<div class="grid-loading">加载中...</div>';
  $('readmeBody').innerHTML = '<div class="grid-loading">加载中...</div>';

  const [tree, readme] = await Promise.all([
    fetchProjectTree(projectPath),
    fetchReadme(projectPath),
  ]);

  state.projectFileTree = tree;
  renderFileTree(tree);

  if (readme && readme.found && readme.content) {
    try {
      $('readmeBody').innerHTML = marked.parse(readme.content);
    } catch {
      $('readmeBody').innerHTML = `<pre style="white-space:pre-wrap">${escapeHtml(readme.content)}</pre>`;
    }
  } else {
    $('readmeBody').innerHTML = `
      <div class="readme-empty">
        <div class="readme-empty-icon">📄</div>
        <p>此项目没有 README 文件</p>
      </div>`;
  }
}

// ==================== 文件树渲染 ====================
function renderFileTree(tree) {
  const body = $('ftBody');
  if (!tree || !tree.children || !tree.children.length) {
    body.innerHTML = '<div class="grid-empty"><div class="grid-empty-icon">📁</div><div>项目为空</div></div>';
    return;
  }
  body.innerHTML = buildFileTreeHTML(tree.children, 0);
  bindFileTreeEvents();
}

function buildFileTreeHTML(nodes, depth) {
  let html = '';
  for (const node of nodes) {
    if (state.ftFilter) {
      const search = state.ftFilter.toLowerCase();
      if (!node.name.toLowerCase().includes(search) && !matchesFilter(node, search)) continue;
    }
    const indent = depth * 12;
    if (node.type === 'directory') {
      const isOpen = state.ftExpanded.has(node.path);
      const hasContent = node.children && node.children.length > 0;
      html += `<div class="ft-node" data-path="${escapeAttr(node.path)}" data-type="directory">
        <div class="ft-node-row" style="padding-left:${indent + 6}px" data-path="${escapeAttr(node.path)}">
          <span class="ft-caret ${isOpen ? '' : 'collapsed'}">▼</span>
          <span class="ft-icon folder">📁</span>
          <span class="ft-label">${escapeHtml(node.name)}</span>
        </div>
        ${hasContent ? `<div class="ft-children" style="display:${isOpen ? 'block' : 'none'}">${buildFileTreeHTML(node.children, depth + 1)}</div>` : ''}
      </div>`;
    } else {
      const ext = (node.name.split('.').pop() || '').toLowerCase();
      const icon = getFileIcon(ext);
      const row = `data-path="${escapeAttr(node.path)}"`;
      html += `<div class="ft-node" ${row} data-type="file">
        <div class="ft-node-row" style="padding-left:${indent + 20}px" ${row}>
          <span class="ft-icon ${icon.cls}">${icon.emoji}</span>
          <span class="ft-label">${escapeHtml(node.name)}</span>
        </div>
      </div>`;
    }
  }
  return html;
}

function matchesFilter(node, search) {
  if (node.children) return node.children.some(c => matchesFilter(c, search));
  return node.name.toLowerCase().includes(search);
}

function getFileIcon(ext) {
  if (ext === 'py') return { emoji: '🐍', cls: 'py' };
  if (['js','ts','jsx','tsx'].includes(ext)) return { emoji: '📜', cls: 'py' };
  if (['html','htm'].includes(ext)) return { emoji: '🌐', cls: 'py' };
  if (ext === 'css') return { emoji: '🎨', cls: 'py' };
  if (['json'].includes(ext)) return { emoji: '📋', cls: 'py' };
  if (['md','markdown'].includes(ext)) return { emoji: '📖', cls: 'py' };
  if (['png','jpg','jpeg','gif','svg','webp'].includes(ext)) return { emoji: '🖼', cls: 'unknown' };
  if (['txt'].includes(ext)) return { emoji: '📝', cls: 'unknown' };
  if (['cpp','c','h','hpp'].includes(ext)) return { emoji: '💻', cls: 'py' };
  return { emoji: '📄', cls: 'unknown' };
}

function bindFileTreeEvents() {
  const body = $('ftBody');
  body.querySelectorAll('.ft-node-row').forEach(row => {
    row.addEventListener('click', e => {
      const node = e.currentTarget.closest('.ft-node');
      if (!node) return;
      const path = node.dataset.path;
      const type = node.dataset.type;
      if (type === 'directory') {
        // 展开/折叠
        const caret = row.querySelector('.ft-caret');
        const childrenDiv = node.querySelector(':scope > .ft-children');
        if (state.ftExpanded.has(path)) {
          state.ftExpanded.delete(path);
          caret && caret.classList.add('collapsed');
          if (childrenDiv) childrenDiv.style.display = 'none';
        } else {
          state.ftExpanded.add(path);
          caret && caret.classList.remove('collapsed');
          if (childrenDiv) childrenDiv.style.display = 'block';
        }
      } else {
        openFileInEditor(path);
      }
    });
  });
}

// 文件树搜索
$('ftSearch').addEventListener('input', e => {
  state.ftFilter = e.target.value.trim();
  // 展开所有目录
  if (state.projectFileTree && state.projectFileTree.children) {
    state.projectFileTree.children.forEach(c => expandAllDirs(c));
  }
  renderFileTree(state.projectFileTree);
});

function expandAllDirs(node) {
  if (node.type === 'directory') {
    state.ftExpanded.add(node.path);
    if (node.children) node.children.forEach(expandAllDirs);
  }
}

// ==================== 打开文件到编辑器 ====================
async function openFileInEditor(filePath) {
  // 查找或创建 tab
  let tabIdx = state.openTabs.findIndex(t => t.path === filePath);
  if (tabIdx < 0) {
    const fileName = filePath.split('/').pop();
    $('toolbarHint').textContent = `加载 ${fileName}...`;
    const data = await fetchContent(filePath);
    const content = data && data.content ? data.content : '';
    state.openTabs.push({ name: fileName, path: filePath, content });
    tabIdx = state.openTabs.length - 1;
  }
  state.activeTabIdx = tabIdx;
  renderTabs();
  renderCode();
  $('editorEmpty').style.display = 'none';
  $('editorHost').style.display = 'block';
  $('toolbarHint').textContent = filePath.split('/').pop();

  // 高亮当前文件在文件树中的位置
  document.querySelectorAll('.ft-node-row.active').forEach(r => r.classList.remove('active'));
  const row = document.querySelector(`.ft-node-row[data-path="${CSS.escape(filePath)}"]`);
  if (row) row.classList.add('active');
}

function renderTabs() {
  const tabs = $('fileTabs');
  if (!state.openTabs.length) {
    tabs.style.display = 'none';
    return;
  }
  tabs.style.display = 'flex';
  tabs.innerHTML = state.openTabs.map((tab, i) => {
    const active = i === state.activeTabIdx ? ' active' : '';
    return `<div class="file-tab${active}" data-idx="${i}">${escapeHtml(tab.name)}</div>`;
  }).join('');
  tabs.querySelectorAll('.file-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      saveCurrentTab();
      state.activeTabIdx = parseInt(tab.dataset.idx);
      renderTabs();
      renderCode();
    });
  });
}

function saveCurrentTab() {
  if (state.activeTabIdx >= 0 && state.activeTabIdx < state.openTabs.length && monacoEditor) {
    state.openTabs[state.activeTabIdx].content = monacoEditor.getValue();
  }
}

function renderCode() {
  if (state.activeTabIdx < 0) return;
  const tab = state.openTabs[state.activeTabIdx];
  if (!monacoEditor) return;
  saveCurrentTab();
  monacoEditor.setValue(tab.content || '');
  // 设置语言
  const ext = (tab.name.split('.').pop() || '').toLowerCase();
  const lang = {
    py: 'python', js: 'javascript', ts: 'typescript',
    html: 'html', htm: 'html', css: 'css', json: 'json',
    md: 'markdown', markdown: 'markdown',
    cpp: 'cpp', c: 'c', h: 'cpp', hpp: 'cpp'
  }[ext] || 'plaintext';
  monacoEditor.setModelLanguage(monacoEditor.getModel(), lang);
}

// ==================== Monaco 初始化 ====================
function initMonaco() {
  if (monacoEditor) return;
  const root = document.documentElement;
  const isLight = root.getAttribute('data-theme') === 'light';
  require(['vs/editor/editor.main'], function () {
    monacoEditor = monaco.editor.create($('editorHost'), {
      value: '',
      language: 'python',
      theme: isLight ? 'vs' : 'vs-dark',
      fontSize: 14,
      fontFamily: "'JetBrains Mono','Cascadia Code','Fira Code','Consolas',monospace",
      lineHeight: 22,
      minimap: { enabled: false },
      scrollBeyondLastLine: false,
      automaticLayout: true,
      tabSize: 4,
      insertSpaces: true,
      wordWrap: 'on',
      padding: { top: 10 },
      renderWhitespace: 'none',
      smoothScrolling: true,
    });
    monacoEditor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.Enter, runPythonCode);
  });
}

// ==================== 终端 ====================
function showTerminal() { $('terminalPanel').style.display = 'flex'; }
function hideTerminal() { $('terminalPanel').style.display = 'none'; }
function appendToTerminal(text, className = 'stdout') {
  const output = $('terminalOutput');
  const div = document.createElement('div');
  div.className = className;
  div.textContent = text;
  output.appendChild(div);
  output.scrollTop = output.scrollHeight;
}

function setRunStatus(status, text) {
  const el = $('runStatus');
  const btnRun = $('btnRun');
  const btnStop = $('btnStop');
  if (!status) {
    el.style.display = 'none';
    btnRun.style.display = '';
    btnStop.style.display = 'none';
    $('btnRunLabel').textContent = '运行项目';
    return;
  }
  el.style.display = '';
  el.className = 'run-status ' + status;
  el.textContent = text;
  if (status === 'running' || status === 'preparing' || status === 'installing' ||
      status === 'copying' || status === 'venv' || status === 'analyzing') {
    $('btnRunLabel').textContent = '运行中...';
    btnStop.style.display = '';
  } else {
    $('btnRunLabel').textContent = '运行项目';
    btnStop.style.display = 'none';
  }
}

function showDepsProgress(text, progress) {
  $('depsProgress').style.display = 'flex';
  $('depsProgressText').textContent = text;
  if (typeof progress === 'number' && progress >= 0) {
    $('depsProgressBar').style.width = Math.min(100, Math.max(0, progress)) + '%';
  }
}
function hideDepsProgress() {
  $('depsProgress').style.display = 'none';
  $('depsProgressBar').style.width = '0%';
}

// ==================== 收集项目 .py 文件 ====================
function collectProjectPyFiles(nodes, prefix = '') {
  const files = {};
  if (!nodes) return files;
  for (const node of nodes) {
    const relPath = prefix ? `${prefix}/${node.name}` : node.name;
    if (node.type === 'directory' && node.children) {
      Object.assign(files, collectProjectPyFiles(node.children, relPath));
    } else if (node.type === 'file') {
      const ext = (node.name.split('.').pop() || '').toLowerCase();
      if (ext === 'py') {
        // 检查是否已在 openTabs 中有内容（编辑过）
        const tab = state.openTabs.find(t => t.path === `${state.currentProject.path}/${relPath}`);
        files[relPath] = tab ? tab.content : null; // null 表示需要从服务器获取
      }
    }
  }
  return files;
}

async function loadMissingFileContents(files) {
  const entries = Object.entries(files);
  const results = {};
  await Promise.all(entries.map(async ([relPath, content]) => {
    if (content !== null) {
      results[relPath] = content;
      return;
    }
    const fullPath = `${state.currentProject.path}/${relPath}`;
    const data = await fetchContent(fullPath);
    results[relPath] = data && data.content ? data.content : `# ${relPath}\n`;
  }));
  return results;
}

// ==================== 运行代码 (SSE) ====================
async function runPythonCode() {
  if (state.isRunning) return;
  if (!monacoEditor) return;
  if (!state.currentProject) {
    toast('请先选择一个项目');
    return;
  }

  showTerminal();
  const output = $('terminalOutput');
  output.innerHTML = '';
  hideDepsProgress();
  saveCurrentTab();

  // 收集所有 .py 文件
  const pyFiles = collectProjectPyFiles(state.projectFileTree ? state.projectFileTree.children : []);
  if (!Object.keys(pyFiles).length) {
    // 没有 .py 文件，直接发送当前单文件
    if (state.activeTabIdx >= 0) {
      const tab = state.openTabs[state.activeTabIdx];
      const code = monacoEditor.getValue();
      const body = { mode: 'single', timeout: 120, code, fileName: tab.name };
      await doRun(body, '单文件运行');
    } else {
      toast('项目中没有可运行的 Python 文件');
    }
    return;
  }

  // 批量加载缺失内容
  appendToTerminal('========== 收集项目文件 ==========', 'info');
  const filledFiles = await loadMissingFileContents(pyFiles);
  appendToTerminal(`共 ${Object.keys(filledFiles).length} 个 Python 文件`, 'info');

  // 找入口文件（优先 main.py，或第一个 py 文件）
  let entryFile = null;
  if (filledFiles['main.py']) entryFile = 'main.py';
  else if (filledFiles['__main__.py']) entryFile = '__main__.py';
  else if (state.activeTabIdx >= 0) {
    const tab = state.openTabs[state.activeTabIdx];
    const relPath = tab.path.startsWith(state.currentProject.path + '/')
      ? tab.path.substring(state.currentProject.path.length + 1)
      : tab.path;
    if (filledFiles[relPath]) entryFile = relPath;
  }
  if (!entryFile) entryFile = Object.keys(filledFiles)[0];

  const body = {
    mode: 'multi',
    timeout: 120,
    projectPath: state.currentProject.path,
    entryFile,
    files: filledFiles,
    venvKey: 'project_' + btoa(encodeURIComponent(state.currentProject.path)).slice(0, 32),
  };
  await doRun(body, `项目运行 (入口: ${entryFile})`);
}

async function doRun(body, headerText) {
  appendToTerminal(`========== ${headerText} ==========`, 'info');
  setRunStatus('preparing', '准备中...');
  state.isRunning = true;
  runAbortController = new AbortController();
  currentRunId = null;

  try {
    const res = await fetch('/api/code/start', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
      signal: runAbortController.signal,
    });
    if (!res.ok) {
      let errMsg = `HTTP ${res.status}`;
      let isAuth = false;
      try { const j = await res.json(); errMsg = j.error || errMsg; isAuth = (res.status === 401); } catch {}
      if (isAuth) throw new Error('请先登录');
      throw new Error(errMsg);
    }
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let sseBuffer = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      sseBuffer += decoder.decode(value, { stream: true });
      const parts = sseBuffer.split('\n\n');
      sseBuffer = parts.pop() || '';
      for (const part of parts) {
        const lines = part.split('\n');
        let eventType = 'message';
        let dataStr = '';
        for (const line of lines) {
          if (line.startsWith('event: ')) eventType = line.substring(7).trim();
          else if (line.startsWith('data: ')) dataStr += line.substring(6);
        }
        if (!dataStr) continue;
        try {
          const data = JSON.parse(dataStr);
          switch (eventType) {
            case 'status':
              if (data.runId) currentRunId = data.runId;
              setRunStatus(data.phase, data.message);
              appendToTerminal('[系统] ' + data.message, 'info');
              break;
            case 'deps':
              setRunStatus('installing', '安装依赖...');
              handleDepsEvent(data);
              break;
            case 'stdout':
              appendToTerminal(data.text, 'stdout');
              break;
            case 'stderr':
              appendToTerminal(data.text, 'stderr');
              break;
            case 'exit':
              handleExitEvent(data);
              break;
            case 'error':
              hideDepsProgress();
              appendToTerminal('[错误] ' + data.message, 'error');
              setRunStatus('error', '失败');
              state.isRunning = false;
              break;
          }
        } catch (e) {
          console.error('SSE parse error:', e, dataStr);
        }
      }
    }
  } catch (e) {
    hideDepsProgress();
    if (e.name === 'AbortError') {
      appendToTerminal('[已被用户停止]', 'info');
      setRunStatus(null);
    } else {
      appendToTerminal('错误: ' + (e.message || e), 'error');
      setRunStatus('error', '失败');
    }
    state.isRunning = false;
  }
}

function handleDepsEvent(data) {
  if (data.phase === 'installing' || data.phase === 'requirements_found') {
    showDepsProgress(data.message || '安装依赖中...', 5);
    appendToTerminal('[依赖] ' + data.message, 'info');
  } else if (data.phase === 'installing_package') {
    const idx = data.index || 0;
    const total = data.total || 1;
    const pct = 10 + Math.round((idx / total) * 80);
    showDepsProgress(data.message || '安装中...', pct);
    appendToTerminal('[依赖] ' + data.message, 'info');
  } else if (data.phase === 'installed') {
    showDepsProgress(data.message || '依赖安装完成', 100);
    appendToTerminal('[依赖] ' + data.message, 'info');
    setTimeout(() => hideDepsProgress(), 1500);
  } else if (data.phase === 'pip_output') {
    if (data.line) appendToTerminal('  ' + data.line, 'stdout');
  } else {
    showDepsProgress(data.message || '安装依赖中...');
    appendToTerminal('[依赖] ' + data.message, 'info');
  }
  if (data.error) appendToTerminal('[依赖警告] ' + data.error, 'stderr');
}

function handleExitEvent(data) {
  hideDepsProgress();
  appendToTerminal('', 'stdout');
  if (data.code === 0) {
    appendToTerminal('========== ' + data.message + ' ==========', 'success');
    setRunStatus(null);
  } else if (data.timedOut) {
    appendToTerminal('========== ' + data.message + ' ==========', 'error');
    setRunStatus('error', '超时');
  } else {
    appendToTerminal('========== ' + data.message + ' ==========', 'error');
    setRunStatus('error', '出错');
  }
  state.isRunning = false;
}

async function stopPythonCode() {
  if (!state.isRunning) return;
  if (runAbortController) runAbortController.abort();
  if (currentRunId) {
    try {
      await fetch('/api/code/stop', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ runId: currentRunId }),
      });
    } catch {}
  }
  setRunStatus(null);
  state.isRunning = false;
  hideDepsProgress();
}

async function copyCode() {
  if (!monacoEditor) return;
  try {
    await navigator.clipboard.writeText(monacoEditor.getValue());
    const btn = $('btnCopy');
    btn.textContent = '已复制 ✓';
    setTimeout(() => {
      btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg> 复制';
    }, 1500);
  } catch (e) {
    appendToTerminal('复制失败: ' + e.message, 'error');
  }
}

function toast(msg) {
  const t = document.createElement('div');
  t.style.cssText = 'position:fixed;top:70px;left:50%;transform:translateX(-50%);padding:8px 16px;background:rgba(248,81,73,0.9);color:#fff;border-radius:8px;font-size:13px;z-index:99999;backdrop-filter:blur(8px);box-shadow:0 4px 20px rgba(0,0,0,0.3);';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2200);
}

function escapeHtml(s) { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function escapeAttr(s) { return escapeHtml(String(s)).replace(/"/g, '&quot;'); }

// ==================== 加载 Python 项目列表 ====================
async function loadPythonProjects() {
  try {
    // 使用公开的 /api/projects/tree?path=Python（无需登录）获取 Python 目录下的子节点
    const res = await fetch('/api/projects/tree?path=Python&depth=2');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (!Array.isArray(data)) throw new Error('文件树为空');

    // 筛选目录节点，排除非项目目录
    const excludeSet = new Set(EXCLUDE_DIRS);
    let dirs = data.filter(n =>
      n.type === 'directory' &&
      n.path &&
      !excludeSet.has(n.name) &&
      !excludeSet.has(n.path)
    );

    // 把 codinghou 里的子项目也加进来（作为独立项目卡片展示）
    const codinghou = data.find(n => n.name === 'codinghou' && n.children);
    if (codinghou) {
      codinghou.children
        .filter(c => c.type === 'directory' && !excludeSet.has(c.name))
        .forEach(c => dirs.push({
          ...c,
          path: `codinghou/${c.name}`,  // 不带 Python/ 前缀，ECS 和 GitHub fallback 都能正确处理
        }));
      // 把 codinghou 本身也保留作为可展开的项目
    }

    state.pythonProjects = dirs.map(node => {
      const cat = classifyProject(node.name);
      return {
        name: node.name,
        path: node.path,    // 顶层项目 path=name，子项目 path=codinghou/name
        category: cat,
        desc: getDefaultDesc(node.name, cat),
        fileCount: countFiles(node),
        treeNode: node,
      };
    }).sort((a, b) => a.name.localeCompare(b.name, 'zh'));

    renderGrid();
  } catch (e) {
    console.error('加载项目列表失败:', e);
    $('gridCards').innerHTML = `<div class="grid-empty">
      <div class="grid-empty-icon">😵</div>
      <div>加载失败: ${escapeHtml(e.message || '网络错误')}</div>
      <button onclick="location.reload()" style="margin-top:12px;padding:6px 14px;border-radius:6px;background:var(--bg-tertiary);border:1px solid var(--border-color);color:var(--text-secondary);cursor:pointer">重新加载</button>
    </div>`;
  }
}

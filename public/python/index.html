<!DOCTYPE html>
<html lang='zh-CN'><head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no'>
<title>Python \u5728\u7ebf\u7f16\u7a0b - CodingZhou</title>
<script src='https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js'></script>
<script>require.config({paths:{vs:'https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs'}});</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg-primary:#0d1117;--bg-secondary:#161b22;--bg-tertiary:#21262d;--bg-overlay:#30363d;--border-color:#30363d;--text-primary:#c9d1d9;--text-secondary:#8b949e;--text-tertiary:#6e7681;--accent-blue:#58a6ff;--accent-green:#3fb950;--accent-yellow:#d29922;--accent-red:#f85149;--accent-purple:#a371f7;--term-bg:#1e1e2e;--term-header-bg:#181825;--term-text:#cdd6f4;--term-stdout:#cdd6f4;--term-stderr:#f38ba8;--term-info:#89b4fa;--term-success:#a6e3a1;--term-error:#f38ba8;--term-border:#313244;--font-mono:'JetBrains Mono','Cascadia Code','Fira Code',Consolas,Monaco,monospace;--font-sans:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;--transition:150ms ease;--radius-sm:6px;--radius-md:8px}
[data-theme='light']{--bg-primary:#fff;--bg-secondary:#f6f8fa;--bg-tertiary:#eaeef2;--bg-overlay:#d0d7de;--border-color:#d0d7de;--text-primary:#24292f;--text-secondary:#57606a;--text-tertiary:#8c959f;--accent-blue:#0969da;--accent-green:#1a7f37;--accent-red:#cf222e;--term-bg:#eff1f5;--term-header-bg:#e6e9ef;--term-text:#4c4f69;--term-stdout:#4c4f69;--term-stderr:#d20f39;--term-info:#1e66f5;--term-success:#40a02b;--term-error:#d20f39;--term-border:#bcc0cc}
[data-theme='light'] body::before{background-image:linear-gradient(rgba(0,0,0,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,0.03) 1px,transparent 1px)}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border-color);border-radius:3px}
body{font-family:var(--font-sans);background:var(--bg-primary);color:var(--text-primary);height:100vh;overflow:hidden;display:flex;flex-direction:column;position:relative;z-index:0}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:-1}
.top-nav{position:sticky;top:0;z-index:9998;height:52px;background:var(--bg-secondary);border-bottom:1px solid var(--border-color);display:flex;align-items:center;padding:0 24px;gap:8px;flex-shrink:0}
.top-nav-brand{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;color:var(--text-primary);margin-right:24px;white-space:nowrap}
.top-nav-brand-logo{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,#306998,#FFD43B);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700}
.top-nav-link{padding:7px 14px;border-radius:8px;font-size:13px;font-weight:500;color:var(--text-secondary);text-decoration:none;transition:all 0.15s;cursor:pointer;white-space:nowrap}
.top-nav-link:hover{color:var(--text-primary);background:var(--bg-tertiary)}
.top-nav-link.active{color:var(--accent-blue);background:rgba(88,166,255,0.1)}
.top-nav-links{display:flex;align-items:center;gap:2px;flex:1}
.theme-toggle-btn{width:36px;height:36px;border-radius:50%;background:var(--bg-secondary);border:1px solid var(--border-color);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-secondary);transition:all 0.15s;flex-shrink:0}
.theme-toggle-btn:hover{background:var(--bg-tertiary);color:var(--text-primary);border-color:var(--accent-blue)}
.theme-toggle-btn svg{width:18px;height:18px}
.theme-toggle-btn .sun-icon{display:block}
.theme-toggle-btn .moon-icon{display:none}
[data-theme='light'] .theme-toggle-btn .sun-icon{display:none}
[data-theme='light'] .theme-toggle-btn .moon-icon{display:block}
.editor-page{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;z-index:1;min-height:0}
.editor-main{flex:1;display:flex;overflow:hidden;min-height:0}
.editor-right{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.resizer{width:3px;background:var(--border-color);cursor:col-resize;flex-shrink:0;transition:background var(--transition)}
.resizer:hover,.resizer.active{background:var(--accent-blue)}
.sidebar{width:240px;min-width:160px;max-width:380px;background:var(--bg-secondary);border-right:1px solid var(--border-color);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
.sidebar-header{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--border-color);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-secondary);flex-shrink:0;gap:4px}
.sidebar-header-title{display:flex;align-items:center;gap:6px}
.sidebar-actions{display:flex;align-items:center;gap:2px}
.sidebar-action{width:24px;height:24px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border-color);background:transparent;color:var(--text-secondary);border-radius:4px;cursor:pointer;font-size:13px;transition:all var(--transition);flex-shrink:0}
.sidebar-action:hover{color:var(--text-primary);background:var(--bg-tertiary);border-color:var(--accent-blue)}
.sidebar-action.delete:hover{color:var(--accent-red);border-color:rgba(248,81,73,0.4)}
.sidebar-action svg{width:13px;height:13px}
.sidebar-tree{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 0}
.sidebar-tree::-webkit-scrollbar{width:5px}
.sidebar-tree::-webkit-scrollbar-thumb{background:var(--border-color);border-radius:3px}
.tree-item{display:flex;align-items:center;padding:3px 12px;cursor:pointer;font-size:13px;color:var(--text-secondary);transition:all var(--transition);gap:6px;white-space:nowrap;min-height:28px}
.tree-item:hover{background:rgba(88,166,255,0.06);color:var(--text-primary)}
.tree-item.active{background:rgba(88,166,255,0.12);color:var(--accent-blue)}
.tree-item svg{width:14px;height:14px;flex-shrink:0}
.tree-item .py{color:var(--accent-blue)}
.tree-item .folder-icon{color:var(--accent-yellow)}
.tree-item .chevron{width:14px;height:14px;transition:transform var(--transition);flex-shrink:0}
.tree-item .chevron.expanded{transform:rotate(90deg)}
.tree-item-name{overflow:hidden;text-overflow:ellipsis;flex:1;font-family:var(--font-mono)}
.code-panel{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.code-header{display:flex;align-items:center;justify-content:space-between;padding:0 8px;height:36px;background:var(--bg-secondary);border-bottom:1px solid var(--border-color);flex-shrink:0;gap:8px}
.code-tabs{display:flex;align-items:center;overflow-x:auto;flex:1;min-width:0}
.code-tab{display:flex;align-items:center;gap:6px;padding:6px 12px;font-size:12px;color:var(--text-secondary);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;transition:all var(--transition);flex-shrink:0;font-family:var(--font-mono)}
.code-tab:hover{color:var(--text-primary)}
.code-tab.active{color:var(--text-primary);border-bottom-color:var(--accent-blue)}
.code-tab .close-tab{width:16px;height:16px;display:flex;align-items:center;justify-content:center;border-radius:3px;opacity:0;transition:opacity var(--transition);font-size:14px;color:var(--text-tertiary)}
.code-tab:hover .close-tab{opacity:0.7}
.code-tab .close-tab:hover{opacity:1;background:rgba(248,81,73,0.2);color:var(--accent-red)}
.code-actions{display:flex;align-items:center;gap:4px;flex-shrink:0}
.code-action-btn{display:flex;align-items:center;gap:4px;padding:4px 8px;background:transparent;border:1px solid transparent;color:var(--text-secondary);border-radius:4px;cursor:pointer;font-size:12px;font-family:var(--font-sans);transition:all var(--transition)}
.code-action-btn:hover{background:var(--bg-tertiary);color:var(--text-primary)}
.code-action-btn svg{width:14px;height:14px}
.code-action-btn.btn-run{color:var(--accent-green);border-color:rgba(63,185,80,0.4)}
.code-action-btn.btn-run:hover{background:rgba(63,185,80,0.12);color:var(--accent-green)}
.code-action-btn.btn-stop{color:var(--accent-red);border-color:rgba(248,81,73,0.4)}
.code-action-btn.btn-stop:hover{background:rgba(248,81,73,0.12);color:var(--accent-red)}
.code-body{flex:1;overflow:auto;position:relative;min-height:0}
.terminal-panel{height:180px;display:flex;flex-direction:column;background:var(--term-bg);border-top:1px solid var(--term-border);overflow:hidden;flex-shrink:0}
.terminal-panel.hidden{display:none}
.terminal-header{display:flex;align-items:center;justify-content:space-between;padding:6px 12px;background:var(--term-header-bg);border-bottom:1px solid var(--term-border);font-size:11px;font-weight:500;color:var(--text-secondary);flex-shrink:0}
.terminal-title{display:flex;align-items:center;gap:6px}
.terminal-title svg{width:12px;height:12px}
.run-status{font-size:10px;padding:2px 6px;border-radius:3px;background:var(--accent-blue);color:#fff;margin-left:8px}
.run-status.running{background:var(--accent-green);animation:pulse-run 1.5s infinite}
.run-status.error{background:var(--accent-red)}
@keyframes pulse-run{0%,100%{opacity:1}50%{opacity:0.6}}
.terminal-close-btn{background:transparent;border:none;outline:none;color:var(--text-tertiary);cursor:pointer;padding:4px;border-radius:4px;transition:all var(--transition)}
.terminal-close-btn:hover{background:rgba(248,81,73,0.15);color:var(--accent-red)}
.terminal-close-btn svg{width:14px;height:14px}
.deps-progress{display:flex;align-items:center;gap:8px;background:var(--bg-secondary);padding:6px 12px;font-size:11px;border-bottom:1px solid var(--border-color)}
.deps-progress-bar{height:4px;background:var(--accent-blue);border-radius:2px;width:100px;min-width:100px;transition:width 0.3s}
.deps-progress-text{color:var(--text-secondary);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.terminal-body{flex:1;padding:10px 12px;font-family:var(--font-mono);font-size:13px;line-height:1.5;color:var(--term-text);overflow-y:auto;background:var(--term-bg)}
.terminal-body::-webkit-scrollbar{width:8px}
.terminal-body::-webkit-scrollbar-thumb{background:var(--term-border);border-radius:4px}
.terminal-output{white-space:pre-wrap;word-break:break-all}
.terminal-output .stdout{color:var(--term-stdout)}
.terminal-output .stderr{color:var(--term-stderr)}
.terminal-output .error{color:var(--term-error);font-weight:500}
.terminal-output .info{color:var(--term-info)}
.terminal-output .success{color:var(--term-success)}
.welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:24px;gap:16px;text-align:center;color:var(--text-tertiary)}
.welcome-icon{font-size:56px}
.welcome h2{font-size:20px;color:var(--text-primary)}
.welcome p{font-size:13px;line-height:1.7;max-width:480px}
.welcome-tips{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;width:100%;max-width:640px}
.welcome-tip{background:var(--bg-secondary);border:1px solid var(--border-color);border-radius:var(--radius-md);padding:12px 16px;font-size:12px;text-align:left}
.welcome-tip b{color:var(--accent-blue)}
.welcome-action-btn{display:inline-flex;align-items:center;gap:8px;padding:8px 20px;background:var(--accent-blue);color:#fff;border:none;border-radius:var(--radius-sm);cursor:pointer;font-size:13px;font-family:var(--font-sans);transition:all var(--transition)}
.welcome-action-btn:hover{background:#4c9aeb}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:10000;justify-content:center;align-items:center}
.modal-overlay.show{display:flex}
.modal-box{background:var(--bg-secondary);border:1px solid var(--border-color);border-radius:var(--radius-md);padding:20px 24px;min-width:320px;display:flex;flex-direction:column;gap:12px}
.modal-box h3{font-size:14px;color:var(--text-primary)}
.modal-box input{width:100%;padding:8px 10px;background:var(--bg-primary);border:1px solid var(--border-color);border-radius:var(--radius-sm);color:var(--text-primary);font-size:13px;font-family:var(--font-mono)}
.modal-box input:focus{outline:none;border-color:var(--accent-blue)}
.modal-box .modal-actions{display:flex;gap:8px;justify-content:flex-end}
.modal-btn{padding:6px 16px;border-radius:4px;cursor:pointer;font-size:12px;font-family:var(--font-sans);transition:all var(--transition)}
.modal-btn.primary{background:var(--accent-blue);color:#fff;border:none}
.modal-btn.primary:hover{background:#4c9aeb}
.modal-btn.secondary{background:var(--bg-tertiary);color:var(--text-primary);border:1px solid var(--border-color)}
.modal-btn.secondary:hover{border-color:var(--accent-blue)}
.tree-empty{padding:20px 12px;text-align:center;color:var(--text-tertiary);font-size:12px;line-height:1.6}
.tree-empty button{margin-top:8px;padding:6px 14px;background:var(--accent-blue);color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:12px}
@media(max-width:768px){.top-nav{padding:0 12px}.top-nav-brand{margin-right:8px}.top-nav-brand span{display:none}.top-nav-link{padding:7px 10px;font-size:12px}.terminal-panel{height:140px}.welcome-tips{grid-template-columns:1fr}.sidebar{width:200px;min-width:140px}.code-action-btn span{display:none}.code-action-btn{padding:4px 6px}.code-action-btn svg{width:16px;height:16px}.code-tab{font-size:11px;padding:5px 8px}}
</style>
</head>

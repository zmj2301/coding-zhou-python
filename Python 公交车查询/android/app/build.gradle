plugins {
    id 'com.android.application'
}

android {
    namespace 'com.workbuddy.xiangtanbus'
    compileSdk 34

    defaultConfig {
        applicationId "com.workbuddy.xiangtanbus"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1.0"
    }

    // 自用不上架，使用 debug 签名（自签名，自动生成）
    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            // 自用场景直接复用 debug 证书，无需配置正式签名
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources.excludes += ['META-INF/*']
    }
}

dependencies {
    // 纯标准库实现，无需第三方依赖（org.json 由 Android 提供）
}
